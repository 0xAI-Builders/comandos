<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="comandos-web" content="push-settings">
  <title>Push settings fixture</title>
</head>
<body>
  <section id="push-settings" data-state="disabled">
    <p id="push-status">Recibe un aviso breve (proyecto y título) cuando ningún CommandOS esté visible.</p>
    <button id="push-enable" type="button">Activar</button>
    <button id="push-disable" type="button" hidden>Desactivar</button>
    <button id="push-test" type="button" hidden>Enviar aviso de prueba</button>
  </section>
</body>
</html>
