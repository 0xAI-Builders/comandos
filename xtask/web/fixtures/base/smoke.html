<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ComandOS · smoke de capturas</title>
<style>
  body { margin: 0; font: 15px/1.4 sans-serif; background: #14161a; color: #e6e6e6; }
  #topbar { display: flex; gap: 12px; align-items: center; padding: 10px 16px; background: #1f232a; border-bottom: 1px solid #2f3540; }
  #topbar b { color: #7cc4ff; }
  #clock { margin-left: auto; font-variant-numeric: tabular-nums; }
  .card { margin: 16px; padding: 12px 16px; border: 1px solid #2f3540; border-radius: 8px; background: #1a1d23; }
  .card .n { font-size: 28px; font-weight: 700; color: #ffd27c; }
</style>
</head>
<body>
<header id="topbar"><b>ComandOS</b><span>smoke</span><span id="clock"></span></header>
<section class="card" id="usage"><div>Uso semanal</div><div class="n" id="pct">…</div></section>
<script>
  // Región volátil: la suite la enmascara.
  document.getElementById('clock').textContent = new Date().toISOString();
  // Fixture JSON: GET /usage/state → usage_state.json.
  fetch('/usage/state').then(r => r.json()).then(s => {
    document.getElementById('pct').textContent = s.pct + ' %';
    window.__comandosReady = true;
  });
</script>
</body>
</html>
