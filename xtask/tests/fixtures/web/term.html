<script>
(function () {
  parent.postMessage({source: 'comandos-term', type: 'ready'}, location.origin);
  try { parent.openPane(1); } catch (_) {}
  try { return parent.S.n; } catch (_) {}
  esc("otro reino: no es el esc del tablero");
  window.addEventListener('message', e => { if (e.data.type === 'theme') {} });
  window.__owns = true;
  parent.postMessage({source: 'comandos-term', type: 'ping'}, location.origin);
  const root = document.documentElement.style;
  root.background = 'negro';
})();
</script>
