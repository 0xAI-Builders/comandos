[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde_json.workspace = true
rusqlite.workspace = true
comandos-core = { path = "../crates/comandos-core" }
nix = { version = "0.31", features = ["signal", "process", "user", "fs"] }
# Arnés de paridad visual y de DOM (shots, png-diff, dom-diff, fixtures).
comandos-domdiff = { path = "../crates/comandos-domdiff" }
png = "=0.18.1"
base64 = "=0.22.1"
# Servidor de fixtures: mismas versiones que comandos-server.
bytes = "=1.12.1"
http-body-util = "=0.1.5"
hyper = { version = "=1.11.1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "net", "macros", "sync", "time"] }
# `web-build` (T4): hash de contenido y medida gzip del presupuesto.
sha2.workspace = true
flate2 = "=1.1.10"
