[package]
name = "comandos-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
comandos-term = { path = "../comandos-term" }
pty-process = { version = "=0.5.3", features = ["async"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake", "connect"] }
comandos-core = { path = "../comandos-core" }
comandos-store = { path = "../comandos-store" }
comandos-runtime = { path = "../comandos-runtime" }
rusqlite.workspace = true
serde_json.workspace = true
# `datetime.now(ZONE)` de la terminal rápida (`quick_terminal::Options`).
chrono.workspace = true
bytes = "=1.12.1"
http = "=1.5.0"
http-body = "=1.1.0"
http-body-util = "=0.1.5"
hyper = { version = "=1.11.1", default-features = false, features = ["server", "client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "macros", "net", "sync", "time", "io-util", "signal", "process", "fs"] }
sha2.workspace = true
getrandom.workspace = true
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "async-await", "sink"] }
# `kill(pid, 0)` como el `os.kill` del Python; misma versión y rasgos que comandos-extensions.
nix = { version = "0.31", features = ["signal", "process", "user", "fs", "resource"] }
# Expresiones fijas de `read_states` (pista de Codex, Claude ocupado, modelos caros).
regex = "=1.13.1"

[dev-dependencies]
hyper = { version = "=1.11.1", default-features = false, features = ["client", "http1"] }
# Solo para escuchar con backlog 5 como el socketserver del Python (ya está en Cargo.lock vía tokio).
socket2 = { version = "=0.6.5", features = ["all"] }

[lints]
workspace = true
