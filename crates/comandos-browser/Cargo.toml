[package]
name = "comandos-browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "comandos_browser"
path = "src/lib.rs"

[[bin]]
name = "comandos-broker-mac"
path = "src/bin/comandos-broker-mac.rs"

[[bin]]
name = "fake-mcp-worker"
path = "tests/support/fake_worker.rs"
test = false
required-features = []

[dependencies]
comandos-core = { path = "../comandos-core" }
serde_json.workspace = true
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "macros", "net", "io-util", "process", "sync", "time", "signal"] }
nix = { version = "=0.31.3", default-features = false, features = ["signal"] }
getrandom.workspace = true

[lints]
workspace = true

[dev-dependencies]
comandos-oracle = { path = "../comandos-oracle" }
