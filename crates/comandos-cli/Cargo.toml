[package]
name = "comandos-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "comandos_cli"
path = "src/lib.rs"

[[bin]]
name = "comandos"
path = "src/main.rs"

[dependencies]
# `install --stage` valida el `manifest.json` de `web/` (T4).
comandos-core = { path = "../comandos-core" }
toml = "=0.8.2"
getrandom.workspace = true
comandos-extensions = { path = "../comandos-extensions" }
comandos-runtime = { path = "../comandos-runtime" }
comandos-server = { path = "../comandos-server" }
sha2.workspace = true
comandos-store = { path = "../comandos-store" }
serde_json.workspace = true
nix = { version = "=0.31.3", default-features = false, features = ["fs", "user"] }

[dev-dependencies]
comandos-core = { path = "../comandos-core" }

[lints]
workspace = true
