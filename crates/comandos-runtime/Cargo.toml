[package]
name = "comandos-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = "=0.22.1"
chrono.workspace = true
chrono-tz.workspace = true
comandos-core = { path = "../comandos-core" }
comandos-store = { path = "../comandos-store" }
serde_json.workspace = true
rusqlite.workspace = true
getrandom.workspace = true
# Colación por locale del glob de bash en `hook claude-status` (ICU4X, sin `unsafe`).
icu_collator = "=2.3.1"
icu_locale_core = "=2.3.0"
# NFKD de `unicodedata.normalize` en `slugify` de las cadenas (ya en el árbol por `icu_collator`).
icu_normalizer = "=2.3.0"
sha2.workspace = true
bytes = "=1.12.1"
http-body-util = "=0.1.5"
hyper = { version = "=1.11.1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "net", "time"] }
# Expresiones fijas de `lib/tui_state.py` portadas con las clases de `re`.
regex = "=1.13.1"
nix = { version = "=0.31.3", default-features = false, features = ["feature", "fs", "poll", "process", "signal", "user"] }
# TOML de `extension_launch._read` (mismas versiones que comandos-extensions).
toml_edit = "=0.25.15"
toml_parser = "=1.1.3"

# News radar: standards-based URL, HTML/XML and bounded HTTPS transport.
url = "=2.5.8"
html5ever = "=0.39.0"
html-escape = "=0.2.15"
encoding_rs = "=0.8.35"
roxmltree = "=0.21.1"
sha1 = "=0.10.6"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls", "json"] }

[dev-dependencies]
# cc-notifyd falso de las pruebas de paridad del hook.
hyper = { version = "=1.11.1", default-features = false, features = ["server", "http1"] }

[lints]
workspace = true
