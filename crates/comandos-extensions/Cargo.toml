[package]
name = "comandos-extensions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde_json.workspace = true
comandos-core = { path = "../comandos-core" }
sha2.workspace = true
serde = "1"
tiktoken-rs = "=0.12.1"
base64 = "0.22"
rustc-hash = "2"
num-bigint = "0.4"
num-traits = "0.2"
regex = "1"
md5 = "=0.8.1"
toml_edit = "=0.25.15"
toml_parser = "=1.1.3"
tokio = { version = "1", features = ["rt", "macros", "io-util", "io-std", "process", "sync", "time", "signal"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "form", "rustls", "stream"] }
futures-util = "0.3"
url = "2"
chrono = "0.4"
nix = { version = "0.31", features = ["signal", "process", "user", "fs", "resource"] }


[lints]
workspace = true
