[package]
name = "comandos-extensions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde_json.workspace = true
sha2.workspace = true
serde = "1"
tokio = { version = "1", features = ["rt", "macros", "io-util", "io-std", "process", "sync", "time", "signal"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "form", "rustls", "stream"] }
futures-util = "0.3"
url = "2"
chrono = "0.4"
nix = { version = "0.31", features = ["signal", "process", "user"] }

[lints]
workspace = true
