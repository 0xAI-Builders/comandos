<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>ComandOS · terminal</title>
<link rel="stylesheet" href="../assets/xterm/xterm.css">
<!-- Cargamos la fuente bundleada por @font-face para que WebKit la use aun si
     fontconfig del sistema no la conoce. -->
<style>
  @font-face {
    font-family: 'JetBrainsMono Nerd Font Mono';
    font-weight: 400; font-style: normal;
    src: url('../assets/fonts/JetBrainsMono/JetBrainsMonoNerdFontMono-Regular.ttf') format('truetype');
  }
  @font-face {
    font-family: 'JetBrainsMono Nerd Font Mono';
    font-weight: 400; font-style: italic;
    src: url('../assets/fonts/JetBrainsMono/JetBrainsMonoNerdFontMono-Italic.ttf') format('truetype');
  }
  @font-face {
    font-family: 'JetBrainsMono Nerd Font Mono';
    font-weight: 700; font-style: normal;
    src: url('../assets/fonts/JetBrainsMono/JetBrainsMonoNerdFontMono-Bold.ttf') format('truetype');
  }
  @font-face {
    font-family: 'JetBrainsMono Nerd Font Mono';
    font-weight: 700; font-style: italic;
    src: url('../assets/fonts/JetBrainsMono/JetBrainsMonoNerdFontMono-BoldItalic.ttf') format('truetype');
  }
  :root {
    --term-bg:#0A0D13; --term-panel:#121722; --term-panel2:#161C29;
    --term-line:#222A3A; --term-line2:#2E3852; --term-text:#EAF0FB;
    --term-dim:#9AA6BF; --term-faint:#5E6980; --term-brand:#8B7CFF;
  }
  html, body { margin: 0; padding: 0; width: 100%; max-width: 100%; height: 100%; background:var(--term-bg); color:var(--term-text); overflow: hidden; }
  #term-shell { width: 100%; max-width: 100%; min-width: 0; height: 100%; display: grid;
    grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto;
    overflow: hidden; background:var(--term-bg); }
  #term {
    width: 100%; max-width: 100%;
    padding: 8px 6px 6px 10px;
    box-sizing: border-box;
    min-width: 0; min-height: 0;
    overflow: hidden;
  }
  #term-toolbar { box-sizing: border-box; display: flex; gap: 6px;
    width: 100%; max-width: 100%; min-width: 0; overflow-x: auto;
    padding: 6px; border-top: 1px solid var(--term-line2); background:var(--term-panel);
    overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; touch-action: pan-x; }
  #term-toolbar button { box-sizing: border-box; flex: 0 0 auto; min-width: 44px; height: 44px; padding: 0 10px;
    border: 1px solid var(--term-line2); border-radius: 4px; background:var(--term-panel2); color:var(--term-text);
    font: 700 12px 'JetBrainsMono Nerd Font Mono', monospace; }
  #term-toolbar button.on { background:var(--term-brand); border-color:var(--term-brand); color:var(--term-bg); }
  #term-toolbar button:disabled { opacity: .55; }
  #term-toolbar svg { width: 20px; height: 20px; fill: none; stroke: currentColor;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
  #paste-dialog { width: min(420px, calc(100vw - 32px)); color:var(--term-text); background:var(--term-panel);
    border: 1px solid var(--term-line2); border-radius: 6px; padding: 14px; }
  #paste-dialog::backdrop { background: rgba(0, 0, 0, .55); }
  #paste-dialog form { display: grid; gap: 10px; }
  #paste-text { min-height: 132px; box-sizing: border-box; resize: vertical; color: inherit;
    background:var(--term-bg); border: 1px solid var(--term-line2); font: 13px 'JetBrainsMono Nerd Font Mono', monospace; }
  #paste-dialog form > div { display: flex; justify-content: flex-end; gap: 8px; }
  #paste-dialog button { background:var(--term-panel2); border:1px solid var(--term-line2); color:var(--term-text);
    border-radius:4px; padding:6px 10px; font:inherit; }
  #paste-dialog button:hover { border-color:var(--term-brand); }
  #err {
    position: absolute; inset: 0; display: none;
    color:var(--term-brand); font-family: 'JetBrainsMono Nerd Font Mono', monospace;
    padding: 16px; white-space: pre-wrap;
  }
  #dbg {
    position: fixed; right: 8px; top: 8px; z-index: 9; display: none;
    color:var(--term-brand); font-family: 'JetBrainsMono Nerd Font Mono', monospace;
    font-size: 11px; background:var(--term-panel); padding: 4px 8px;
    border-radius: 4px; max-width: 60vw; white-space: pre-wrap;
  }
  #dbg.on { display: block; }
  *{scrollbar-width:thin;scrollbar-color:var(--term-line2) var(--term-bg)}
  *::-webkit-scrollbar{width:10px;height:10px}
  *::-webkit-scrollbar-track{background:var(--term-bg)}
  *::-webkit-scrollbar-thumb{background:var(--term-line2);border-radius:10px;border:3px solid var(--term-bg);background-clip:padding-box}
  *::-webkit-scrollbar-thumb:hover{background:var(--term-brand);background-clip:padding-box}
</style>
</head>
<body>
<div id="term-shell">
  <div id="term"></div>
  <div id="term-toolbar" role="toolbar" aria-label="Controles de terminal" hidden>
    <button type="button" data-action="mode" aria-pressed="false">Seleccionar</button>
    <button type="button" data-key="escape">Esc</button>
    <button type="button" data-action="ctrl" aria-pressed="false">Ctrl</button>
    <button type="button" data-key="tab">Tab</button>
    <button type="button" data-key="left" aria-label="Izquierda" title="Izquierda"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
    <button type="button" data-key="up" aria-label="Arriba" title="Arriba"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg></button>
    <button type="button" data-key="down" aria-label="Abajo" title="Abajo"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
    <button type="button" data-key="right" aria-label="Derecha" title="Derecha"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
    <button type="button" data-action="paste" aria-label="Pegar" title="Pegar"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M15 4h2a2 2 0 0 1 2 2v14H5V6a2 2 0 0 1 2-2h2"/><rect width="6" height="4" x="9" y="2" rx="1"/><path d="m9 14 2 2 4-4"/></svg></button>
  </div>
</div>
<div id="err"></div>
<div id="dbg">iniciando…</div>
<dialog id="paste-dialog">
  <form method="dialog">
    <textarea id="paste-text" aria-label="Texto para pegar"></textarea>
    <div><button value="cancel">Cancelar</button><button id="paste-submit" value="default">Pegar</button></div>
  </form>
</dialog>

<script src="../assets/xterm/xterm.js"></script>
<script src="../assets/xterm/addon-fit.js"></script>
<script src="../assets/xterm/addon-web-links.js"></script>
<script src="../assets/xterm/addon-canvas.js"></script>
<script src="../assets/opentype/opentype.min.js"></script>
<script src="../assets/xterm/addon-ligatures-web.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const arg    = params.get('arg') || '';
  const theme  = (params.get('theme') || 'noche').toLowerCase();
  const debug  = params.get('debug') === '1';

  const dbgEl = document.getElementById('dbg');
  if (debug) dbgEl.classList.add('on');
  const dbg = (m) => { if (debug) dbgEl.textContent = m; };
  window.addEventListener('error', (e) => dbg('JS error: ' + (e.message || e.error)));
  window.addEventListener('unhandledrejection', (e) => dbg('rej: ' + (e.reason && e.reason.message || e.reason)));
  // ttyd toma la sesión del querystring del WS (por --url-arg).
  // Remoto (servida por ttyd bajo /term via tailscale): ws same-origin
  // wss://host/term/ws. La app pasa ?ws= explicito (file:// no tiene origen).
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const basePath = location.pathname.replace(/\/[^/]*$/, '');
  const wsBase = params.get('ws')
    || (location.host ? `${proto}://${location.host}${basePath}/ws`
                      : `ws://127.0.0.1:4779/ws`);
  const ws_url = arg ? `${wsBase}?arg=${encodeURIComponent(arg)}` : wsBase;

  const THEMES = {
    noche:  {background:'#0A0D13',foreground:'#EAF0FB',cursor:'#FFAE1A',cursorAccent:'#0A0D13',selectionBackground:'#2E3852',panel:'#121722',panel2:'#161C29',line:'#222A3A',line2:'#2E3852',dim:'#9AA6BF',faint:'#5E6980',brand:'#8B7CFF'},
    dia:    {background:'#F7F8FB',foreground:'#1B2130',cursor:'#B26A00',cursorAccent:'#F7F8FB',selectionBackground:'#D9DEE8',panel:'#FBFCFE',panel2:'#EDF0F6',line:'#D9DEE8',line2:'#C3CAD8',dim:'#4E5A70',faint:'#8892A6',brand:'#5B4BD6'},
    calido: {background:'#161009',foreground:'#F2E5D0',cursor:'#FFB454',cursorAccent:'#161009',selectionBackground:'#36291A',panel:'#1F1811',panel2:'#261D14',line:'#36291A',line2:'#4A3823',dim:'#BCA98C',faint:'#8A7A5F',brand:'#E0A458'},
    termius:{background:'#0E1620',foreground:'#D6E0EA',cursor:'#FFAE1A',cursorAccent:'#0E1620',selectionBackground:'#25384F',panel:'#141E2A',panel2:'#182432',line:'#1C2733',line2:'#25384F',dim:'#8FA0B4',faint:'#5C6B80',brand:'#4CE07A'},
    bruno:  {background:'#1A1A1A',foreground:'#CCCCCC',cursor:'#E4AE49',cursorAccent:'#1A1A1A',selectionBackground:'#444444',panel:'#222224',panel2:'#26292B',line:'#333333',line2:'#444444',dim:'#AAAAAA',faint:'#999999',brand:'#E4AE49',black:'#1A1A1A',red:'#DA462F',green:'#73E89A',yellow:'#FAD075',blue:'#8BC2F9',magenta:'#D691ED',cyan:'#7DDFF2',white:'#CCCCCC',brightBlack:'#666666',brightRed:'#F38172',brightGreen:'#73E89A',brightYellow:'#FAD075',brightBlue:'#8BC2F9',brightMagenta:'#D691ED',brightCyan:'#7DDFF2',brightWhite:'#FFFFFF'},
  };
  let activeTheme = THEMES[theme] ? theme : 'noche';

  const showErr = (msg) => {
    const e = document.getElementById('err');
    e.textContent = msg;
    e.style.display = 'block';
  };

  function openWebLink(_event, url) {
    const link = document.createElement('a');
    link.href = url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.referrerPolicy = 'no-referrer';
    document.body.appendChild(link);
    link.click();
    link.remove();
  }

  const term = new Terminal({
    fontFamily: "'JetBrainsMono Nerd Font Mono', 'JetBrainsMono Nerd Font', 'JetBrains Mono', 'DejaVu Sans Mono', monospace",
    fontSize: 14,
    lineHeight: 1.15,
    letterSpacing: 0,
    cursorBlink: true,
    cursorStyle: 'block',
    scrollback: 10000,
    allowProposedApi: true,   // requerido por CanvasAddon para exponer ligas
    theme: THEMES[activeTheme],
    windowsMode: false,
  });

  const fit    = new FitAddon.FitAddon();
  const links  = new WebLinksAddon.WebLinksAddon(openWebLink);
  const canvas = new CanvasAddon.CanvasAddon();
  term.loadAddon(fit);
  term.loadAddon(links);
  term.open(document.getElementById('term'));
  // Canvas addon debe cargarse DESPUES de open() y antes de escribir.
  try { term.loadAddon(canvas); } catch (e) { console.warn('CanvasAddon failed', e); }

  // Ligaduras via opentype.js overlay (browser puro) — SOLO desktop: en
  // tactil el overlay redibuja carisimo y hace lento el resize de panes.
  const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  const toolbar = document.getElementById('term-toolbar');
  toolbar.hidden = !IS_TOUCH;
  const themeCfg = THEMES[activeTheme];
  let ligatures = null;
  function installLigatures(cfg) {
    const liga = new LigaturesWebAddon({
      fontUrl: '../assets/fonts/JetBrainsMono/JetBrainsMonoNerdFontMono-Regular.ttf',
      fontSize: 14,
      foreground: cfg.foreground,
      background: cfg.background,
      debug: debug,
    });
    try {
      term.loadAddon(liga);
      ligatures = liga;
    } catch (e) { dbg('LigaturesWebAddon failed: ' + e.message); }
  }
  function refreshLigatures(cfg) {
    if (IS_TOUCH || !ligatures) return;
    try { ligatures.dispose(); } catch (_) {}
    ligatures = null;
    installLigatures(cfg);
  }
  if (!IS_TOUCH) installLigatures(themeCfg);

  function applyTerminalTheme(name) {
    if (!THEMES[name]) return false;
    const changed = activeTheme !== name;
    activeTheme = name;
    const cfg = THEMES[activeTheme];
    term.options.theme = cfg;
    const root = document.documentElement.style;
    root.background = cfg.background;
    root.setProperty('--term-bg', cfg.background);
    root.setProperty('--term-panel', cfg.panel);
    root.setProperty('--term-panel2', cfg.panel2);
    root.setProperty('--term-line', cfg.line);
    root.setProperty('--term-line2', cfg.line2);
    root.setProperty('--term-text', cfg.foreground);
    root.setProperty('--term-dim', cfg.dim);
    root.setProperty('--term-faint', cfg.faint);
    root.setProperty('--term-brand', cfg.brand);
    document.body.style.background = cfg.background;
    document.getElementById('term-shell').style.background = cfg.background;
    if (changed) refreshLigatures(cfg);
    return true;
  }

  function handleTerminalMessage(event) {
    const data = event.data;
    if (event.origin !== location.origin || event.source !== parent ||
        !data || data.source !== 'comandos') return false;
    if (data.type === 'theme') {
      if (!THEMES[data.theme]) return false;
      return applyTerminalTheme(data.theme);
    }
    if (data.type === 'interaction-state') {
      applyInteractionState(data);
      return true;
    }
    return false;
  }

  applyTerminalTheme(activeTheme);

  let fitFrame = 0;
  let heightFitTimer = 0;
  let columnReloadTimer = 0;
  let fitDeferredForSelection = false;
  let resizeDisposed = false;

  function clearResizeTimers() {
    if (fitFrame) cancelAnimationFrame(fitFrame);
    if (heightFitTimer) clearTimeout(heightFitTimer);
    if (columnReloadTimer) clearTimeout(columnReloadTimer);
    fitFrame = heightFitTimer = columnReloadTimer = 0;
  }

  function commitColumnReload() {
    columnReloadTimer = 0;
    if (resizeDisposed) return;
    if (term.hasSelection()) {
      fitDeferredForSelection = true;
      return;
    }
    location.reload();
  }

  function commitHeightFit() {
    heightFitTimer = 0;
    if (resizeDisposed) return;
    try {
      const finalSize = fit.proposeDimensions();
      if (!finalSize) return;
      if (finalSize.cols !== term.cols) {
        scheduleFit();
        return;
      }
      if (finalSize.rows !== term.rows) fit.fit();
    } catch (_) {
      heightFitTimer = 0;
    }
  }

  function coordinateResize() {
    fitFrame = 0;
    if (resizeDisposed) return;
    try {
      const next = fit.proposeDimensions();
      if (!next) return;
      if (next.cols === term.cols && next.rows === term.rows) {
        if (heightFitTimer) clearTimeout(heightFitTimer);
        if (columnReloadTimer) clearTimeout(columnReloadTimer);
        heightFitTimer = columnReloadTimer = 0;
        return;
      }
      if (next.cols !== term.cols) {
        if (heightFitTimer) clearTimeout(heightFitTimer);
        heightFitTimer = 0;
        if (term.hasSelection()) {
          fitDeferredForSelection = true;
          if (columnReloadTimer) clearTimeout(columnReloadTimer);
          columnReloadTimer = 0;
          return;
        }
        fitDeferredForSelection = false;
        if (columnReloadTimer) clearTimeout(columnReloadTimer);
        columnReloadTimer = setTimeout(commitColumnReload, 180);
        return;
      }
      if (columnReloadTimer) clearTimeout(columnReloadTimer);
      columnReloadTimer = 0;
      if (heightFitTimer) clearTimeout(heightFitTimer);
      heightFitTimer = setTimeout(commitHeightFit, 120);
    } catch (_) {
      clearResizeTimers();
    }
  }

  function scheduleFit() {
    if (!resizeDisposed && !fitFrame) fitFrame = requestAnimationFrame(coordinateResize);
  }

  const resizeObserver = typeof ResizeObserver === 'function'
    ? new ResizeObserver(scheduleFit) : null;
  resizeObserver?.observe(document.getElementById('term'));

  function disposeResizeCoordinator() {
    resizeDisposed = true;
    clearResizeTimers();
    resizeObserver?.disconnect();
  }

  // El primer fit es sincrono: el payload de autenticacion debe llevar la
  // geometria real aun si el WebSocket abre antes del siguiente frame.
  try { fit.fit(); } catch (_) {}
  window.addEventListener('resize', scheduleFit);
  window.visualViewport?.addEventListener('resize', scheduleFit);
  window.addEventListener('pagehide', disposeResizeCoordinator);
  function resumeDeferredFitAfterSelection() {
    if (fitDeferredForSelection && !term.hasSelection()) {
      fitDeferredForSelection = false;
      scheduleFit();
    }
  }
  term.onSelectionChange(resumeDeferredFitAfterSelection);

  // ttyd protocol (ver ttyd/src/protocol.c y client/xterm/index.ts):
  //   auth  : primer mensaje = JSON crudo {AuthToken, columns, rows} (sin prefix)
  //   client -> server:  '0'+bytes = INPUT  '1'+JSON = RESIZE
  //                      '2' = PAUSE  '3' = RESUME
  //   server -> client:  '0'+bytes = OUTPUT '1'+txt  = TITLE  '2'+JSON = PREFS
  const ws = new WebSocket(ws_url, ['tty']);
  ws.binaryType = 'arraybuffer';
  const enc = new TextEncoder();
  const dec = new TextDecoder();

  const sendInput = (data) => {
    if (ws.readyState !== 1) return;
    const buf = enc.encode(data);
    const out = new Uint8Array(buf.length + 1);
    out[0] = 0x30; // '0' = INPUT (client→server)
    out.set(buf, 1);
    ws.send(out);
  };
  let lastResize = '';
  function sendResize(size) {
    if (ws.readyState !== 1) return;
    const cols = size && size.cols !== undefined ? size.cols : term.cols;
    const rows = size && size.rows !== undefined ? size.rows : term.rows;
    const key = `${cols}x${rows}`;
    if (key === lastResize) return;
    lastResize = key;
    ws.send('1' + JSON.stringify({columns: cols, rows}));
  }

  ws.addEventListener('open', () => {
    dbg(`WS open (proto=${ws.protocol||'-'}), auth cols=${term.cols} rows=${term.rows}`);
    // ttyd espera el primer mensaje como JSON crudo (SIN prefijo de comando).
    lastResize = `${term.cols}x${term.rows}`;
    ws.send(JSON.stringify({
      AuthToken: '',
      columns: term.cols,
      rows: term.rows,
    }));
    setTimeout(scheduleFit, 30);
  });

  ws.addEventListener('message', (ev) => {
    const data = ev.data;
    // Puede llegar como ArrayBuffer o string según el frame de ttyd.
    if (typeof data === 'string') {
      const cmd = data[0];
      const rest = data.slice(1);
      if (cmd === '0') term.write(rest);
      else if (cmd === '1') document.title = rest;
      else if (cmd === '2') {
        try {
          const prefs = JSON.parse(rest);
          if (prefs.fontFamily) term.options.fontFamily = prefs.fontFamily;
          if (prefs.fontSize)   term.options.fontSize   = +prefs.fontSize;
          scheduleFit();
        } catch (_) {}
      }
    } else {
      const bytes = new Uint8Array(data);
      const cmd = String.fromCharCode(bytes[0]);
      const rest = bytes.subarray(1);
      if (cmd === '0') term.write(rest);
      else if (cmd === '1') document.title = dec.decode(rest);
      else if (cmd === '2') {
        try {
          const prefs = JSON.parse(dec.decode(rest));
          if (prefs.fontFamily) term.options.fontFamily = prefs.fontFamily;
          if (prefs.fontSize)   term.options.fontSize   = +prefs.fontSize;
          scheduleFit();
        } catch (_) {}
      }
    }
  });

  ws.addEventListener('close', (ev) => {
    dbg(`WS close code=${ev.code} reason="${ev.reason||''}" clean=${ev.wasClean}`);
    term.write(`\r\n\x1b[90m[conexión cerrada${ev.code ? ' · '+ev.code : ''}]\x1b[0m\r\n`);
  });
  ws.addEventListener('close', disposeResizeCoordinator);
  ws.addEventListener('error', (e) => {
    dbg(`WS error a ${ws_url}`);
    showErr(`No pude conectar a ${ws_url}\n\nAsegurate de que cc-webterm esté corriendo:\n  cc-webterm status`);
  });

  term.onData(sendTerminalData);
  term.onResize(sendResize);

  const TOOLBAR_KEYS = Object.freeze({
    escape: '\x1b', tab: '\t', left: '\x1b[D', up: '\x1b[A',
    down: '\x1b[B', right: '\x1b[C',
  });
  let ctrlArmed = false;
  let pasting = false;
  let interactionState = {known:false, busy:false, selecting:false};

  function controlByte(data) {
    if (typeof data !== 'string' || data.length !== 1) return null;
    const code = data.charCodeAt(0);
    if (code === 32) return '\x00';
    if ((code >= 64 && code <= 95) || (code >= 97 && code <= 122))
      return String.fromCharCode(code & 31);
    return null;
  }

  function setCtrlArmed(on) {
    ctrlArmed = !!on;
    const button = document.querySelector('[data-action="ctrl"]');
    button?.classList.toggle('on', ctrlArmed);
    button?.setAttribute('aria-pressed', String(ctrlArmed));
  }

  function focusTerminal() {
    try { term.textarea?.focus({preventScroll:true}); } catch (_) { term.focus(); }
  }

  function sendTerminalData(data) {
    if (ctrlArmed && !pasting) {
      const converted = controlByte(data);
      if (converted !== null) {
        setCtrlArmed(false);
        sendInput(converted);
        return;
      }
    }
    sendInput(data);
  }

  function sendToolbarKey(name) {
    const data = TOOLBAR_KEYS[name];
    if (data) sendInput(data);
    focusTerminal();
  }

  function pasteTerminalText(text) {
    if (!text) return false;
    pasting = true;
    try { term.paste(text); } finally { pasting = false; }
    return true;
  }

  async function requestClipboardPaste() {
    try {
      const text = await navigator.clipboard.readText();
      pasteTerminalText(text);
      focusTerminal();
    } catch (_) {
      document.getElementById('paste-dialog').showModal();
    }
  }

  async function copyTerminalSelection() {
    const text = term.getSelection();
    if (!text) return false;
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (_) {
      try { return document.execCommand('copy'); } catch (_) { return false; }
    }
  }

  function handleTerminalKeyEvent(event) {
    const copyShortcut = event.type === 'keydown' && !event.altKey &&
      (event.ctrlKey || event.metaKey) && String(event.key).toLowerCase() === 'c';
    if (!copyShortcut || !term.hasSelection()) return true;
    void copyTerminalSelection();
    return false;
  }

  term.attachCustomKeyEventHandler(handleTerminalKeyEvent);

  function applyInteractionState(next) {
    interactionState = {
      known: !!next?.known,
      busy: !!next?.busy,
      selecting: !!next?.selecting,
    };
    const button = document.querySelector('[data-action="mode"]');
    if (!button) return;
    button.disabled = !interactionState.known || interactionState.busy;
    button.classList.toggle('on', interactionState.known && interactionState.selecting);
    button.setAttribute('aria-pressed', interactionState.known
      ? String(interactionState.selecting) : 'mixed');
    if (!interactionState.known) button.textContent = 'Comprobando…';
    else button.textContent = interactionState.selecting ? 'Interactuar' : 'Seleccionar';
  }

  function requestInteractionMode() {
    if (!interactionState.known || interactionState.busy) return false;
    parent.postMessage({
      source:'comandos-term', type:'interaction-request',
      selecting:!interactionState.selecting,
    }, location.origin);
    return true;
  }

  applyInteractionState(interactionState);
  toolbar.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch') e.preventDefault();
  });
  toolbar.addEventListener('click', e => {
    const button = e.target.closest('button');
    if (!button) return;
    if (button.dataset.key) sendToolbarKey(button.dataset.key);
    else if (button.dataset.action === 'ctrl') {
      setCtrlArmed(!ctrlArmed);
      focusTerminal();
    }
    else if (button.dataset.action === 'paste') requestClipboardPaste();
    else if (button.dataset.action === 'mode') {
      requestInteractionMode();
      focusTerminal();
    }
  });
  const pasteDialog = document.getElementById('paste-dialog');
  pasteDialog.querySelector('form').addEventListener('submit', e => {
    if (e.submitter?.id !== 'paste-submit') return;
    const text = document.getElementById('paste-text');
    pasteTerminalText(text.value);
    text.value = '';
  });
  pasteDialog.addEventListener('close', focusTerminal);
  window.addEventListener('message', handleTerminalMessage);
  if (parent !== window) parent.postMessage({source:'comandos-term', type:'ready'}, location.origin);

  // Teclado MOVIL (GBoard/Android): borrar y Enter llegan como eventos
  // beforeinput sin keydown — xterm.js los pierde con el buffer de
  // composicion vacio y "borrar no borra". Los interceptamos y mandamos
  // la tecla real; preventDefault evita el doble envio.
  // --- GESTO TÁCTIL: dejar el dedo (~220ms) CERCA de una separación de
  // panes y arrastrar = resize. Mejoras de fluidez y precisión:
  //  · SNAP al borde: lee el buffer y busca │ o ─ hasta ±2 celdas del dedo;
  //    ancla el press al borde exacto y BLOQUEA el eje (│=horizontal,
  //    ─=vertical). Ya no hay que atinarle al pixel.
  //  · Motions coalescidos a 1 por frame (rAF): tmux no se atraganta.
  //  · Solo cuando la app pidió mouse tracking; si no, scroll normal.
  window.__comandosOwnsTouchGestures = true;
  const screenEl = () => document.querySelector('.xterm-screen');
  const mouseOn = () => { try { return term.modes.mouseTrackingMode !== 'none'; } catch (_) { return false; } };
  const selectingText = () => interactionState.known && interactionState.selecting;
  function terminalUiOwnsEvent(event) {
    const insideUi = node => node && typeof node.closest === 'function' &&
      node.closest('#term-toolbar, #paste-dialog');
    const path = typeof event?.composedPath === 'function' ? event.composedPath() : [];
    return path.some(insideUi) || !!insideUi(event?.target);
  }
  let paneRefreshPending = false;
  let paneRefreshTimer = 0;
  function requestPaneRefreshAfterResize() {
    paneRefreshPending = true;
    if (paneRefreshTimer) {
      clearTimeout(paneRefreshTimer);
      paneRefreshTimer = 0;
    }
  }
  function refreshPaneAfterWrite() {
    if (!paneRefreshPending) return;
    if (paneRefreshTimer) clearTimeout(paneRefreshTimer);
    paneRefreshTimer = setTimeout(() => {
      paneRefreshTimer = 0;
      if (!paneRefreshPending) return;
      paneRefreshPending = false;
      try { term.refresh(0, Math.max(0, term.rows - 1)); } catch (_) {}
    }, 180);
  }
  term.onWriteParsed(refreshPaneAfterWrite);

  let paneMouseDrag = null;
  document.addEventListener('mousedown', (e) => {
    if (terminalUiOwnsEvent(e) || e.button !== 0 || selectingText() || !mouseOn()) return;
    const cell = cellFromTouch(e);
    if (!cell || !snapToBorder(cell)) return;
    paneMouseDrag = {x: e.clientX, y: e.clientY, moved: false};
  }, true);
  document.addEventListener('mousemove', (e) => {
    if (!paneMouseDrag || paneMouseDrag.moved) return;
    paneMouseDrag.moved = Math.hypot(
      e.clientX - paneMouseDrag.x, e.clientY - paneMouseDrag.y) > 4;
  }, true);
  document.addEventListener('mouseup', () => {
    if (paneMouseDrag?.moved) requestPaneRefreshAfterResize();
    paneMouseDrag = null;
  }, true);
  const cellFromTouch = (t) => {
    const el = screenEl(); if (!el || !t) return null;
    const r = el.getBoundingClientRect();
    if (!r.width || !r.height || !term.cols || !term.rows) return null;
    const col = Math.max(1, Math.min(term.cols, Math.floor((t.clientX - r.left) / (r.width / term.cols)) + 1));
    const row = Math.max(1, Math.min(term.rows, Math.floor((t.clientY - r.top) / (r.height / term.rows)) + 1));
    return { col, row };
  };
  const cellChar = (col, row) => {
    if (!Number.isInteger(col) || !Number.isInteger(row) ||
        col < 1 || col > term.cols || row < 1 || row > term.rows) return '';
    try {
      const y = term.buffer.active.viewportY + row - 1;
      const line = term.buffer.active.getLine(y);
      return line ? (line.getCell(col - 1)?.getChars() || '') : '';
    } catch (_) { return ''; }
  };
  const JUNCTIONS = '┌┐└┘├┤┬┴┼╭╮╯╰╔╗╚╝╠╣╦╩╬';
  const VBORDER = `│┃|║╎┆┊╏┇┋${JUNCTIONS}`; // borde vertical → se arrastra en X
  const HBORDER = `─━-═╌┄┈╍┅┉${JUNCTIONS}`; // borde horizontal → se arrastra en Y
  const hasVerticalContinuity = (col, row) => {
    let count = 0;
    for (let r = row - 2; r <= row + 2; r++) {
      const ch = cellChar(col, r);
      if (ch && VBORDER.includes(ch) && ++count >= 2) return true;
    }
    return false;
  };
  const hasHorizontalContinuity = (col, row) => {
    let count = 0;
    for (let c = col - 2; c <= col + 2; c++) {
      const ch = cellChar(c, row);
      if (ch && HBORDER.includes(ch) && ++count >= 2) return true;
    }
    return false;
  };
  // Busca un borde continuo hasta ±2 celdas del dedo y bloquea su eje.
  const snapToBorder = (c) => {
    for (const d of [0, -1, 1, -2, 2]) {
      const col = c.col + d;
      const ch = cellChar(col, c.row);
      if (ch && VBORDER.includes(ch) && hasVerticalContinuity(col, c.row)) {
        return { col, row: c.row, axis: 'x' };
      }
    }
    for (const d of [0, -1, 1, -2, 2]) {
      const row = c.row + d;
      const ch = cellChar(c.col, row);
      if (ch && HBORDER.includes(ch) && hasHorizontalContinuity(c.col, row)) {
        return { col: c.col, row, axis: 'y' };
      }
    }
    return null;
  };
  const sgr = (btn, c, release) => `\x1b[<${btn};${c.col};${c.row}${release ? 'm' : 'M'}`;
  const IND = document.createElement('div');
  IND.style.cssText = 'position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:9;' +
    'display:none;background:rgba(0,0,0,.7);color:#4CE07A;font:12px monospace;' +
    'padding:5px 12px;border-radius:8px;pointer-events:none';
  document.body.appendChild(IND);

  const TOUCH_WHEEL_STEP = 56;
  const TOUCH_WHEEL_MAX_TICKS = 3;
  const gesture = {
    phase: 'idle', touchId: null, sx: 0, sy: 0, lastY: 0,
    wheelAccum: 0, timer: 0, frame: 0,
    anchor: null, lastCell: null, pendingCell: null, pressSent: false,
  };
  const sameCell = (a, b) => !!a && !!b && a.col === b.col && a.row === b.row;
  const touchById = (list) => {
    if (!list || !list.length) return null;
    if (gesture.touchId === undefined) return list[0];
    for (let i = 0; i < list.length; i++) {
      const touch = list[i] || (typeof list.item === 'function' ? list.item(i) : null);
      if (touch && touch.identifier === gesture.touchId) return touch;
    }
    return null;
  };
  const termTargetAt = (touch, fallback) =>
    document.elementFromPoint?.(touch.clientX, touch.clientY) ||
    fallback || screenEl() || document.body;
  const emitWheel = (target, dy, touch) => {
    if (!target || !dy || typeof window.WheelEvent !== 'function') return false;
    target.dispatchEvent(new window.WheelEvent('wheel', {
      deltaY: dy, deltaMode: 0, bubbles: true, cancelable: true,
      clientX: touch.clientX, clientY: touch.clientY,
      screenX: touch.screenX, screenY: touch.screenY,
    }));
    return true;
  };
  const cellOnLockedAxis = (touch) => {
    const c = cellFromTouch(touch);
    if (!c || !gesture.anchor) return null;
    return gesture.anchor.axis === 'x'
      ? { col: c.col, row: gesture.anchor.row }
      : { col: gesture.anchor.col, row: c.row };
  };
  const sendMotion = () => {
    gesture.frame = 0;
    if (gesture.phase !== 'resizing' || !gesture.pressSent ||
        ws.readyState !== 1 || !gesture.pendingCell) return;
    const c = gesture.pendingCell;
    gesture.pendingCell = null;
    if (!sameCell(c, gesture.lastCell)) {
      sendInput(sgr(32, c, false));
      gesture.lastCell = c;
    }
  };
  const resetGesture = () => {
    gesture.phase = 'idle';
    gesture.touchId = null;
    gesture.sx = gesture.sy = gesture.lastY = 0;
    gesture.wheelAccum = 0;
    gesture.timer = gesture.frame = 0;
    gesture.anchor = gesture.lastCell = gesture.pendingCell = null;
    gesture.pressSent = false;
    IND.style.display = 'none';
  };
  const finishGesture = () => {
    if (gesture.timer) clearTimeout(gesture.timer);
    gesture.timer = 0;
    if (gesture.frame) cancelAnimationFrame(gesture.frame);
    gesture.frame = 0;
    if (gesture.phase === 'resizing' && gesture.pressSent && ws.readyState === 1) {
      sendMotion();
      if (gesture.lastCell) sendInput(sgr(0, gesture.lastCell, true));
      requestPaneRefreshAfterResize();
    }
    resetGesture();
  };
  const beginScroll = (e, touch) => {
    gesture.phase = 'scrolling';
    const dy = gesture.lastY - touch.clientY;
    gesture.lastY = touch.clientY;
    gesture.wheelAccum += dy;
    const ticks = Math.trunc(gesture.wheelAccum / TOUCH_WHEEL_STEP);
    const capped = Math.max(-TOUCH_WHEEL_MAX_TICKS, Math.min(TOUCH_WHEEL_MAX_TICKS, ticks));
    if (capped && emitWheel(termTargetAt(touch, e.target), capped * TOUCH_WHEEL_STEP, touch)) {
      gesture.wheelAccum -= capped * TOUCH_WHEEL_STEP;
    }
    e.preventDefault();
    e.stopPropagation();
  };
  const tryEngageResize = () => {
    gesture.timer = 0;
    if (gesture.phase !== 'pending' || selectingText() || !mouseOn() || ws.readyState !== 1) return;
    const raw = cellFromTouch({clientX: gesture.sx, clientY: gesture.sy});
    const snap = raw && snapToBorder(raw);
    if (!snap) return; // sigue pending: si luego se mueve, se convierte en scroll
    gesture.phase = 'resizing';
    gesture.anchor = snap;
    gesture.lastCell = {col: snap.col, row: snap.row};
    sendInput(sgr(0, gesture.lastCell, false));
    gesture.pressSent = true;
    IND.textContent = snap.axis === 'x' ? '⇔ redimensionando' : '⇕ redimensionando';
    IND.style.display = 'block';
    if (navigator.vibrate) navigator.vibrate(25);
  };

  document.addEventListener('touchstart', (e) => {
    if (terminalUiOwnsEvent(e)) { finishGesture(); return; }
    if (selectingText()) { finishGesture(); return; }
    if (!e.touches || e.touches.length !== 1) { finishGesture(); return; }
    if (gesture.phase !== 'idle') finishGesture();
    const touch = e.touches[0];
    gesture.phase = 'pending';
    gesture.touchId = touch.identifier;
    gesture.sx = touch.clientX;
    gesture.sy = gesture.lastY = touch.clientY;
    if (mouseOn()) gesture.timer = setTimeout(tryEngageResize, 220);
  }, {passive: true});
  document.addEventListener('touchmove', (e) => {
    if (terminalUiOwnsEvent(e)) { finishGesture(); return; }
    if (gesture.phase === 'idle') return;
    if (selectingText() || !e.touches || e.touches.length !== 1) {
      finishGesture();
      return;
    }
    const touch = touchById(e.touches);
    if (!touch) { finishGesture(); return; }
    if (gesture.phase === 'pending') {
      if (Math.hypot(touch.clientX - gesture.sx, touch.clientY - gesture.sy) <= 12) {
        e.preventDefault();
        e.stopPropagation();
        return;
      }
      if (gesture.timer) clearTimeout(gesture.timer);
      gesture.timer = 0;
      beginScroll(e, touch);
      return;
    }
    if (gesture.phase === 'scrolling') {
      beginScroll(e, touch);
      return;
    }
    if (gesture.phase === 'resizing') {
      e.preventDefault();
      e.stopPropagation();
      const c = cellOnLockedAxis(touch);
      if (!c) return;
      gesture.pendingCell = c;
      if (!gesture.frame) gesture.frame = requestAnimationFrame(sendMotion);
    }
  }, {passive: false});
  document.addEventListener('touchend', (e) => {
    if (terminalUiOwnsEvent(e)) { finishGesture(); return; }
    if (gesture.phase === 'resizing') {
      const touch = touchById(e.changedTouches);
      const c = touch && cellOnLockedAxis(touch);
      if (c) gesture.pendingCell = c;
    }
    finishGesture();
  });
  document.addEventListener('touchcancel', finishGesture);
  window.addEventListener('pagehide', finishGesture);
  ws.addEventListener('close', finishGesture);

  const ta = term.textarea;
  if (ta) ta.addEventListener('beforeinput', (e) => {
    if (e.isComposing) return;
    if (e.inputType === 'deleteContentBackward') {
      e.preventDefault(); sendInput('\x7f');
    } else if (e.inputType === 'insertLineBreak') {
      e.preventDefault(); sendInput('\r');
    }
  });
})();
</script>
</body>
</html>
