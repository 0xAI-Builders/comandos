<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ComandOS · terminal</title>
<link rel="stylesheet" href="../assets/xterm/xterm.css">
<!-- Cargamos la fuente bundleada por @font-face para que WebKit la use aun si
     fontconfig del sistema no la conoce. -->
<style>
  @font-face {
    font-family: 'JetBrainsMono Nerd Font Mono';
    font-weight: 400; font-style: normal;
    src: url('../assets/fonts/JetBrainsMono/JetBrainsMonoNerdFontMono-Regular.ttf') format('truetype');
  }
  @font-face {
    font-family: 'JetBrainsMono Nerd Font Mono';
    font-weight: 400; font-style: italic;
    src: url('../assets/fonts/JetBrainsMono/JetBrainsMonoNerdFontMono-Italic.ttf') format('truetype');
  }
  @font-face {
    font-family: 'JetBrainsMono Nerd Font Mono';
    font-weight: 700; font-style: normal;
    src: url('../assets/fonts/JetBrainsMono/JetBrainsMonoNerdFontMono-Bold.ttf') format('truetype');
  }
  @font-face {
    font-family: 'JetBrainsMono Nerd Font Mono';
    font-weight: 700; font-style: italic;
    src: url('../assets/fonts/JetBrainsMono/JetBrainsMonoNerdFontMono-BoldItalic.ttf') format('truetype');
  }
  html, body { margin: 0; padding: 0; height: 100%; background: #0A0D13; overflow: hidden; }
  #term {
    position: absolute; inset: 0;
    padding: 8px 6px 6px 10px;
    box-sizing: border-box;
  }
  #err {
    position: absolute; inset: 0; display: none;
    color: #FF7B72; font-family: 'JetBrainsMono Nerd Font Mono', monospace;
    padding: 16px; white-space: pre-wrap;
  }
  #dbg {
    position: fixed; right: 8px; top: 8px; z-index: 9; display: none;
    color: #FFAE1A; font-family: 'JetBrainsMono Nerd Font Mono', monospace;
    font-size: 11px; background: rgba(0,0,0,.5); padding: 4px 8px;
    border-radius: 4px; max-width: 60vw; white-space: pre-wrap;
  }
  #dbg.on { display: block; }
</style>
</head>
<body>
<div id="term"></div>
<div id="err"></div>
<div id="dbg">iniciando…</div>

<script src="../assets/xterm/xterm.js"></script>
<script src="../assets/xterm/addon-fit.js"></script>
<script src="../assets/xterm/addon-web-links.js"></script>
<script src="../assets/xterm/addon-canvas.js"></script>
<script src="../assets/opentype/opentype.min.js"></script>
<script src="../assets/xterm/addon-ligatures-web.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const arg    = params.get('arg') || '';
  const theme  = (params.get('theme') || 'noche').toLowerCase();
  const debug  = params.get('debug') === '1';

  const dbgEl = document.getElementById('dbg');
  if (debug) dbgEl.classList.add('on');
  const dbg = (m) => { if (debug) dbgEl.textContent = m; };
  window.addEventListener('error', (e) => dbg('JS error: ' + (e.message || e.error)));
  window.addEventListener('unhandledrejection', (e) => dbg('rej: ' + (e.reason && e.reason.message || e.reason)));
  // ttyd toma la sesión del querystring del WS (por --url-arg).
  // Remoto (servida por ttyd bajo /term via tailscale): ws same-origin
  // wss://host/term/ws. La app pasa ?ws= explicito (file:// no tiene origen).
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const basePath = location.pathname.replace(/\/[^/]*$/, '');
  const wsBase = params.get('ws')
    || (location.host ? `${proto}://${location.host}${basePath}/ws`
                      : `ws://127.0.0.1:4779/ws`);
  const ws_url = arg ? `${wsBase}?arg=${encodeURIComponent(arg)}` : wsBase;

  const THEMES = {
    noche:  { background:'#0A0D13', foreground:'#EAF0FB', cursor:'#FFAE1A',
              cursorAccent:'#0A0D13', selectionBackground:'#2E3852' },
    dia:    { background:'#F7F8FB', foreground:'#1B2130', cursor:'#B26A00',
              cursorAccent:'#F7F8FB', selectionBackground:'#D9DEE8' },
    calido: { background:'#161009', foreground:'#F2E5D0', cursor:'#FFB454',
              cursorAccent:'#161009', selectionBackground:'#36291A' },
  };

  const showErr = (msg) => {
    const e = document.getElementById('err');
    e.textContent = msg;
    e.style.display = 'block';
  };

  const term = new Terminal({
    fontFamily: "'JetBrainsMono Nerd Font Mono', 'JetBrainsMono Nerd Font', 'JetBrains Mono', 'DejaVu Sans Mono', monospace",
    fontSize: 14,
    lineHeight: 1.15,
    letterSpacing: 0,
    cursorBlink: true,
    cursorStyle: 'block',
    scrollback: 10000,
    allowProposedApi: true,   // requerido por CanvasAddon para exponer ligas
    theme: THEMES[theme] || THEMES.noche,
    windowsMode: false,
  });

  const fit    = new FitAddon.FitAddon();
  const links  = new WebLinksAddon.WebLinksAddon();
  const canvas = new CanvasAddon.CanvasAddon();
  term.loadAddon(fit);
  term.loadAddon(links);
  term.open(document.getElementById('term'));
  // Canvas addon debe cargarse DESPUES de open() y antes de escribir.
  try { term.loadAddon(canvas); } catch (e) { console.warn('CanvasAddon failed', e); }

  // Ligaduras via opentype.js overlay (browser puro) — SOLO desktop: en
  // tactil el overlay redibuja carisimo y hace lento el resize de panes.
  const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  const themeCfg = THEMES[theme] || THEMES.noche;
  if (!IS_TOUCH) {
    const liga = new LigaturesWebAddon({
      fontUrl: '../assets/fonts/JetBrainsMono/JetBrainsMonoNerdFontMono-Regular.ttf',
      fontSize: 14,
      foreground: themeCfg.foreground,
      background: themeCfg.background,
      debug: debug,
    });
    try { term.loadAddon(liga); } catch (e) { dbg('LigaturesWebAddon failed: ' + e.message); }
  }

  const doFit = () => { try { fit.fit(); } catch (_) {} };
  doFit();
  window.addEventListener('resize', doFit);

  // ttyd protocol (ver ttyd/src/protocol.c y client/xterm/index.ts):
  //   auth  : primer mensaje = JSON crudo {AuthToken, columns, rows} (sin prefix)
  //   client -> server:  '0'+bytes = INPUT  '1'+JSON = RESIZE
  //                      '2' = PAUSE  '3' = RESUME
  //   server -> client:  '0'+bytes = OUTPUT '1'+txt  = TITLE  '2'+JSON = PREFS
  const ws = new WebSocket(ws_url, ['tty']);
  ws.binaryType = 'arraybuffer';
  const enc = new TextEncoder();
  const dec = new TextDecoder();

  const sendInput = (data) => {
    if (ws.readyState !== 1) return;
    const buf = enc.encode(data);
    const out = new Uint8Array(buf.length + 1);
    out[0] = 0x30; // '0' = INPUT (client→server)
    out.set(buf, 1);
    ws.send(out);
  };
  const sendResize = () => {
    if (ws.readyState !== 1) return;
    ws.send('1' + JSON.stringify({ columns: term.cols, rows: term.rows }));
  };

  ws.addEventListener('open', () => {
    dbg(`WS open (proto=${ws.protocol||'-'}), auth cols=${term.cols} rows=${term.rows}`);
    // ttyd espera el primer mensaje como JSON crudo (SIN prefijo de comando).
    ws.send(JSON.stringify({
      AuthToken: '',
      columns: term.cols,
      rows: term.rows,
    }));
    setTimeout(doFit, 30);
  });

  ws.addEventListener('message', (ev) => {
    const data = ev.data;
    // Puede llegar como ArrayBuffer o string según el frame de ttyd.
    if (typeof data === 'string') {
      const cmd = data[0];
      const rest = data.slice(1);
      if (cmd === '0') term.write(rest);
      else if (cmd === '1') document.title = rest;
      else if (cmd === '2') {
        try {
          const prefs = JSON.parse(rest);
          if (prefs.fontFamily) term.options.fontFamily = prefs.fontFamily;
          if (prefs.fontSize)   term.options.fontSize   = +prefs.fontSize;
          doFit(); sendResize();
        } catch (_) {}
      }
    } else {
      const bytes = new Uint8Array(data);
      const cmd = String.fromCharCode(bytes[0]);
      const rest = bytes.subarray(1);
      if (cmd === '0') term.write(rest);
      else if (cmd === '1') document.title = dec.decode(rest);
      else if (cmd === '2') {
        try {
          const prefs = JSON.parse(dec.decode(rest));
          if (prefs.fontFamily) term.options.fontFamily = prefs.fontFamily;
          if (prefs.fontSize)   term.options.fontSize   = +prefs.fontSize;
          doFit(); sendResize();
        } catch (_) {}
      }
    }
  });

  ws.addEventListener('close', (ev) => {
    dbg(`WS close code=${ev.code} reason="${ev.reason||''}" clean=${ev.wasClean}`);
    term.write(`\r\n\x1b[90m[conexión cerrada${ev.code ? ' · '+ev.code : ''}]\x1b[0m\r\n`);
  });
  ws.addEventListener('error', (e) => {
    dbg(`WS error a ${ws_url}`);
    showErr(`No pude conectar a ${ws_url}\n\nAsegurate de que cc-webterm esté corriendo:\n  cc-webterm status`);
  });

  term.onData(sendInput);
  term.onResize(sendResize);

  // Teclado MOVIL (GBoard/Android): borrar y Enter llegan como eventos
  // beforeinput sin keydown — xterm.js los pierde con el buffer de
  // composicion vacio y "borrar no borra". Los interceptamos y mandamos
  // la tecla real; preventDefault evita el doble envio.
  // --- GESTO TÁCTIL: dejar el dedo (~220ms) CERCA de una separación de
  // panes y arrastrar = resize. Mejoras de fluidez y precisión:
  //  · SNAP al borde: lee el buffer y busca │ o ─ hasta ±2 celdas del dedo;
  //    ancla el press al borde exacto y BLOQUEA el eje (│=horizontal,
  //    ─=vertical). Ya no hay que atinarle al pixel.
  //  · Motions coalescidos a 1 por frame (rAF): tmux no se atraganta.
  //  · Solo cuando la app pidió mouse tracking; si no, scroll normal.
  const screenEl = () => document.querySelector('.xterm-screen');
  const mouseOn = () => { try { return term.modes.mouseTrackingMode !== 'none'; } catch (_) { return false; } };
  const cellFromTouch = (t) => {
    const el = screenEl(); if (!el) return null;
    const r = el.getBoundingClientRect();
    const col = Math.max(1, Math.min(term.cols, Math.floor((t.clientX - r.left) / (r.width / term.cols)) + 1));
    const row = Math.max(1, Math.min(term.rows, Math.floor((t.clientY - r.top) / (r.height / term.rows)) + 1));
    return { col, row };
  };
  const cellChar = (col, row) => {
    try {
      const line = term.buffer.active.getLine(row - 1);
      return line ? (line.getCell(col - 1)?.getChars() || '') : '';
    } catch (_) { return ''; }
  };
  const VBORDER = '│┃|';   // borde vertical  → se arrastra en X
  const HBORDER = '─━-';   // borde horizontal → se arrastra en Y
  // Busca un borde hasta a ±2 celdas del dedo. Devuelve celda anclada + eje.
  const snapToBorder = (c) => {
    for (const d of [0, -1, 1, -2, 2]) {
      const ch = cellChar(c.col + d, c.row);
      if (ch && VBORDER.includes(ch)) return { col: c.col + d, row: c.row, axis: 'x' };
    }
    for (const d of [0, -1, 1, -2, 2]) {
      const ch = cellChar(c.col, c.row + d);
      if (ch && HBORDER.includes(ch)) return { col: c.col, row: c.row + d, axis: 'y' };
    }
    return null;
  };
  const sgr = (btn, c, release) => `\x1b[<${btn};${c.col};${c.row}${release ? 'm' : 'M'}`;
  const IND = document.createElement('div');
  IND.style.cssText = 'position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:9;' +
    'display:none;background:rgba(0,0,0,.7);color:#4CE07A;font:12px monospace;' +
    'padding:5px 12px;border-radius:8px;pointer-events:none';
  document.body.appendChild(IND);
  let lp = null;          // gesto en curso
  let rafPending = false; // coalescer motions a 1 por frame
  const sendMotion = () => {
    rafPending = false;
    if (!lp || !lp.engaged || !lp.pendCell) return;
    const c = lp.pendCell; lp.pendCell = null;
    if (!lp.lastCell || c.col !== lp.lastCell.col || c.row !== lp.lastCell.row) {
      lp.lastCell = c;
      sendInput(sgr(32, c, false));
    }
  };
  document.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1 || !mouseOn()) return;
    const t = e.touches[0];
    const startX = t.clientX, startY = t.clientY;
    lp = { engaged: false, sx: startX, sy: startY, lastCell: null, pendCell: null, anchor: null,
      timer: setTimeout(() => {
        if (!lp) return;
        const raw = cellFromTouch({ clientX: startX, clientY: startY });
        const snap = raw && snapToBorder(raw);
        if (!snap) {           // sin borde cerca: no es resize, no estorbar
          lp = null;
          return;
        }
        lp.engaged = true;
        lp.anchor = snap;      // eje bloqueado + celda exacta del borde
        lp.lastCell = { col: snap.col, row: snap.row };
        sendInput(sgr(0, lp.lastCell, false));   // press EN el borde
        IND.textContent = snap.axis === 'x' ? '⇔ redimensionando' : '⇕ redimensionando';
        IND.style.display = 'block';
        if (navigator.vibrate) navigator.vibrate(25);
      }, 220) };
  }, { passive: true });
  document.addEventListener('touchmove', (e) => {
    if (!lp) return;
    const t = e.touches[0];
    if (!lp.engaged) {
      if (Math.hypot(t.clientX - lp.sx, t.clientY - lp.sy) > 12) { clearTimeout(lp.timer); lp = null; }
      return;
    }
    e.preventDefault();
    const c = cellFromTouch(t);
    if (!c) return;
    // eje bloqueado: solo se mueve la coordenada del borde agarrado
    lp.pendCell = lp.anchor.axis === 'x'
      ? { col: c.col, row: lp.anchor.row }
      : { col: lp.anchor.col, row: c.row };
    if (!rafPending) { rafPending = true; requestAnimationFrame(sendMotion); }
  }, { passive: false });
  const endTouch = () => {
    if (!lp) return;
    clearTimeout(lp.timer);
    if (lp.engaged && lp.lastCell) {
      if (lp.pendCell) { lp.lastCell = lp.pendCell; sendInput(sgr(32, lp.lastCell, false)); }
      sendInput(sgr(0, lp.lastCell, true));      // release
    }
    IND.style.display = 'none';
    lp = null;
  };
  document.addEventListener('touchend', endTouch);
  document.addEventListener('touchcancel', endTouch);

  const ta = term.textarea;
  if (ta) ta.addEventListener('beforeinput', (e) => {
    if (e.isComposing) return;
    if (e.inputType === 'deleteContentBackward') {
      e.preventDefault(); sendInput('\x7f');
    } else if (e.inputType === 'insertLineBreak') {
      e.preventDefault(); sendInput('\r');
    }
  });
})();
</script>
</body>
</html>
