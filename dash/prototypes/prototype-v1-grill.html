<div class="lab"><strong>ComandOS · Revisión 1.0</strong><small>Mockup interactivo · datos de ejemplo · ninguna acción modifica tus sesiones</small><button onclick="setVariant('actual')">Ver interfaz actual</button><button onclick="go('map')">Mapa completo</button></div>

<script>
const variants={actual:['Actual · referencia','Interfaz actual servida con datos simulados. Desktop añade el marco de terminal nativa; remoto muestra el dashboard web.'],A:['A · Consola persistente','Sesiones a la izquierda, terminal al centro y controles al lado. Todo a la vista.'],B:['B · Terminal primero','La terminal ocupa el espacio principal. Navegación y configuración aparecen cuando las necesitas.'],C:['C · Por proyecto','El proyecto organiza sesiones y herramientas. Los controles viven debajo de la terminal.'],D:['D · Cola de trabajo','Primero ves qué espera respuesta, qué está trabajando y qué terminó.'],E:['E · Mesa de operaciones','Todas las sesiones en una tabla compacta. Debajo inspeccionas y operas la seleccionada.']};
const nav=[['sessions','◫','Sesiones'],['chat','↗','Chat ComandOS'],['new','＋','Nueva sesión'],['config','◎','Configurar IA'],['extensions','◇','MCPs y skills'],['profiles','▤','Perfiles'],['usage','◷','Analytics y límites'],['activity','≋','Actividad'],['logs','⌁','Logs de proveedores'],['focus','◴','Foco y avisos'],['servers','⌘','Servidores'],['remote','↔','Acceso remoto'],['snippets','⌗','Snippets'],['settings','⚙','Ajustes'],['privacy','▣','Soberanía'],['toolusage','◈','Uso de herramientas'],['allocation','⇄','Reparto de agentes'],['recent','↶','Sesiones cerradas'],['appearance','◐','Apariencia'],['help','?','Atajos y ayuda']];
const tour=[['sessions','Ubicar sesiones y abrir un panel'],['config','Cambiar modelo, cuenta y esfuerzo'],['extensions','Quitar todos y añadir una categoría'],['chat','Hablar con ComandOS'],['usage','Entender uso y límites'],['settings','Revisar ajustes desktop y remoto']];
let variant=new URLSearchParams(location.search).get('variant')||'actual',platform='desktop',page='sessions',demoState='ready',tourStep=0,selected=0,showNav=false,search='',filter='all',model='GPT-6 Astra',effort='high',pending=false,verdict='';
const sessions=[{name:'ComandOS',task:'Interfaz 1.0',agent:'Codex',state:'Espera tu respuesta',color:'wait'},{name:'Lola',task:'Revisar checkout',agent:'Claude',state:'Trabajando',color:''},{name:'MRP',task:'Sincronizar modelos',agent:'Codex',state:'Listo',color:''},{name:'Exploración',task:'Nueva terminal',agent:'Shell',state:'En reposo',color:''}];
const tools=[['chrome-bg','mcp','Navegación'],['Mobbin','mcp','Diseño'],['GitHub','mcp','Desarrollo'],['Gmail','mcp','Comunicación'],['grill-me','skill','mattpocock'],['grill-design','skill','mattpocock'],['prototype','skill','mattpocock'],['tdd','skill','mattpocock'],['diagnosing-bugs','skill','Desarrollo'],['code-review','skill','Desarrollo'],['writing-plans','skill','Desarrollo'],['WhatsApp','mcp','Comunicación']].map((t,i)=>({name:t[0],kind:t[1],group:t[2],on:i<4,tokens:350+i*170}));
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function go(p){page=p;showNav=false;render()}function setVariant(v){variant=variants[v]?v:'A';history.replaceState({},'',location.pathname+'?variant='+variant);render()}function cycle(d){let keys=Object.keys(variants);setVariant(keys[(keys.indexOf(variant)+d+keys.length)%keys.length])}function btn(p,label){return `<button class="${page===p?'on':''}" onclick="go('${p}')">${label}</button>`}
function terminal(){return `<div class="terminal"><header><strong>${sessions[selected].name}</strong><span class="grow">${sessions[selected].agent} · ${model}</span><button onclick="go('config')">Configurar IA</button><button onclick="go('extensions')">MCPs · Skills</button><button onclick="say('División simulada: dos paneles de la misma sesión')">⊞ Dividir</button><button onclick="say('Cerrar pestaña: también se cerraría en desktop. La sesión tmux se conserva. En este mockup no se cierra nada real.')">×</button></header><pre><span class="prompt">❯ Revisemos la interfaz y dejemos lista la versión 1.0.</span>\n\nVoy a revisar los controles y conservar el contexto\nde este panel mientras trabajamos.\n\n<span class="green">✓ Sesiones conservadas\n✓ Configuración identificada</span>\n\n<span style="color:var(--amber)">Necesito tu opinión sobre la propuesta.</span>\n\n  1. Navegación\n  2. Configuración de IA\n  3. MCPs y skills\n\n<span class="prompt">❯ </span><span style="background:#bbb"> </span></pre>${platform==='remote'?`<div class="toolsbar" style="padding:10px;margin:0"><button onclick="say('Esc simulado')">Esc</button><button onclick="say('Ctrl+C requiere intención explícita; no se envió nada')">Ctrl+C</button><button onclick="say('Tab simulado')">Tab</button><button onclick="say('Mover cursor')">↑ ↓</button><button onclick="say('Selección y copia de ejemplo')">Copiar</button><button onclick="go('activity')">Historial</button><input aria-label="Texto para terminal" placeholder="Texto para insertar…"><button onclick="say('Insertar texto sin ejecutarlo')">Insertar</button><button onclick="say('Enviar texto y Enter: solo simulación')">Enviar ↵</button></div>`:''}<footer>Terminal simulada · tu conversación real no se modifica</footer></div>`}
function config(){return `<div class="panel"><h3>Configurar este panel</h3><div class="sentence">Uso <select aria-label="Agente" onchange="say('Cambio de agente: confirmación simulada antes de aplicar')"><option>◉ Codex</option><option>◈ Claude</option></select><br>con <button onclick="model=model==='GPT-6 Astra'?'GPT-6 Sol':'GPT-6 Astra';pending=true;render()">‹ ${model} ›</button><br>esfuerzo <b id="effort-word">${effort}</b><input aria-label="Esfuerzo" type="range" min="0" max="3" value="${['low','medium','high','max'].indexOf(effort)}" oninput="document.querySelector('#effort-word').textContent=['low','medium','high','max'][this.value]" onchange="effort=['low','medium','high','max'][this.value];pending=true;render()">y cuenta <button onclick="say('Elegir cuenta: principal / trabajo')">‹ Principal ›</button></div><div><small>Usas seguido · ejemplo de historial</small><button style="display:block;margin-top:7px" onclick="model='GPT-6 Sol';effort='medium';pending=true;render()">Sol · medium · Principal</button></div><div class="active">${pending?'Cambio solicitado · aún sin confirmar':'● Activa · Astra · high · Principal'}${pending?'<button onclick="pending=false;render()">Simular confirmación</button>':''}</div><button style="margin-top:12px" onclick="go('extensions')">MCPs y skills →</button></div>`}
function sessionCard(s,i){return `<button class="session ${i===selected?'selected':''}" onclick="selected=${i};render()"><strong>${s.name}</strong><small>${s.task} · ${s.agent}</small><span class="${s.color}">${s.state}</span></button>`}
function sessionPage(){let leading=`<div class="tabs">${sessions.map((s,i)=>`<button class="${i===selected?'on':''}" onclick="selected=${i};render()">${s.name} ${i===0?'•':''}</button>`).join('')}<button onclick="go('new')">＋</button></div>`;
if(variant==='C')leading=`<div class="section-head"><h1>ComandOS <small>/ Interfaz 1.0</small></h1><button onclick="go('new')">Nueva sesión</button></div><div class="grid" style="margin-bottom:14px">${sessions.slice(0,3).map(sessionCard).join('')}</div>`;
if(variant==='D')leading=`<div class="kanban">${['Tu turno','Trabajando','Terminadas'].map((x,i)=>`<section><h3>${x} · 1</h3>${sessionCard(sessions[i],i)}</section>`).join('')}</div>`;
if(variant==='E')leading=`<div class="tablewrap"><table><thead><tr><th>Proyecto / tarea</th><th>Agente</th><th>Estado</th><th></th></tr></thead><tbody>${sessions.map((s,i)=>`<tr><td>${s.name} · ${s.task}</td><td>${s.agent}</td><td>${s.state}</td><td><button onclick="selected=${i};render()">Abrir</button></td></tr>`).join('')}</tbody></table></div><br>`;
return leading+`<div class="workspace">${terminal()}${config()}</div>`}
function extensions(){const n=tools.filter(t=>t.on).length;const visible=tools.filter(t=>(filter==='all'||t.kind===filter)&&t.name.toLowerCase().includes(search.toLowerCase()));return `<div class="section-head"><h1>MCPs y skills</h1><small>ComandOS · panel 1</small><button class="primary" onclick="say('Selección aplicada en la simulación; ningún proceso real se reinicia')">Aplicar selección</button></div><div class="selection"><strong>${n===0?'Ninguna seleccionada':n===tools.length?'Todas seleccionadas':'Selección parcial'} · ${n} de ${tools.length}</strong><button onclick="tools.forEach(t=>t.on=true);render()">Seleccionar todos</button><button onclick="tools.forEach(t=>t.on=false);render()">Quitar todos</button><small style="width:100%">Afecta a todo el catálogo editable, aunque haya filtros. Seleccionada no significa usada.</small></div><div class="toolsbar"><input id="tool-search" placeholder="Buscar MCP o skill…" value="${esc(search)}" oninput="search=this.value;render();let e=document.querySelector('#tool-search');e.focus();e.setSelectionRange(e.value.length,e.value.length)">${[['all','Todo'],['mcp','MCPs'],['skill','Skills']].map(([k,l])=>`<button class="${filter===k?'on':''}" onclick="filter='${k}';render()">${l}</button>`).join('')}</div><div class="catalog">${[true,false].map(on=>`<section class="panel"><h2>${on?'Seleccionadas':'Sin seleccionar'} · ${visible.filter(t=>t.on===on).length}</h2>${[...new Set(visible.filter(t=>t.on===on).map(t=>t.group))].map(g=>`<details open><summary><strong>${g}</strong><button onclick="event.preventDefault();tools.filter(t=>t.group==='${g}').forEach(t=>t.on=${!on});render()">${on?'Quitar':'Añadir'} categoría</button></summary><div class="chips">${visible.filter(t=>t.on===on&&t.group===g).map(t=>`<button class="chip ${t.kind} ${on?'on':''}" aria-pressed="${on}" onclick="tools.find(t=>t.name==='${t.name}').on=${!on};render()">${on?'✓':'＋'} ${t.name}<small>${t.tokens} t</small></button>`).join('')}</div></details>`).join('')||'<p class="muted">Ninguna con este filtro.</p>'}</section>`).join('')}</div><p class="footnote">Agrupaciones de ejemplo por origen o categoría. Tokens simulados para el mockup. Revisaremos agrupación y tamaño en su ronda.</p>`}
function pageContent(){if(page==='sessions')return sessionPage();if(page==='config')return `<div class="section-head"><h1>Configuración de IA</h1><small>Siempre sobre el panel seleccionado</small></div><div class="workspace">${terminal()}${config()}</div>`;if(page==='extensions')return extensions();if(page==='map')return `<h1>Toda la interfaz, por partes</h1><p class="muted">La base actual está en el selector de propuestas. Cada sección de abajo es navegable. Los logs son una propuesta; no se presentan como una capacidad ya implementada.</p><div class="grid">${nav.map(([p,i,n])=>`<button class="session" onclick="go('${p}')"><strong>${i} ${n}</strong><small>Revisar desktop y remoto →</small></button>`).join('')}</div>`;
if(page==='toolusage')return `<h1>Uso de herramientas</h1><p class="muted">Ejemplo de uso observado, separado de la selección.</p><div class="tablewrap"><table><tr><th>Herramienta</th><th>Llamadas</th><th>Duración</th></tr><tr><td>chrome-bg</td><td>8</td><td>4,2 s</td></tr><tr><td>GitHub</td><td>3</td><td>1,1 s</td></tr><tr><td>Gmail</td><td>Sin datos</td><td>—</td></tr></table></div><button onclick="go('extensions')">Editar selección</button>`;
if(page==='allocation')return `<h1>Reparto de agentes</h1><p class="muted">Propuesta simulada; no mueve procesos.</p><div class="panel">${sessions.slice(0,3).map(s=>`<div class="row"><span class="grow">${s.name}</span><select><option>Codex · Sol</option><option>Codex · Astra</option><option>Claude · Opus</option></select><label><input type="checkbox"> Fijar</label></div>`).join('')}<button onclick="say('Vista previa del reparto de ejemplo')">Previsualizar</button><button onclick="say('Aplicación simulada del reparto. Sin cambios reales.')">Aplicar reparto</button><button onclick="say('Reparto anterior restaurado en el ejemplo')">Revertir</button></div>`;
if(page==='recent')return `<h1>Sesiones cerradas</h1><p>La pestaña puede cerrarse y la sesión seguir disponible.</p><div class="row"><span class="grow">ComandOS · Auditoría anterior</span><button onclick="say('Restauración de ejemplo');go('sessions')">Reabrir pestaña</button></div>`;
if(page==='appearance')return `<h1>Apariencia</h1><div class="grid">${['Oscuro','Claro','Sistema'].map(n=>`<button class="session" onclick="say('Tema '+ '${n}' +' elegido para explorar en una ronda posterior')"><strong>${n}</strong><small>Mismo tema en desktop y remoto</small></button>`).join('')}</div>`;
if(page==='chat')return `<h1>Chat de ComandOS</h1><div class="chat"><div class="msg me">Ayúdame a ordenar las sesiones y revisar qué está esperando.</div><div class="msg">ComandOS espera tu decisión de diseño. Lola sigue trabajando; MRP ya terminó.<br><br><button onclick="selected=0;go('sessions')">Abrir ComandOS</button></div><div class="composer"><textarea aria-label="Mensaje" placeholder="Escribe a ComandOS…"></textarea><button onclick="say('Mensaje simulado. El mockup no llama a ningún modelo.')">Enviar ↑</button></div><small>Modelo del chat: GPT-6 Sol · conversación de ejemplo</small></div>`;
if(page==='new')return `<h1>Nueva sesión</h1><div class="panel"><div class="row"><label>Proyecto</label><select><option>ComandOS</option><option>Lola</option><option>MRP</option></select></div><div class="row"><label>Agente y modelo</label><select><option>Codex · Astra</option><option>Claude · Opus</option></select></div><div class="row"><label>Cuenta</label><select><option>Principal</option><option>Trabajo</option></select></div><div class="row"><label>Perfil de herramientas</label><select><option>Sin herramientas</option><option>Diseño</option><option>Desarrollo</option></select></div><div class="row"><label><input type="checkbox"> Sin aprobaciones</label></div><button class="primary" onclick="sessions.push({name:'Sesión de ejemplo',task:'Nueva tarea',agent:'Codex',state:'En reposo',color:''});selected=sessions.length-1;go('sessions')">Crear sesión de ejemplo</button></div>`;
if(page==='profiles')return `<h1>Perfiles</h1><p class="muted">Combina modelo, esfuerzo y selección de herramientas.</p><div class="grid">${['Desarrollo','Diseño','Investigación'].map(n=>`<div class="panel"><h2>${n}</h2><p>Codex · Sol · medium</p><button onclick="go('extensions')">Editar herramientas</button><button onclick="say('Perfil '+ '${n}' +' seleccionado en el mockup')">Usar</button></div>`).join('')}</div>`;
if(page==='usage')return `<h1>Analytics y límites</h1><p class="muted">Datos de ejemplo. Sin estimaciones de ahorro.</p><div class="stats"><div class="panel"><small>Foco hoy</small><b>2 h 34 m</b></div><div class="panel"><small>Agentes activos</small><b>3</b></div><div class="panel"><small>Límite semanal disponible</small><b>68%</b></div></div><div class="panel"><h2>Uso por proveedor</h2>${['OpenAI','Anthropic','xAI'].map((n,i)=>`<div class="row"><span class="grow">${n}</span><meter min="0" max="100" value="${62-i*22}"></meter><span>${62-i*22}%</span></div>`).join('')}<button onclick="go('logs')">Ver actividad del proveedor</button></div>`;
if(page==='logs'||page==='activity')return `<h1>${page==='logs'?'Logs de proveedores · propuesta':'Actividad'}</h1><div class="toolsbar"><select><option>Todos los proveedores</option><option>OpenAI</option><option>Anthropic</option></select><select><option>Todos los estados</option><option>Errores</option><option>Confirmados</option></select></div><div class="panel logs">10:42:18  OpenAI      Configuración confirmada\n10:42:16  ComandOS    Solicitud de cambio · high → medium\n10:38:04  Anthropic   Modelo sincronizado\n10:35:11  ComandOS    Selección guardada · 8 herramientas</div><p class="footnote">Registros ficticios para explorar lectura, filtrado y errores. Sin prompts ni credenciales.</p>`;
if(page==='focus')return `<h1>Foco y notificaciones</h1><div class="split"><div class="panel"><h2>25:00</h2><p>ComandOS · Interfaz 1.0</p><button onclick="say('Temporizador de ejemplo iniciado')">Iniciar foco</button></div><div class="panel"><h2>Espera tu respuesta</h2><p>ComandOS necesita una decisión.</p><button onclick="go('sessions')">Ir a la sesión</button></div></div>`;
if(page==='servers')return `<h1>Servidores</h1>${['Este equipo','Mac mini','Servidor de desarrollo'].map((n,i)=>`<div class="row"><span class="grow">${n}<small>${i===0?'Local':'SSH · configuración de ejemplo'}</small></span><span class="status">Disponible</span><button onclick="say('Conexión simulada a '+ '${n}')">Abrir</button></div>`).join('')}`;
if(page==='remote')return `<h1>Acceso remoto</h1><div class="panel"><p>Las mismas sesiones y controles, desde otro dispositivo.</p><div class="row"><label>Vista actual</label><b>${platform==='desktop'?'Desktop':'Remoto'}</b></div><div class="row"><label>Conexión de ejemplo</label><span class="status">Conectado</span></div><button onclick="platform=platform==='desktop'?'remote':'desktop';render()">Comparar desktop / remoto</button><p class="footnote">Diferencias permitidas: ventana nativa, conexión, teclado y gestos. La configuración y acciones del panel deben ser las mismas.</p></div>`;
if(page==='snippets')return `<h1>Snippets</h1><div class="split"><div class="panel"><button onclick="say('Snippet seleccionado')">Revisar cambios</button><button onclick="say('Snippet seleccionado')">Continuar tarea</button></div><div class="panel"><h2>Revisar cambios</h2><textarea style="width:100%;height:100px">Revisa el diff, comprueba los casos límite y explica los riesgos.</textarea><button onclick="say('Texto copiado solo dentro de la simulación')">Copiar</button></div></div>`;
if(page==='settings')return `<h1>Ajustes</h1><div class="panel">${[['Apariencia','Oscuro'],['Idioma','Español'],['Sonido','Desactivado'],['Densidad','Cómoda'],['Modelo del chat','GPT-6 Sol'],['Restaurar sesiones','Activado'],['Notificaciones','Solo cuando se necesita respuesta']].map(([n,v])=>`<div class="row"><label>${n}</label><button onclick="say('Ajuste de ejemplo: '+ '${n}')">${v} ›</button></div>`).join('')}<p class="footnote">Cada ajuste se revisará junto a su efecto en desktop y remoto.</p></div>`;
if(page==='privacy')return `<h1>Soberanía</h1><div class="panel"><h2>Qué se guarda y qué sale</h2><div class="row"><span class="grow">Sesiones y configuraciones</span><b>Local</b></div><div class="row"><span class="grow">Peticiones del agente</span><b>Proveedor elegido</b></div><div class="row"><span class="grow">Datos de este mockup</span><b>Solo memoria</b></div></div>`;
return `<h1>Atajos y ayuda</h1>${[['Ctrl + K','Buscar sesiones'],['Ctrl + Tab','Última pestaña'],['Ctrl + PgDn','Siguiente pestaña'],['F1','Ayuda'],['Escape','Cerrar panel']].map(([k,v])=>`<div class="row"><kbd>${k}</kbd><span>${v}</span></div>`).join('')}<p class="footnote">En remoto se mantienen botones equivalentes cuando el navegador reserva un atajo.</p>`}
function render(){document.querySelector('#variant').innerHTML=Object.entries(variants).map(([k,[n]])=>`<option value="${k}" ${variant===k?'selected':''}>${n}</option>`).join('');document.querySelector('#platform').value=platform;document.querySelector('#question').textContent=variants[variant][1];document.querySelector('#chrome').innerHTML=`<b class="traffic">${platform==='desktop'?'● ● ●':'↔'}</b><span>${platform==='desktop'?'ComandOS · Ventana desktop':'ComandOS · Navegador remoto'}</span><small>Mismos controles · ejemplo</small>`;const app=document.querySelector('#app');app.className='app v'+variant+(showNav?' show-nav':'');
if(variant==='actual'){app.innerHTML=`<div class="baseline-note">Referencia: dashboard actual real con APIs simuladas. Terminal y marco desktop recreados. Para recorrer el rediseño, elige A–E.</div><div class="baseline ${platform}"><iframe title="Dashboard actual con datos simulados" src="/?${platform==='desktop'?'app=1&':''}mockBaseline=1"></iframe>${platform==='desktop'?`<div class="native">${terminal()}</div>`:''}</div>`;return}
const state=demoState==='ready'?'':`<div class="screen-state">${demoState==='loading'?'<span class="spin"></span><h2>Cargando…</h2><p>La estructura y el panel seleccionado permanecen visibles.</p>':demoState==='empty'?'<h2>Aún no hay datos</h2><button onclick="demoState=\'ready\';render()">Añadir ejemplo</button>':demoState==='offline'?'<h2>Sin conexión</h2><p>La selección se conserva. Reconecta antes de aplicar.</p><button onclick="demoState=\'ready\';render()">Simular reconexión</button>':'<h2>No se pudo completar la carga</h2><p>Tu selección sigue intacta.</p><button onclick="demoState=\'ready\';render()">Reintentar</button>'}</div>`;
app.innerHTML=`<div class="top"><button onclick="showNav=!showNav;render()" aria-label="Abrir navegación">☰</button><span class="brand">ComandOS</span><button class="search" onclick="go('map')">⌕ Ir a…</button><span class="grow"></span><span class="status">1 espera · 1 trabaja · 1 listo</span><button onclick="go('new')">＋ Sesión</button><button onclick="go('focus')" aria-label="Notificaciones">♧</button><button onclick="go('settings')">⚙</button></div><div class="work"><nav class="nav"><div class="group">${variant==='C'?'Proyectos':'Workspace'}</div>${nav.slice(0,6).map(([p,i,n])=>btn(p,i+' '+n)).join('')}<div class="group">Observar y organizar</div>${nav.slice(6).map(([p,i,n])=>btn(p,i+' '+n)).join('')}</nav><main class="main">${state}${demoState==='ready'?pageContent():''}</main></div><div class="bottomnav">${nav.filter(([p])=>['sessions','config','extensions','chat','usage'].includes(p)).map(([p,i,n])=>btn(p,i+' '+n)).join('')}</div><div class="tour"><small>Prueba humana ${tourStep+1}/${tour.length}</small><span>${tour[tourStep][1]}</span><button onclick="say('Anotado como aprobado en esta exploración');tourStep=(tourStep+1)%tour.length;go(tour[tourStep][0])">Se entiende ✓</button><button onclick="say('Pendiente de revisar. Dime qué te estorba en esta parte.')">Me estorba ✕</button></div>`;document.querySelector('#verdict').textContent=verdict}
function say(t){verdict=t;document.querySelector('#verdict').textContent=t}function chooseVerdict(){say(`Elegida como base: ${variants[variant][0]} · ${platform}. Dime en el chat qué conservar y qué quitar.`)}
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'){e.preventDefault();cycle(-1)}if(e.key==='ArrowRight'){e.preventDefault();cycle(1)}});
const handle=document.querySelector('#handle'),picker=document.querySelector('#picker');let drag=null;handle.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY,r:picker.getBoundingClientRect()};handle.setPointerCapture(e.pointerId)});handle.addEventListener('pointermove',e=>{if(!drag)return;picker.style.left=Math.max(0,Math.min(innerWidth-picker.offsetWidth,drag.r.left+e.clientX-drag.x))+'px';picker.style.top=Math.max(0,Math.min(innerHeight-picker.offsetHeight,drag.r.top+e.clientY-drag.y))+'px';picker.style.bottom='auto';picker.style.right='auto'});handle.addEventListener('pointerup',()=>drag=null);handle.addEventListener('pointercancel',()=>drag=null);render();
</script></html>
