function pmIcon(name='clock'){const shapes={clock:'<circle cx="12" cy="13" r="8"/><path d="M9 2h6M12 5v2M19 6l2-2"/><path class="pm-orbit" d="M12 13V8m0 5 3 2"/>',play:'<path d="m8 5 11 7-11 7Z"/>',pause:'<path d="M8 5v14M16 5v14"/>',stop:'<rect x="6" y="6" width="12" height="12" rx="2"/>',sound:'<path d="m11 4-6 5H2v6h3l6 5Z"/><path d="M15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/>',star:'<path class="pm-beat" d="m12 3 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1Z"/>',check:'<path d="m5 12 4 4L19 6"/><circle cx="12" cy="12" r="10"/>',bars:'<path d="M5 20v-7M12 20V4M19 20V9M3 21h19"/>'};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${shapes[name]||shapes.clock}</svg>`;}
function pmLeft(){return pm.state==='running'?Math.max(0,pm.end-Date.now()):pm.remaining;}

function pmCan(){if(['offline','error','loading'].includes(demoState)){say('Acción no aplicada. Restablece la conexión de ejemplo para continuar.');return false;}return true;}
function pmSetMinutes(value){if(!pmCan())return;const n=Math.round(Number(value));if(!Number.isFinite(n))return;const mins=Math.max(1,Math.min(90,n));if(pm.state==='running'){pm.elapsed=pmSpent();pm.segment=Date.now();pm.end=Date.now()+mins*60000;}if(['idle','completed'].includes(pm.state))pm.state='idle';pm.remaining=mins*60000;pm.mins=mins;pm.total=pm.elapsed+pm.remaining;pmTick(false);}

function pmTick(finish=true){if(finish&&pm.state==='running'&&pmLeft()<=0){pmFinish();return;}if(!pomoRound||variant==='actual')return;document.querySelectorAll('[data-pm-time]').forEach(el=>el.textContent=pmTime(pmLeft()));document.querySelectorAll('[data-pm-label]').forEach(el=>el.textContent=pmLabel());document.querySelector('.pm-badge')?.setAttribute('aria-label',`Pomodoro: ${pmTime(pmLeft())}, ${pmLabel()}. Abrir reloj`);const mins=pm.state==='completed'?pm.mins:Math.max(1,Math.ceil(pmLeft()/60000)),ratio=pm.state==='completed'?0:Math.min(1,mins/90),circ=2*Math.PI*82;document.querySelectorAll('.pm-track').forEach(el=>el.setAttribute('stroke-dashoffset',String(circ*(1-ratio))));document.querySelectorAll('.pm-hand').forEach(el=>{const a=ratio*Math.PI*2-Math.PI/2;el.setAttribute('cx',100+82*Math.cos(a));el.setAttribute('cy',100+82*Math.sin(a));});document.querySelectorAll('[data-pm-dial]').forEach(el=>{el.setAttribute('aria-valuenow',mins);el.setAttribute('aria-valuetext',`${mins} minutos ${pm.state==='running'?'restantes':pm.state==='completed'?'para el siguiente bloque':''}`);});document.querySelectorAll('[data-pm-input]').forEach(el=>{if(el!==document.activeElement)el.value=mins;if(el.classList?.contains('pm-ruler'))el.style.setProperty('--pm-ruler-fill',((mins-1)/89*100)+'%');});}

function pmAnalytics(){if(demoState==='loading')return '<div class="pm-state-note" role="status">Cargando el historial de Pomodoro…</div>';if(demoState==='error')return '<div class="pm-state-note">No se pudo cargar Analytics. El reloj conserva su estado. <button onclick="demoState=\'ready\';render()">Reintentar</button></div>';const now=new Date(),since=new Date(now);since.setDate(since.getDate()-pm.period+1);const cutoff=pmDay(since),rows=(demoState==='empty'?[]:pmRows).filter(r=>r.date>=cutoff&&(pm.filter==='all'||r.project===pm.filter)),focus=rows.filter(r=>r.mode==='focus'),done=focus.filter(r=>r.status==='completed'),cancel=focus.filter(r=>r.status==='cancelled'),minutes=focus.reduce((s,r)=>s+r.seconds/60,0),days=Array.from({length:pm.period},(_,i)=>{const d=new Date(since);d.setDate(d.getDate()+i);const date=pmDay(d),mins=focus.filter(r=>r.date===date).reduce((s,r)=>s+r.seconds/60,0);return {date,mins,label:d.toLocaleDateString('es-MX',{day:'numeric',month:pm.period===1?'short':undefined})};}),max=Math.max(1,...days.map(d=>d.mins)),history=rows.filter(r=>!pm.day||r.date===pm.day).slice().reverse();return `<div class="pm-analytics"><header><div><div class="pm-kicker">Analytics / Pomodoros</div><h1>Tu tiempo, bloque a bloque</h1><small>Datos ficticios para revisar el diseño</small></div><button onclick="pmOpen('timer')">Volver al reloj</button></header>${demoState==='empty'?'<div class="pm-state-note">Aún no hay bloques en este ejemplo. Tu primer bloque aparecerá aquí.</div>':pmGamePanel()}<div class="pm-filters">${[[1,'Hoy'],[7,'7 días'],[30,'30 días']].map(([n,t])=>`<button class="${pm.period===n?'on':''}" onclick="pm.period=${n};pm.day='';render()">${t}</button>`).join('')}<select aria-label="Filtrar proyecto en Analytics" onchange="pm.filter=this.value;pm.day='';render()"><option value="all">Todos los proyectos</option>${['ComandOS','Lola','MRP'].map(p=>`<option ${pm.filter===p?'selected':''}>${p}</option>`).join('')}</select>${pm.day?`<button onclick="pm.da function nfIcon(name){const shapes={bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',done:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',waiting:'<path d="M8 12V6a2 2 0 0 1 4 0v6-8a2 2 0 0 1 4 0v8-5a2 2 0 0 1 4 0v8c0 4-3 6-7 6-2 0-4-1-5-3l-4-6c-1-2 1-4 3-2l1 1"/>',error:'<path d="m12 3 10 18H2Z M12 9v5M12 17h.01"/>',terminal:'<path d="m5 7 5 5-5 5M13 17h6"/>',close:'<path d="m6 6 12 12M6 18l12-12"/>',sound:'<path d="m11 4-6 5H2v6h3l6 5Z M15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/>',mute:'<path d="m11 4-6 5H2v6h3l6 5Z M16 9l6 6M16 15l6-6"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',back:'<path d="m10 5-7 7 7 7M3 12h18"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',inbox:'<path d="m5 4-3 11v5h20v-5L19 4ZM2 15h6l2 3h4l2-3h6"/>',read:'<path d="m3 12 5 5L18 7M13 17l8-8"/>',circle:'<circle cx="12" cy="12" r="8"/>',monitor:'<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',phone:'<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M10 18h4"/>'};return `<svg class="nf-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${shapes[name]||shapes.bell}</svg>`;}

function nfReceive(kind='done',silent=false){if(demoState==='empty'){nf.events=[];demoState='ready';}const template=nfSeed.find(e=>e.kind===kind)||nfSeed[1];const e={...template,id:'n'+(++nf.seq),seen:false,resolved:false,age:'Ahora'};nf.events.unshift(e);nf.toast=e.id;nf.soundRouted=nf.lastDevice;nf.message=`Aviso simulado de ${nfPane(e.pane).project}. Sonido asignado a ${nfDevice(nf.lastDevice)}${window.nfAudio?.enabled()?'':'; audio desactivado'}.`;if(!silent&&nf.lastDevice===platform)window.nfAudio?.cue(kind==='error'?'error':kind==='waiting'?'open':'complete');render();const live=document.querySelector('#nf-live');if(live)live.textContent=`${nfPane(e.pane).project}, ${nfPane(e.pane).name}: ${e.title}.`;}

function ndStep(delta){const list=ndOrdered();nd.cursor=(nd.cursor+delta+list.length)%Math.max(1,list.length);render();}
function ndRow(e,preview=false){const p=nfPane(e.pane);return `<article class="nd-row ${e.kind} ${e.seen?'read':''} ${preview&&nd.selected===e.id?'selected':''}" data-nf-event="${e.id}"><button class="nd-open" onclick="${preview?'ndSelect':'nfOpen'}('${e.id}')" aria-label="${preview?'Vista previa de':'Abrir'} ${esc(p.project+' · '+p.name)}"><span class="nf-type">${nfIcon(e.kind)}</span><span class="nd-copy"><strong>${esc(e.title)}</strong><small>${esc(p.project+' · '+p.name+' · Pane '+p.index)}${nfPending(e)?' · Pendiente':''}</small></span><time>${e.age}</time></button><button class="nd-read" aria-label="${e.seen?'Marcar nuevo':'Marcar leído'}: ${esc(p.project+' '+p.name)}" onclick="nfRead('${e.id}')">${e.seen?nfIcon('read'):'<i class="nf-readmark"></i>'}</button></article>`;}
function ndPreview(e){if(!e)return nfEmpty();const p=nfPane(e.pane);return `<article class="nd-preview"><button class="nd-return" onclick="nd.preview=false;render()">← Lista</button><small>${esc(p.project+' / '+p.name+' / Pane '+p.index)}</small><h3>${nfIcon(e.kind)} ${esc(e.title)}</h3><p>${esc(e.text)}</p>${nfPending(e)?'<small>El permiso se responde dentro de su pane.</small>':''}<button class="primary" onclick="nfOpen('${e.id}')">${nf.closed.includes(e.pane)?'Ver pane cerrado':'Abrir pane'} ${nfIcon('arrow')}</button></article>`;}
function ndBody(){
 const list=nfFiltered();
 if(demoState==='loading')return '<div class="nf-skeleton" aria-label="Cargando avisos"></div>';
 if(!list.length)return nfEmpty();
 if(nf.peek){const e=nf.events.find(x=>x.id===nf.peek);return `<div class="nf-peek"><b>Este pane ya está cerrado</b><p>${esc(nfPane(e.pane).project+' · '+nfPane(e.pane).name)}</p><p>${esc(e.text)}</p><button onclick="nf.peek=null;render()">Volver a los avisos</button></div>`;}
 if(variant==='A')return `<h3>Más recientes primero</h3>${list.map(e=>ndRow(e)).join('')}`;
 if(variant==='B')return `<div class="nd-groups">${['ComandOS','Lola','MRP'].map(project=>{const es=list.filter(e=>nfPane(e.pane).project===project);return es.length?`<section class="nd-group"><h3>${project}<span>${es.length} avisos</span></h3>${es.map(e=>ndRow(e)).join('')}</section>`:'';}).join('')}</div>`;
 if(variant==='C'){const pending=list.filter(nfPending),rest=list.filter(e=>!nfPending(e));return `<div class="nd-priority"><section><h3><em>${nfIcon('waiting')} Necesitan tu respuesta · ${pending.length}</em></h3>${pending.length?pending.map(e=>ndRow(e)).join(''):'<p class="nd-readout">Ningún permiso pendiente.</p>'}</section><section><h3>Actividad · ${rest.length}</h3>${rest.length?rest.map(e=>ndRow(e)).join(''):'<p class="nd-readout">No hay más avisos en este filtro.</p>'}</section></div>`;}
 if(variant==='D'){if(!list.some(e=>e.id===nd.selected))nd.selected=list[0].id;return `<div class="nd-detail ${nd.preview?'has-preview':''}"><div class="nd-detail-list">${list.map(e=>ndRow(e,true)).join('')}</div>${ndPreview(list.find(e=>e.id===nd.selected))}</div>`;}
 const ordered=ndOrdered();nd.cursor=Math.min(nd.cursor,ordered.length-1);const e=ordered[nd.cursor];return `<div class="nd-single">${ndPreview(e)}<div class="nd-stepper"><strong>${nd.cursor+1} de ${ordered.length} avisos</strong><button aria-label="Aviso anterior" onclick="ndStep(-1)">←</button><button aria-label="Siguiente aviso" onclick="ndStep(1)">→</button><small>Primero los permisos pendientes</small><button aria-label="${e.seen?'Marcar nuevo':'Marcar leído'}" onclick="nfRead('${e.id}')">${nfIcon(e.seen?'circle':'read')}</button></div></div>`;
}
function ndInbox(){return `<aside class="nd-inbox" aria-label="Franja de notificaciones"><header class="nd-head"><h2>Avisos</h2><small>${nfUnread()} nuevos · ${nfAttention()} permisos pendientes</small><button aria-label="Contraer franja" onclick="nf.open=false;render()">${nfIcon('close')}</button></header><div class="nd-filters">${nfFilters()}<small>${variants[variant][0].split(' · ')[1]}</small></div><div class="nd-content">${ndBody()}</div><footer class="nd-bottom"><span>Leer no resuelve permisos</span><button onclick="nfReadAll()" ${nfUnread()?'':'disabled'}>Marcar todos leídos</button></footer></aside>`;}
function ndPicker(){
 document.querySelector('#handle b').textContent='Grill · Cómo atender los avisos';
 document.querySelector('.lab strong').textContent='ComandOS · Franja de avisos';
 let quick=document.querySelector('.nd-quick');if(!quick){quick=document.createElement('div');quick.className='nd-quick';document.querySelector('#handle').after(quick);}
 quick.innerHTML=Object.entries({A:'Tiempo',B:'Proyecto',C:'Respuesta',D:'Previa',E:'Uno a uno'}).map(([key,name])=>`<button class="${variant===key?'on':''}" onclick="setVariant('${key}')" aria-label="Propuesta ${key}: ${name}" aria-pressed="${variant===key}">${key}<small>${name}</small></button>`).join('');
 if(!document.querySelector('.nd-research')){const refs=document.createElement('div');refs.className='nd-research';refs.innerHTML='Referencias revisadas en Mobbin: <a target="_blank" rel="noreferrer" href="https://mobbin.com/screens/b71d21b5-1078-44a4-adb3-9583531a6059">Basecamp</a><a target="_blank" rel="noreferrer" href="https://mobbin.com/screens/05899178-5ec3-4a5e-831e-703561fd25ec">Tana</a><a target="_blank" rel="noreferrer" href="https://mobbin.com/screens/3c451683-6c3d-4c76-be6a-0a129143ba3a">Mindtrip</a><a target="_blank" rel="noreferrer" href="https://mobbin.com/screens/2f976b2e-5bd9-4b99-ab34-12988fd7d200">LinkedIn</a>';document.querySelector('#picker-body').append(refs);}
}
if(notificationDetailRound){
 Object.assign(variants,{A:['A · Por tiempo','Lista compacta: lo más reciente arriba. Abres el pane desde cada fila.'],B:['B · Por proyecto','Cada proyecto reúne sus avisos. En celular los grupos se apilan.'],C:['C · Primero tu respuesta','Propuesta recomendada: permisos pendientes separados de la actividad. Leer nunca resuelve un permiso.'],D:['D · Vista previa','Revisa el aviso dentro de la franja antes de decidir si abres su pane.'],E:['E · Uno a uno','Un aviso grande cada vez. Recorre la cola con las flechas; los permisos van primero.']});
 if(!new URLSearchParams(location.search).has('variant'))variant='C';
}

document.addEventListener('keydown',e=>{if(notificationRound&&e.key==='Escape'&&nf.open){e.preventDefault();nf.open=false;render();document.querySelector('.nf-bell')?.focus();return;}if(e.target.closest('input,textarea,select,[contenteditable],[role=slider]')||(notificationRound&&e.target.closest('button,[role=tab]')))return;if(e.key==='ArrowLeft'){e.preventDefault();cycle(-1)}if(e.key==='ArrowRight'){e.preventDefault();cycle(1)}});
const handle=document.querySelector('#handle'),picker=document.querySelector('#picker');let drag=null;handle.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY,r:picker.getBoundingClientRect()};handle.setPointerCapture(e.pointerId)});handle.addEventListener('pointermove',e=>{if(!drag)return;picker.style.left=Math.max(0,Math.min(innerWidth-picker.offsetWidth,drag.r.left+e.clientX-drag.x))+'px';picker.style.top=Math.max(0,Math.min(innerHeight-picker.offsetHeight,drag.r.top+e.clientY-drag.y))+'px';picker.style.bottom='auto';picker.style.right='auto'});handle.addEventListener('pointerup',()=>drag=null);handle.addEventListener('pointercancel',()=>drag=null);if(innerWidth<600||dockRound||pomoRound||notificationRound)picker.classList.add('collapsed');render();
</script>
<script type="module">if(new URLSearchParams(location.search).get("round")==="pomodoro")import("./prototype-pomodoro-audio.js").catch(()=>{window.say?.("No se pudieron cargar los sonidos. El reloj sigue disponible.");});</script><script type="module">
if(['notifications','notification-detail'].includes(new URLSearchParams(location.search).get('round'))){
 try{
  const [{createUISFX},{createUISounds}]=await Promise.all([import('./vendor/uisfx-0.4.0.js'),import('./prototype-ui-sounds.js')]);
  const sounds=createUISounds({createPlayer:createUISFX,pack:'soft',volume:.18,key:'comandos:prototype:notifications:sounds',browser:{document,addEventListener:window.addEventListener.bind(window),removeEventListener:window.removeEventListener.bind(window)}});
  window.nfAudio={enabled:()=>sounds.isEnabled(),ready:()=>sounds.isReady(),async toggle(event){await sounds.setEnabled(!sounds.isEnabled(),event);if(sounds.isEnabled()&&!sounds.isReady())window.say?.('El navegador no habilitó el audio; los avisos siguen visibles.');window.nfPaintSound?.();},cue:name=>sounds.play(name),stop:()=>sounds.stop()};
  window.nfPaintSound?.();window.addEventListener('pagehide',()=>{void sounds.dispose();},{once:true});
 }catch{window.say?.('No se pudo cargar el sonido. Puedes revisar todos los avisos visuales.');}
}
</script></html>
