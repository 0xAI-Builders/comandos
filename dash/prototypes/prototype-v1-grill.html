function config(){return `<div class="panel"><h3>Configurar este panel</h3><div class="sentence">Uso <select aria-label="Agente" onchange="say('Cambio de agente: confirmación simulada antes de aplicar')"><option>◉ Codex</option><option>◈ Claude</option></select><br>con <button onclick="model=model==='GPT-6 Astra'?'GPT-6 Sol':'GPT-6 Astra';pending=true;render()">‹ ${model} ›</button><br>esfuerzo <b id="effort-word">${effort}</b><input aria-label="Esfuerzo" type="range" min="0" max="3" value="${['low','medium','high','max'].indexOf(effort)}" oninput="document.querySelector('#effort-word').textContent=['low','medium','high','max'][this.value]" onchange="effort=['low','medium','high','max'][this.value];pending=true;render()">y cuenta <button onclick="say('Elegir cuenta: principal / trabajo')">‹ Principal ›</button></div><div><small>Usas seguido · ejemplo de historial</small><button style="display:block;margin-top:7px" onclick="model='GPT-6 Sol';effort='medium';pending=true;render()">Sol · medium · Principal</button></div><div class="active">${pending?'Cambio solicitado · aún sin confirmar':'● Activa · Astra · high · Principal'}${pending?'<button onclick="pending=false;render()">Simular confirmación</button>':''}</div><button style="margin-top:12px" onclick="go('extensions')">MCPs y skills →</button></div>`}
function sessionCard(s,i){return `<button class="session ${i===selected?'selected':''}" onclick="selected=${i};render()"><strong>${s.name}</strong><small>${s.task} · ${s.agent}</small><span class="${s.color}">${s.state}</span></button>`}
function sessionPage(){let leading=`<div class="tabs">${sessions.map((s,i)=>`<button class="${i===selected?'on':''}" onclick="selected=${i};render()">${s.name} ${i===0?'•':''}</button>`).join('')}<button onclick="go('new')">＋</button></div>`;
if(variant==='C')leading=`<div class="section-head"><h1>ComandOS <small>/ Interfaz 1.0</small></h1><button onclick="go('new')">Nueva sesión</button></div><div class="grid" style="margin-bottom:14px">${sessions.slice(0,3).map(sessionCard).join('')}</div>`;
if(variant==='D')leading=`<div class="kanban">${['Tu turno','Trabajando','Terminadas'].map((x,i)=>`<section><h3>${x} · 1</h3>${sessionCard(sessions[i],i)}</section>`).join('')}</div>`;

function extensions(){const n=tools.filter(t=>t.on).length;const visible=tools.filter(t=>(filter==='all'||t.kind===filter)&&t.name.toLowerCase().includes(search.toLowerCase()));return `<div class="section-head"><h1>MCPs y skills</h1><small>ComandOS · panel 1</small><button class="primary" onclick="say('Selección aplicada en la simulación; ningún proceso real se reinicia')">Aplicar selección</button></div><div class="selection"><strong>${n===0?'Ninguna seleccionada':n===tools.length?'Todas seleccionadas':'Selección parcial'} · ${n} de ${tools.length}</strong><button onclick="tools.forEach(t=>t.on=true);render()">Seleccionar todos</button><button onclick="tools.forEach(t=>t.on=false);render()">Quitar todos</button><small style="width:100%">Afecta a todo el catálogo editable, aunque haya filtros. Seleccionada no significa usada.</small></div><div class="toolsbar"><input id="tool-search" placeholder="Buscar MCP o skill…" value="${esc(search)}" oninput="search=this.value;render();let e=document.querySelector('#tool-search');e.focus();e.setSelectionRange(e.value.length,e.value.length)">${[['all','Todo'],['mcp','MCPs'],['skill','Skills']].map(([k,l])=>`<button class="${filter===k?'on':''}" onclick="filter='${k}';render()">${l}</button>`).join('')}</div><div class="catalog">${[true,false].map(on=>`<section class="panel"><h2>${on?'Seleccionadas':'Sin seleccionar'} · ${visible.filter(t=>t.on===on).length}</h2>${[...new Set(visible.filter(t=>t.on===on).map(t=>t.group))].map(g=>`<details open><summary><strong>${g}</strong><button onclick="event.preventDefault();tools.filter(t=>t.group==='${g}').forEach(t=>t.on=${!on});render()">${on?'Quitar':'Añadir'} categoría</button></summary><div class="chips">${visible.filter(t=>t.on===on&&t.group===g).map(t=>`<button class="chip ${t.kind} ${on?'on':''}" aria-pressed="${on}" onclick="tools.find(t=>t.name==='${t.name}').on=${!on};render()">${on?'✓':'＋'} ${t.name}<small>${t.tokens} t</small></button>`).join('')}</div></details>`).join('')||'<p class="muted">Ninguna con este filtro.</p>'}</section>`).join('')}</div><p class="footnote">Agrupaciones de ejemplo por origen o categoría. Tokens simulados para el mockup. Revisaremos agrupación y tamaño en su ronda.</p>`}

if(page==='toolusage')return `<h1>Uso de herramientas</h1><p class="muted">Ejemplo de uso observado, separado de la selección.</p><div class="tablewrap"><table><tr><th>Herramienta</th><th>Llamadas</th><th>Duración</th></tr><tr><td>chrome-bg</td><td>8</td><td>4,2 s</td></tr><tr><td>GitHub</td><td>3</td><td>1,1 s</td></tr><tr><td>Gmail</td><td>Sin datos</td><td>—</td></tr></table></div><button onclick="go('extensions')">Editar selección</button>`;

if(page==='recent')return `<h1>Sesiones cerradas</h1><p>La pestaña puede cerrarse y la sesión seguir disponible.</p><div class="row"><span class="grow">ComandOS · Auditoría anterior</span><button onclick="say('Restauración de ejemplo');go('sessions')">Reabrir pestaña</button></div>`;
if(page==='appearance')return `<h1>Apariencia</h1><div class="grid">${['Oscuro','Claro','Sistema'].map(n=>`<button class="session" onclick="say('Tema '+ '${n}' +' elegido para explorar en una ronda posterior')"><strong>${n}</strong><small>Mismo tema en desktop y remoto</small></button>`).join('')}</div>`;
if(page==='chat')return `<h1>Chat de ComandOS</h1><div class="chat"><div class="msg me">Ayúdame a ordenar las sesiones y revisar qué está esperando.</div><div class="msg">ComandOS espera tu decisión de diseño. Lola sigue trabajando; MRP ya terminó.<br><br><button onclick="selected=0;go('sessions')">Abrir ComandOS</button></div><div class="composer"><textarea aria-label="Mensaje" placeholder="Escribe a ComandOS…"></textarea><button onclick="say('Mensaje simulado. El mockup no llama a ningún modelo.')">Enviar ↑</button></div><small>Modelo del chat: GPT-6 Sol · conversación de ejemplo</small></div>`;
if(page==='new')return `<h1>Nueva sesión</h1><div class="panel"><div class="row"><label>Proyecto</label><select><option>ComandOS</option><option>Lola</option><option>MRP</option></select></div><div class="row"><label>Agente y modelo</label><select><option>Codex · Astra</option><option>Claude · Opus</option></select></div><div class="row"><label>Cuenta</label><select><option>Principal</option><option>Trabajo</option></select></div><div class="row"><label>Perfil de herramientas</label><select><option>Sin herramientas</option><option>Diseño</option><option>Desarrollo</option></select></div><div class="row"><label><input type="checkbox"> Sin aprobaciones</label></div><button class="primary" onclick="sessions.push({name:'Sesión de ejemplo',task:'Nueva tarea',agent:'Codex',state:'En reposo',color:''});selected=sessions.length-1;go('sessions')">Crear sesión de ejemplo</button></div>`;
if(page==='profiles')return `<h1>Perfiles</h1><p class="muted">Combina modelo, esfuerzo y selección de herramientas.</p><div class="grid">${['Desarrollo','Diseño','Investigación'].map(n=>`<div class="panel"><h2>${n}</h2><p>Codex · Sol · medium</p><button onclick="go('extensions')">Editar herramientas</button><button onclick="say('Perfil '+ '${n}' +' seleccionado en el mockup')">Usar</button></div>`).join('')}</div>`;

if(page==='logs'||page==='activity')return `<h1>${page==='logs'?'Logs de proveedores · propuesta':'Actividad'}</h1><div class="toolsbar"><select><option>Todos los proveedores</option><option>OpenAI</option><option>Anthropic</option></select><select><option>Todos los estados</option><option>Errores</option><option>Confirmados</option></select></div><div class="panel logs">10:42:18  OpenAI      Configuración confirmada\n10:42:16  ComandOS    Solicitud de cambio · high → medium\n10:38:04  Anthropic   Modelo sincronizado\n10:35:11  ComandOS    Selección guardada · 8 herramientas</div><p class="footnote">Registros ficticios para explorar lectura, filtrado y errores. Sin prompts ni credenciales.</p>`;
if(page==='focus')return `<h1>Foco y notificaciones</h1><div class="split"><div class="panel"><h2>25:00</h2><p>ComandOS · Interfaz 1.0</p><button onclick="say('Temporizador de ejemplo iniciado')">Iniciar foco</button></div><div class="panel"><h2>Espera tu respuesta</h2><p>ComandOS necesita una decisión.</p><button onclick="go('sessions')">Ir a la sesión</button></div></div>`;
if(page==='servers')return `<h1>Servidores</h1>${['Este equipo','Mac mini','Servidor de desarrollo'].map((n,i)=>`<div class="row"><span class="grow">${n}<small>${i===0?'Local':'SSH · configuración de ejemplo'}</small></span><span class="status">Disponible</span><button onclick="say('Conexión simulada a '+ '${n}')">Abrir</button></div>`).join('')}`;
if(page==='remote')return `<h1>Acceso remoto</h1><div class="panel"><p>Las mismas sesiones y controles, desde otro dispositivo.</p><div class="row"><label>Vista actual</label><b>${platform==='desktop'?'Desktop':'Remoto'}</b></div><div class="row"><label>Conexión de ejemplo</label><span class="status">Conectado</span></div><button onclick="platform=platform==='desktop'?'remote':'desktop';render()">Comparar desktop / remoto</button><p class="footnote">Diferencias permitidas: ventana nativa, conexión, teclado y gestos. La configuración y acciones del panel deben ser las mismas.</p></div>`;
if(page==='snippets')return `<h1>Snippets</h1><div class="split"><div class="panel"><button onclick="say('Snippet seleccionado')">Revisar cambios</button><button onclick="say('Snippet seleccionado')">Continuar tarea</button></div><div class="panel"><h2>Revisar cambios</h2><textarea style="width:100%;height:100px">Revisa el diff, comprueba los casos límite y explica los riesgos.</textarea><button onclick="say('Texto copiado solo dentro de la simulación')">Copiar</button></div></div>`;
if(page==='settings')return `<h1>Ajustes</h1><div class="panel">${[['Apariencia','Oscuro'],['Idioma','Español'],['Sonido','Desactivado'],['Densidad','Cómoda'],['Modelo del chat','GPT-6 Sol'],['Restaurar sesiones','Activado'],['Notificaciones','Solo cuando se necesita respuesta']].map(([n,v])=>`<div class="row"><label>${n}</label><button onclick="say('Ajuste de ejemplo: '+ '${n}')">${v} ›</button></div>`).join('')}<p class="footnote">Cada ajuste se revisará junto a su efecto en desktop y remoto.</p></div>`;

return `<h1>Atajos y ayuda</h1>${[['Ctrl + K','Buscar sesiones'],['Ctrl + Tab','Última pestaña'],['Ctrl + PgDn','Siguiente pestaña'],['F1','Ayuda'],['Escape','Cerrar panel']].map(([k,v])=>`<div class="row"><kbd>${k}</kbd><span>${v}</span></div>`).join('')}<p class="footnote">En remoto se mantienen botones equivalentes cuando el navegador reserva un atajo.</p>`}
function render(){if(tabRound&&variant!=='actual'){renderTabs();return;}if(paneRound&&variant!=='actual'){renderPanes();return;}document.querySelector('#variant').innerHTML=Object.entries(variants).map(([k,[n]])=>`<option value="${k}" ${variant===k?'selected':''}>${n}</option>`).join('');document.querySelector('#platform').value=platform;document.querySelector('#question').textContent=variants[variant][1];document.querySelector('#chrome').innerHTML=`<b class="traffic">${platform==='desktop'?'● ● ●':'↔'}</b><span>${platform==='desktop'?'ComandOS · Ventana desktop':'ComandOS · Navegador remoto'}</span><small>Mismos controles · ejemplo</small>`;const app=document.querySelector('#app');app.className='app v'+variant+(showNav?' show-nav':'');

app.innerHTML=`<div class="top"><button onclick="showNav=!showNav;render()" aria-label="Abrir navegación">☰</button><span class="brand">ComandOS</span><button class="search" onclick="go('map')">⌕ Ir a…</button><span class="grow"></span><span class="status">1 espera · 1 trabaja · 1 listo</span><button onclick="go('new')">＋ Sesión</button><button onclick="go('focus')" aria-label="Notificaciones">♧</button><button onclick="go('settings')">⚙</button></div><div class="work"><nav class="nav"><div class="group">${variant==='C'?'Proyectos':'Workspace'}</div>${nav.slice(0,6).map(([p,i,n])=>btn(p,i+' '+n)).join('')}<div class="group">Observar y organizar</div>${nav.slice(6).map(([p,i,n])=>btn(p,i+' '+n)).join('')}</nav><main class="main">${state}${demoState==='ready'?pageContent():''}</main></div><div class="bottomnav">${nav.filter(([p])=>['sessions','config','extensions','chat','usage'].includes(p)).map(([p,i,n])=>btn(p,i+' '+n)).join('')}</div><div class="tour"><small>Prueba humana ${tourStep+1}/${tour.length}</small><span>${tour[tourStep][1]}</span><button onclick="say('Anotado como aprobado en esta exploración');tourStep=(tourStep+1)%tour.length;go(tour[tourStep][0])">Se entiende ✓</button><button onclick="say('Pendiente de revisar. Dime qué te estorba en esta parte.')">Me estorba ✕</button></div>`;document.querySelector('#verdict').textContent=verdict}

function paneClose(id){paneExamples=paneExamples.filter(p=>p.id!==id);if(paneActive===id)paneActive=paneExamples[0]?.id;render();say('Split cerrado en la simulación. Cerrar termina la sesión de ese pane; los demás continúan.');}
function paneView(p){const full=variant==='A',opened=paneInfo===p.id;return `<article class="pr-pane ${paneActive===p.id?'chosen':''}" onclick="if(paneActive!==${p.id})panePick(${p.id})"><header><div><small>${esc(p.project)} · ${esc(p.agent)}</small>${full?`<button class="pr-title" onclick="event.stopPropagation();paneInfo=paneInfo===${p.id}?null:${p.id};render()">${esc(p.title)} ⌄</button>`:''}</div><span class="grow"></span>${!full?`<button onclick="event.stopPropagation();paneInfo=paneInfo===${p.id}?null:${p.id};render()">De qué trata</button>`:''}<button aria-label="Cerrar split ${esc(p.title)}" onclick="event.stopPropagation();paneClose(${p.id})">×</button></header>${full?`<div class="pr-status">● ${esc(p.status)}</div>`:''}${opened?paneRecap(p):''}${variant==='E'?`<div class="pr-note"><b>${esc(p.title)}</b><p>${esc(p.goal)}</p><small>${esc(p.next)}</small></div>`:''}<pre>${p.agent==='SSH'?'':`<span class="pr-prompt">❯ ${esc(p.goal)}</span>\n\n`}${esc(p.reply)}\n\n<span class="pr-prompt">❯ </span>▌</pre><footer><span>${esc(p.status)}</span><button onclick="event.stopPropagation();say('Controles existentes del pane: modelo, cuenta, esfuerzo y herramientas.')">Configurar IA</button></footer></article>`}
function renderPanes(){const p=paneExamples.find(p=>p.id===paneActive)||paneExamples[0];document.querySelector('#variant').innerHTML=Object.entries(variants).map(([k,[n]])=>`<option value="${k}" ${variant===k?'selected':''}>${n}</option>`).join('');document.querySelector('#platform').value=platform;document.querySelector('#question').textContent=variants[variant][1];document.querySelector('#handle b').textContent='⠿ Ronda 2 · Reconocer cada pane';document.querySelector('.lab strong').textContent='ComandOS · Contexto de cada pane';document.querySelector('#chrome').innerHTML=`<span>${platform==='desktop'?'Ventana desktop':'Navegador remoto'} · disposición de ejemplo</span><small>Sin cambios en sesiones reales</small>`;
const map=`<div class="pr-map">${paneExamples.map(x=>`<button class="session ${x.id===paneActive?'selected':''}" onclick="panePick(${x.id})"><small>${esc(x.project)} · ${esc(x.agent)}</small><strong>${esc(x.title)}</strong><p>${esc(x.goal)}</p><span>${esc(x.status)}</span><small>${esc(x.next)}</small></button>`).join('')}</div>`;
const state=demoState==='ready'?'':`<div class="notice">${demoState==='loading'?'Actualizando el resumen. Puedes seguir usando la terminal.':demoState==='empty'?'Sin resumen todavía. Proyecto, agente y sesión siguen identificados.':demoState==='offline'?'Sin conexión. Se muestra el último contexto guardado.':'No se pudo actualizar el resumen. Puedes consultar la conversación.'}</div>`;
const app=document.querySelector('#app');app.className='app pr-app';app.innerHTML=`<div class="top"><strong class="brand">ComandOS</strong><span class="grow"></span><button onclick="paneOverview=!paneOverview;render()">Ver trabajos (${paneExamples.length})</button><button onclick="paneExamples.reverse();render()">Invertir orden</button></div><div class="pr-body">${state}${paneExamples.length?((variant==='D'||paneOverview)?map+(paneOverview?'':paneView(p)):`<div class="pr-layout ${variant==='C'?'with-context':''}"><div class="pr-grid">${paneExamples.map(paneView).join('')}</div>${variant==='C'?`<aside>${paneRecap(p)}</aside>`:''}</div>`):'<p>No hay splits abiertos en esta simulación. Recarga para restaurar los ejemplos.</p>'}</div><div class="tour"><span>Prueba: encuentra el pane del pago duplicado, cambia el orden y localízalo otra vez.</span><small>Misma identidad al moverlo · contexto ficticio</small></div>`;document.querySelector('#verdict').textContent=verdict;}

const tabRound=new URLSearchParams(location.search).get('round')==='tabs';
const tabExamples=[{id:'comandos',name:'ComandOS',panes:[{name:'Diseño de la interfaz',text:'❯ Quiero reconocer fácilmente de qué trata cada pane.\n\nComparando nombres, último intercambio y estado.'},{name:'Pruebas de recuperación',text:'❯ Comprueba que restaure los splits.\n\nEsperando revisión de los resultados.'}]},{id:'lola',name:'Lola',panes:[{name:'Checkout',text:'❯ Corrige el pago duplicado.\n\nRevisando reintentos y confirmaciones.'},{name:'Terminal',text:'$ npm test\n\nSalida de ejemplo · ningún comando real.'}]},{id:'server',name:'Servidor',panes:[{name:'SSH · Desarrollo',text:'$ systemctl --user status desarrollo\n● active (running)'}]}];
let tabGroups=[{id:'g1',members:['comandos','lola'],axis:'columns',ratio:50},{id:'g2',members:['server'],axis:'columns',ratio:50}],tabSelected='g1',tabDragging=null,tabSource='server',tabPeek=false;
const tabData=id=>tabExamples.find(t=>t.id===id);
if(tabRound)Object.assign(variants,{A:['A · Icono + cantidad','Un icono de división y «2 tabs». El número cuenta tabs completas, aunque cada una tenga panes.'],B:['B · Miniatura de distribución','La tab muestra un dibujo pequeño de cómo están distribuidas sus tabs interiores.'],C:['C · Nombres dentro de la tab','El indicador enumera las tabs reunidas para reconocerlas directamente.'],D:['D · Grupo desplegable','La pestaña muestra un grupo; al tocar el indicador se despliegan sus integrantes.'],E:['E · Lista de integrantes','La pestaña dedica una segunda línea a los nombres y la distribución.']});
function tabGlyph(axis){return `<svg aria-hidden="true" viewBox="0 0 24 18" width="22" height="17"><rect x="1" y="1" width="22" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>${axis==='columns'?'<path d="M12 1v16"':'<path d="M1 9h22"'} fill="none" stroke="currentColor" stroke-width="1.5"/></svg>`}
function tabBadge(g){if(g.members.length<2)return '';const count=g.members.length;const names=g.members.map(id=>tabData(id).name);if(variant==='B')return `<span class="tr-badge">${tabGlyph(g.axis)}<span>${count}</span></span>`;if(variant==='C')return `<span class="tr-children">${names.map(n=>`<span>${n}</span>`).join('')}</span>`;if(variant==='D')return `<span class="tr-badge">▱ ${count} tabs ⌄</span>`;if(variant==='E')return `<small class="tr-members">${names.join(' · ')} ${tabGlyph(g.axis)}</small>`;return `<span class="tr-badge">${tabGlyph(g.axis)} ${count} tabs</span>`;}
function tabMove(id,direction){const target=tabGroups.find(g=>g.id===tabSelected);if(!target||target.members.includes(id))return;for(const g of tabGroups)g.members=g.members.filter(x=>x!==id);tabGroups=tabGroups.filter(g=>g.members.length);target.members[direction==='left'||direction==='top'?'unshift':'push'](id);target.axis=direction==='top'||direction==='bottom'?'rows':'columns';tabDragging=null;tabSource=tabExamples.find(t=>!target.members.includes(t.id))?.id||'';render();say('Tab movida al grupo. Sus panes y conversaciones se conservan en esta simulación.');}
function tabSeparate(id){const g=tabGroups.find(g=>g.id===tabSelected);if(!g||g.members.length===1)return;g.members=g.members.filter(x=>x!==id);tabGroups.push({id:'separated-'+id,members:[id],axis:'columns',ratio:50});tabSource=id;render();say('Tab devuelta a la barra; sus procesos continúan. Solo cambió la disposición.');}
function tabReset(){tabGroups=tabExamples.map(t=>({id:t.id,members:[t.id],axis:'columns',ratio:50}));tabSelected='comandos';tabSource='lola';tabPeek=false;render();}
function tabDragStart(e,id){tabDragging=id;e.dataTransfer.setData('text/plain',id);e.dataTransfer.effectAllowed='move';document.querySelector('.tr-work')?.classList.add('dragging');}
function tabDrop(e,direction){e.preventDefault();const id=e.dataTransfer.getData('text/plain');if(tabExamples.some(t=>t.id===id))tabMove(id,direction);}
function renderTabs(){const g=tabGroups.find(g=>g.id===tabSelected)||tabGroups[0];tabSelected=g.id;const available=tabExamples.filter(t=>!g.members.includes(t.id));if(!available.some(t=>t.id===tabSource))tabSource=available[0]?.id||'';document.querySelector('#variant').innerHTML=Object.entries(variants).map(([k,[n]])=>`<option value="${k}" ${variant===k?'selected':''}>${n}</option>`).join('');document.querySelector('#platform').value=platform;document.querySelector('#question').textContent=variants[variant][1];document.querySelector('#handle b').textContent='⠿ Ronda 3 · Tabs divididas';document.querySelector('.lab strong').textContent='ComandOS · Varias tabs en una';document.querySelector('#chrome').innerHTML=`<span>${platform==='desktop'?'Desktop':'Remoto'} · tabs y panes simulados</span>`;
const app=document.querySelector('#app');app.className='app tr-app';app.innerHTML=`<div class="top"><b>ComandOS</b><span class="grow"></span><button onclick="tabReset()">Probar desde cero</button><button onclick="const g=tabGroups.find(g=>g.id===tabSelected);g.axis=g.axis==='rows'?'columns':'rows';render()">Cambiar orientación</button></div><div class="tr-strip" role="tablist">${tabGroups.map(x=>`<button role="tab" aria-selected="${g.id===x.id}" class="tr-tab ${g.id===x.id?'on':''}" draggable="${x.members.length===1}" ondragstart="tabDragStart(event,'${x.members[0]}')" ondragend="document.querySelector('.tr-work')?.classList.remove('dragging');tabDragging=null" onclick="tabSelected='${x.id}';tabPeek=variant==='D'?!tabPeek:false;render()"><span>${x.members.length>1&&variant!=='C'?tabData(x.members[0]).name:x.members.length===1?tabData(x.members[0]).name:'Grupo'}</span>${tabBadge(x)}</button>`).join('')}</div>${variant==='D'&&tabPeek?`<div class="tr-peek">${g.members.map(id=>`<span>${tabData(id).name} · ${tabData(id).panes.length} panes <button onclick="tabSeparate('${id}')">Separar</button></span>`).join('')}</div>`:''}<div class="tr-body"><div class="tr-hint">Arrastra una tab individual a un borde. En móvil, elige la tab y toca dónde colocarla.</div><div class="tr-touch"><label>Colocar <select id="tr-source" onchange="tabSource=this.value">${available.length?available.map(t=>`<option value="${t.id}" ${tabSource===t.id?'selected':''}>${t.name}</option>`).join(''):'<option>Todas están en este grupo</option>'}</select></label>${[['left','← Izquierda'],['right','Derecha →'],['top','↑ Arriba'],['bottom','Abajo ↓']].map(([d,l])=>`<button ${available.length?'':'disabled'} onclick="tabMove(tabSource,'${d}')">${l}</button>`).join('')}</div><div class="tr-work ${g.axis}" style="--tr-first:${g.members.length===2?g.ratio:100/g.members.length}%">${g.members.map(id=>{const t=tabData(id);return `<section class="tr-region" data-tab-id="${id}"><header><strong>${t.name}</strong><small>${t.panes.length} panes interiores</small>${g.members.length>1?`<button onclick="tabSeparate('${id}')">Separar tab ↗</button>`:''}</header><div class="tr-inner">${t.panes.map(p=>`<article><div>${p.name}</div><pre>${esc(p.text)}\n\n❯ ▌</pre></article>`).join('')}</div></section>`}).join('')}<div class="tr-dropgrid">${[['left','← Soltar a la izquierda'],['right','Soltar a la derecha →'],['top','↑ Soltar arriba'],['bottom','Soltar abajo ↓']].map(([d,l])=>`<div class="tr-drop ${d}" ondragover="event.preventDefault();event.dataTransfer.dropEffect='move'" ondrop="tabDrop(event,'${d}')">${l}</div>`).join('')}</div></div>${g.members.length===2&&g.axis==='columns'?`<label class="tr-ratio">Tamaño de la primera tab <input type="range" min="25" max="75" value="${g.ratio}" oninput="tabGroups.find(g=>g.id===tabSelected).ratio=Number(this.value);document.querySelector('.tr-work').style.setProperty('--tr-first',this.value+'%')"></label>`:''}</div><div class="tour"><span>${g.members.length} tab${g.members.length===1?'':'s'} completa${g.members.length===1?'':'s'} · ${g.members.reduce((n,id)=>n+tabData(id).panes.length,0)} panes interiores</span><small>Separar mueve la tab; cerrar un pane termina su sesión. Aquí solo se simula la distribución.</small></div>`;document.querySelector('#verdict').textContent=verdict;}

document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'){e.preventDefault();cycle(-1)}if(e.key==='ArrowRight'){e.preventDefault();cycle(1)}});
const handle=document.querySelector('#handle'),picker=document.querySelector('#picker');let drag=null;handle.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY,r:picker.getBoundingClientRect()};handle.setPointerCapture(e.pointerId)});handle.addEventListener('pointermove',e=>{if(!drag)return;picker.style.left=Math.max(0,Math.min(innerWidth-picker.offsetWidth,drag.r.left+e.clientX-drag.x))+'px';picker.style.top=Math.max(0,Math.min(innerHeight-picker.offsetHeight,drag.r.top+e.clientY-drag.y))+'px';picker.style.bottom='auto';picker.style.right='auto'});handle.addEventListener('pointerup',()=>drag=null);handle.addEventListener('pointercancel',()=>drag=null);if(innerWidth<600)picker.classList.add('collapsed');render();
</script></html>
