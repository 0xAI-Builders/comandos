<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ComandOS · Laboratorio · Barra de comandos</title>
<!-- THROWAWAY. Fase 2, ronda 2 (rehecha): la barra izquierda = Comandos del pane seleccionado + Terminales rápidas.
     Cinco composiciones dentro del marco del producto. Direct manipulation: clic inserta letra por letra SIN Enter; arrastrar un
     comando a cualquier pane lo escribe ahí; arrastrar a Cadenas lo añade como paso; los pasos se reordenan arrastrando.
     Arte pixel: Shikashi (CC BY 4.0), karsiori (CC0), Zoedoz (CC0) desde assets/pixel-packs. Catálogo: docs/tui-command-map.md.
     Nada real se ejecuta. ?variant=A..E&sel=1|2 -->
<style>
:root{color-scheme:dark;--bg:#101218;--panel:#171b24;--panel2:#121722;--line:#2a303e;--text:#eaf0fb;--dim:#949db0;--brand:#ad9cff;--brand-ink:#0a0d13;--green:#8aceac;--amber:#e6ba75;--red:#e08a8a;--r:12px}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:#080a10;color:var(--text);font:13px/1.45 system-ui,-apple-system,"Segoe UI",Inter,sans-serif}
button{font:inherit;cursor:pointer;background:#1c2130;color:var(--text);border:1px solid #303748;border-radius:10px;padding:8px 12px;min-height:36px;display:inline-flex;align-items:center;gap:8px}button:hover{background:#242b3d;border-color:#3d465c}
button.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700;min-height:44px}button.primary:hover{background:#bfb2ff}
button.ghost{background:transparent;border-color:transparent;color:var(--dim)}button.ghost:hover{color:var(--text);background:#1c2130}
button.pill{border-radius:999px;min-height:30px;padding:4px 12px;font-size:12px}
input{font:inherit;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 38px;width:100%;min-height:40px}input:focus{outline:2px solid var(--brand);outline-offset:-1px}
.px{image-rendering:pixelated;image-rendering:crisp-edges;display:inline-block;flex:none}
.ic{width:32px;height:32px;background:url(assets/pixel-packs/shikashi/icons.png) no-repeat;background-size:512px 867px}.ic.s24{width:24px;height:24px;transform:scale(.75);transform-origin:top left;margin-right:-8px;margin-bottom:-8px}
.ic.s20{transform:scale(.625);transform-origin:center;width:20px;height:20px}
.hour{width:42px;height:42px;background:url(assets/pixel-packs/zoedoz/hourglass.png) 0 0 no-repeat;animation:hour 1.5s steps(15) infinite}@keyframes hour{to{background-position-x:-630px}}
.chest{width:40px;height:25px;background:url(assets/pixel-packs/karsiori-chests/golden.png) 0 0 no-repeat;animation:chest 2.4s steps(1,end) infinite}
@keyframes chest{0%,12%{background-position-x:0}18%{background-position-x:-40px}27%{background-position-x:-80px}36%{background-position-x:-120px}45%,80%{background-position-x:-160px}87%{background-position-x:-80px}100%{background-position-x:0}}
.brew{width:33px;height:35px;background:url(assets/pixel-packs/karsiori/clock.png) 0 0 no-repeat;animation:brew 1.2s steps(12) infinite}@keyframes brew{to{background-position-x:-396px}}
.hour.sm,.brew.sm{transform:scale(.6);transform-origin:center}
/* lab frame */
.lab{display:flex;align-items:center;gap:12px;padding:10px 16px;font-size:13px}.lab b{font-size:14px}.lab span{color:var(--dim)}
.device{margin:0 14px 14px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg);height:calc(100vh - 66px);display:grid;grid-template-rows:30px 52px 44px minmax(0,1fr) 40px}
.chrome{display:flex;align-items:center;padding:0 12px;font-size:11px;color:var(--dim);background:#0d0f16;border-bottom:1px solid var(--line)}.chrome b{color:var(--text);font-weight:600}.chrome span{margin-left:auto}
.top{display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line)}.top .burger{width:36px;height:36px;justify-content:center;padding:0}.top h1{font-size:15px;margin:0}.top .right{margin-left:auto;display:flex;gap:8px}
.tabs{display:flex;align-items:stretch;border-bottom:1px solid var(--line);padding:0 4px;overflow:hidden}.tab{display:flex;align-items:center;gap:6px;padding:0 14px;font-size:13px;color:var(--dim);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}.tab.on{color:var(--text);background:var(--panel);border-bottom-color:var(--brand)}.tab small{font-size:11px}.tab.qt{color:var(--green)}
.body{display:grid;min-height:0;grid-template-columns:var(--sbw,360px) minmax(0,1fr)}
.strip{display:flex;align-items:center;gap:10px;padding:0 12px;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}.strip .right{margin-left:auto;display:flex;gap:8px}
/* main */
main{display:flex;flex-direction:column;min-height:0;padding:10px 12px;gap:10px;position:relative}
.crumb{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}.crumb b{color:var(--text)}.crumb .right{margin-left:auto;display:flex;gap:6px}
.panes{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:0;flex:1}
.pane{display:flex;flex-direction:column;min-height:0;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden;transition:box-shadow .15s}
.pane.sel{box-shadow:0 0 0 2px var(--brand)}.pane.drop{box-shadow:0 0 0 2px var(--green);background:#16221d}
.pane-head{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim)}.pane-head b{color:var(--text)}.pane-head .tag{margin-left:auto;font-size:11px;color:var(--brand)}
.term{flex:1;min-height:80px;overflow:auto;padding:10px 12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.55;white-space:pre-wrap}
.term .u{color:#c9d1e6}.term .a{color:#a9b2c8}.term .m{color:var(--green)}.term .s{color:#6b7389}.term .d{color:var(--amber)}
.prompt{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line);background:var(--panel2);font-family:ui-monospace,Menlo,monospace;font-size:12.5px;min-height:44px}
.prompt .in{flex:1;min-width:0;white-space:nowrap;overflow:hidden}.prompt .in::after{content:"▍";animation:blink .9s infinite}.prompt .hint{font:11px system-ui;color:var(--amber);display:flex;gap:6px}.prompt .hint button{min-height:28px;padding:2px 8px;border-radius:8px}
@keyframes blink{50%{opacity:.15}}
/* sidebar */
aside{display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--line);background:var(--panel2);position:relative}
.sb-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}.sb-head h2{font-size:14px;margin:0;flex:1}.sb-head small{display:block;color:var(--dim);font-size:11px;font-weight:400}
.pill{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid #2f5a44;color:var(--green);display:inline-flex;gap:5px;align-items:center;white-space:nowrap}.pill.warn{border-color:#6a5530;color:var(--amber)}
.search{padding:10px 12px;position:relative}.search .ic{position:absolute;left:18px;top:14px;pointer-events:none}
.cat{flex:1;min-height:0;overflow:auto;padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.grp{flex:none;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.grp-h{display:flex;align-items:center;gap:8px;padding:8px 12px;font-weight:600;font-size:12.5px;border-bottom:1px solid var(--line)}.grp-h small{color:var(--dim);font-weight:400;margin-left:auto}
.cmd{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:9px 12px;cursor:pointer;border-top:1px solid #1e2330;position:relative}.cmd:first-of-type{border-top:0}.cmd:hover{background:#1d2333}.cmd:active{background:#232a3d}
.cmd code{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--text)}.cmd code em{color:var(--dim);font-style:normal}.cmd small{grid-column:1;color:var(--dim);font-size:11.5px}
.cmd .grab{color:#4a5166;font-size:14px;align-self:center;cursor:grab}.cmd .uv{grid-column:1;font-size:10.5px;color:var(--amber)}
.cmd .opts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}.cmd .opts button{min-height:26px;padding:2px 9px;font-size:11.5px;border-radius:999px;background:#12161f}
.cmd.dragging{opacity:.4}
/* chains */
.chains{flex:none;padding:0 0 12px;display:grid;gap:8px}.chains.drop .chain-new{border-color:var(--green);background:#16221d}
.chain{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:10px 12px}.chain-h{display:flex;align-items:center;gap:8px;font-weight:600}.chain-h small{color:var(--dim);font-weight:400}.chain-h .right{margin-left:auto}
.steps{display:grid;gap:6px;margin:8px 0 0}.step{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);font-family:ui-monospace,Menlo,monospace;font-size:11.5px;cursor:grab}.step .k{font:10.5px system-ui;color:var(--dim);min-width:34px}.step.done{opacity:.45;text-decoration:line-through}.step.cur{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}.step .grab{margin-left:auto;color:#4a5166}
.chain-new{border-style:dashed;color:var(--dim);text-align:center;padding:14px;border-radius:var(--r);border:1px dashed var(--line)}
.chain-run{display:flex;align-items:center;gap:10px;margin-top:10px}
/* terminals */
.tt{display:flex;align-items:flex-end;gap:4px;padding:8px 10px 0;border-bottom:1px solid var(--line);overflow:auto}.tt .t{display:flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;color:var(--dim);font-size:12px;white-space:nowrap;cursor:pointer;background:var(--panel2)}.tt .t.on{color:var(--text);background:#0c0f16}.tt .t.plus{color:var(--brand);font-weight:700}
.mini{flex:1;min-height:0;overflow:auto;padding:10px 12px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.55;background:#0c0f16;white-space:pre-wrap;color:#c9d1e6}.mini .s{color:#6b7389}.mini .a{color:#a9b2c8}.mini .in::after{content:"▍";animation:blink .9s infinite}
.divider{height:8px;cursor:row-resize;border-top:1px solid var(--line);background:linear-gradient(#3a4256,#3a4256) center/44px 3px no-repeat;border-radius:3px}
.sec{display:flex;flex-direction:column;min-height:0}
/* variants */
.vA aside{--sbw:360px}.vA .sec-cmds{flex:1 1 58%}.vA .sec-terms{flex:1 1 42%}
.vB aside{--sbw:380px}.vB .sec-terms{flex:1}.vB .fab{position:absolute;left:12px;bottom:12px;z-index:3;border-radius:999px;padding:8px 16px 8px 10px;min-height:44px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.sheet{position:absolute;inset:auto 0 0 0;height:78%;background:var(--panel2);border-top:1px solid var(--line);border-radius:14px 14px 0 0;z-index:4;display:flex;flex-direction:column;box-shadow:0 -12px 40px rgba(0,0,0,.5);animation:up .18s ease-out}@keyframes up{from{transform:translateY(20px);opacity:0}}
.vC aside{--sbw:290px}.vC .cmd{grid-template-columns:1fr auto}
.vD aside{--sbw:320px}.drawer{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);display:flex;flex-direction:column;height:220px;min-height:0;overflow:hidden}.drawer.min{height:44px}.drawer.min .mini{display:none}.drawer .tt{border-bottom:1px solid var(--line)}.drawer .tt .close{margin-left:auto;border:0;background:transparent;color:var(--dim);padding:6px 10px}
.vE aside{--sbw:340px}.vE .tt.top{padding-top:8px}.vE .cmd{padding:12px 12px}.vE .cmd code{font-size:14px}.vE .cmd small{font-size:12px}

/* ---- ronda 3: modal de comandos ---- */
.backdrop{position:absolute;inset:0;background:rgba(6,8,14,.72);z-index:20;display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{width:min(1040px,100%);height:min(700px,100%);background:var(--panel2);border:1px solid #3a4256;border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.7);display:flex;flex-direction:column;min-height:0;overflow:hidden;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.m-head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}.m-head h2{margin:0;font-size:15px}.m-head small{display:block;color:var(--dim);font-weight:400;font-size:11.5px}
.m-head .target{display:flex;gap:6px;margin-left:auto;align-items:center}.m-head .target span{font-size:11px;color:var(--dim)}.m-head .x{min-height:36px;width:36px;justify-content:center;padding:0;border-radius:10px}
.m-body{flex:1;min-height:0;display:grid}
.m-foot{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}.m-foot .right{margin-left:auto;display:flex;gap:8px}
.m-col{display:flex;flex-direction:column;min-height:0;min-width:0}
.m-col .search{padding:10px 14px}.m-col .cat{padding:0 14px 14px}
.builder{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.builder .b-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:600}.builder .b-head input{padding:6px 10px;min-height:34px;flex:1;background:var(--panel2)}
.dropzone{flex:1;min-height:0;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}.dropzone.drop{background:#16221d;box-shadow:inset 0 0 0 2px var(--green)}
.dropzone .empty{margin:auto;text-align:center;color:var(--dim);border:2px dashed var(--line);border-radius:14px;padding:28px 18px;font-size:12.5px}.dropzone .empty i{display:block;margin:0 auto 8px}
.bstep{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);cursor:grab;font-family:ui-monospace,Menlo,monospace;font-size:12px}.bstep .n{font:12px system-ui;color:var(--brand);font-weight:700;min-width:18px}.bstep .k{font:10.5px system-ui;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:1px 6px}.bstep .x{margin-left:auto;color:var(--dim);cursor:pointer}.bstep:hover .x{color:var(--red)}.bstep.over{border-color:var(--brand)}
.b-foot{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.cmd .add{position:absolute;right:38px;top:8px;min-height:26px;padding:0 8px;font-size:12px;border-radius:8px;display:none}.cmd:hover .add,.touch .cmd .add{display:inline-flex}
/* A: dos columnas */
.mA .m-body{grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr)}
/* B: tablero + hotbar */
.mB .m-body{grid-template-rows:minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}.board{display:grid;grid-auto-flow:column;grid-auto-columns:250px;gap:12px;padding:12px 14px;overflow:auto;min-height:0}.board .grp{display:flex;flex-direction:column;min-height:0;overflow:hidden}.board .grp>div:not(.grp-h){overflow:auto}
.hotbar{border-top:1px solid var(--line);background:var(--panel);padding:10px 14px;display:flex;align-items:center;gap:10px}.hotbar .slots{display:flex;gap:8px;flex:1;min-width:0;overflow:auto;padding:4px 2px}.hotbar .slot{width:112px;height:64px;flex:none;border:2px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--dim);cursor:grab;background:var(--panel2)}.hotbar .slot.full{border-style:solid;border-color:#3d465c;color:var(--text)}.hotbar .slot .n{font:10px system-ui;color:var(--brand);font-weight:700}.hotbar .slot .x{font:10px system-ui;color:var(--dim)}.hotbar.drop .slot:not(.full){border-color:var(--green)}
/* C: paleta + flujo */
.mC .m-body{grid-template-columns:minmax(0,1fr) 360px}.mC .list{display:flex;flex-direction:column;min-height:0}.mC .rows{flex:1;min-height:0;overflow:auto}.mC .row{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:9px 16px;cursor:pointer;border-bottom:1px solid #1e2330;position:relative}.mC .row:hover{background:#1d2333}.mC .row code{font-family:ui-monospace,Menlo,monospace;font-size:13px}.mC .row small{display:block;color:var(--dim);font-size:11.5px}.mC .row .g{font-size:10.5px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
.flow{display:flex;flex-direction:column;align-items:stretch;gap:0}.flow .bstep{border-radius:12px}.flow .arrow{text-align:center;color:var(--brand);font-size:16px;line-height:18px}
/* D: pestañas */
.mD .m-body{grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr)}.mD .mtabs{display:flex;gap:6px;padding:10px 16px 0;border-bottom:1px solid var(--line)}.mD .mtabs .t{padding:10px 16px;border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;color:var(--dim);cursor:pointer;display:flex;gap:8px;align-items:center}.mD .mtabs .t.on{color:var(--text);background:var(--panel)}
.mD .chainlist{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:0}.mD .chainlist .lst{border-right:1px solid var(--line);overflow:auto;padding:10px}.mD .chainlist .lst .it{padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;gap:8px;align-items:center}.mD .chainlist .lst .it.on{background:var(--panel)}.mD .chainlist .lst .it small{color:var(--dim);margin-left:auto}
/* E: grimorio */
.mE .m-body{grid-template-rows:minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}.grim{overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px}.grim h3{margin:0 0 8px;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;display:flex;gap:8px;align-items:center}.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.tile{position:relative;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:12px 10px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center;min-height:104px}.tile:hover{border-color:var(--brand);background:#1d2333}.tile code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}.tile small{color:var(--dim);font-size:10.5px;line-height:1.3}.tile .add{position:absolute;right:6px;top:6px;min-height:24px;width:24px;padding:0;justify-content:center;border-radius:8px;font-size:14px;display:none}.tile:hover .add,.touch .tile .add{display:inline-flex}
@media(max-width:900px){.backdrop{padding:0}.modal{border-radius:0;height:100%}.m-head{flex-wrap:wrap;gap:8px}.m-head small{display:none}.m-head .target{margin-left:0;width:100%;flex-wrap:wrap}.m-head .x{position:absolute;right:8px;top:8px}.m-head{position:relative}.m-foot span{font-size:11px}.mA .m-body,.mC .m-body{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,42%)}.builder{border-left:0;border-top:1px solid var(--line)}.mD .chainlist{grid-template-columns:1fr}.mD .chainlist .lst{display:none}.m-head .target span{display:none}.hotbar .slot{width:96px}}


/* ---- ronda 4: tablero optimizado ---- */
.tb .m-head{padding:8px 14px}.tb .m-head h2{font-size:14px}.tb .m-head .search{padding:0;flex:1;max-width:340px;margin-left:12px}.tb .m-head .search .ic{left:6px;top:4px}.tb .m-head input{min-height:36px;padding-left:36px}
.tb .m-body{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
.tb .board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:10px 12px;overflow:auto;min-height:0}
.tb .grp{display:flex;flex-direction:column;min-height:0;overflow:hidden}.tb .grp>div:not(.grp-h){overflow:auto}.tb .grp-h{padding:6px 10px;font-size:12px}
.tb .cmd{padding:7px 10px;grid-template-columns:1fr auto;gap:0 6px}.tb .cmd code{font-size:12.5px}.tb .cmd small{font-size:11px;line-height:1.3}.tb .cmd .grab{display:none}.tb .cmd .add{right:8px;top:6px}
.tb .cmd .opts{margin-top:3px;gap:3px}.tb .cmd .opts button{min-height:22px;padding:1px 7px;font-size:10.5px}
.tb .hotbar{padding:6px 12px;gap:8px}.tb .hotbar .slot{width:92px;height:48px;font-size:10.5px;border-radius:10px}.tb .hotbar .slot .n{font-size:9.5px}.tb .hotbar .slot .x{display:none}.tb .hotbar .slot.full:hover .x{display:block}.tb .hotbar input{width:130px;min-height:32px;padding:4px 8px}.tb .hotbar button{min-height:32px;padding:4px 10px}
.tb .m-foot{padding:6px 14px;font-size:11px}
/* A y C: el modal encoge a su contenido */
.modal.tbA,.modal.tbC{height:auto;max-height:min(760px,100%)}.tbA .m-body,.tbC .m-body{grid-template-rows:auto auto auto}.tbA .board,.tbC .board{overflow:visible}.tbA .grp,.tbC .grp{overflow:visible}.tbA .grp>div:not(.grp-h),.tbC .grp>div:not(.grp-h){overflow:visible}

const ALLGROUPS=()=>[...CAT[PANES[SEL].h].groups,SHELL];
function cmdRow(n,d,opts,kind,extra=''){return `<div class="cmd" draggable="true" data-cmd="${esc(n)}" data-kind="${kind}"><code>${esc(n.trim())}${n.endsWith(' ')?' <em>…</em>':''}</code><span class="grab" title="arrastra a la cadena">⠿</span><button class="add" data-add="${esc(n)}" data-kind="${kind}" title="añadir a la cadena">+ cadena</button><small>${d}</small>${extra}${opts?`<span class="opts">${opts.map(o=>`<button data-cmd="${esc(n+o)}" data-kind="pane">${o}</button>`).join('')}</span>`:''}</div>`}
function mHead(){const c=CAT[PANES[SEL].h];const drift=CATST==='drift';return `<div class="m-head">${ic('book')}<h2>Comandos<small>${c.name} ${c.ver} · clic inserta sin Enter · arrastra o + para encadenar</small></h2><div class="target"><span>escribe en</span>${['1','2'].map(k=>`<button class="pill ${k===SEL?'primary':''}" data-sel="${k}" style="min-height:30px">${PANES[k].title} · ${PANES[k].h}</button>`).join('')}<span class="pill ${drift?'warn':''}">${drift?ic('bomb','s20')+'binario 2.1.270':ic('spark','s20')+'verificado'}</span><button class="ghost x" data-mclose="1">✕</button></div></div>`}
function catCol(){const Q=q.toLowerCase();return `<div class="m-col"><div class="search">${ic('lens')}<input id="q" placeholder="Buscar comando…" value="${esc(q)}"></div><div class="cat">${ALLGROUPS().map(g=>{const rows=g.cmds.filter(([n,d])=>!Q||n.toLowerCase().includes(Q)||d.toLowerCase().includes(Q));if(!rows.length)return'';return `<div class="grp"><div class="grp-h">${ic(g.i,'s24')}${g.t}<small>${rows.length}</small></div>${rows.map(([n,d,o])=>cmdRow(n,d,o,g===SHELL?'shell':'pane')).join('')}</div>`}).join('')}</div></div>`}

function builder(title='Cadena nueva'){return `<div class="builder"><div class="b-head">${ic('chain','s24')}<input id="bname" placeholder="Nombre de la cadena" value="${esc(BUILD.name)}"></div><div class="dropzone" id="dropzone">${buildSteps()}</div><div class="b-foot"><button class="primary" data-bsave="1" ${BUILD.steps.length?'':'disabled'}>${ic('spark','s20')}Guardar cadena</button><button data-brun="1" ${BUILD.steps.length?'':'disabled'}>${ic('cast','s20')}Correr ahora</button><button class="ghost" data-bclear="1">Vaciar</button></div></div>`}
function hotbar(){return `<div class="hotbar" id="dropzone"><span style="font-weight:600;display:flex;gap:8px;align-items:center">${ic('chain','s24')}Cadena</span><div class="slots">${BUILD.steps.map(([k,c],j)=>`<div class="slot full" draggable="true" data-bstep="${j}"><span class="n">${j+1} · ${k}</span>${esc(c.length>16?c.slice(0,15)+'…':c)}<span class="x" data-bdel="${j}">quitar</span></div>`).join('')}${Array.from({length:Math.max(1,6-BUILD.steps.length)}).map(()=>'<div class="slot">suelta aquí</div>').join('')}</div><input id="bname" placeholder="Nombre" value="${esc(BUILD.name)}" style="width:150px;padding:6px 10px;min-height:36px"><button class="primary" data-bsave="1" ${BUILD.steps.length?'':'disabled'}>Guardar</button><button data-brun="1" ${BUILD.steps.length?'':'disabled'}>${ic('cast','s20')}Correr</button></div>`}
function modalBody(){
  if(MV==='A')return `<div class="m-body">${catCol()}${builder()}</div>`;
  if(MV==='B'){const Q=q.toLowerCase();return `<div class="m-body"><div class="m-col"><div class="search">${ic('lens')}<input id="q" placeholder="Buscar comando…" value="${esc(q)}"></div><div class="board">${ALLGROUPS().map(g=>{const rows=g.cmds.filter(([n,d])=>!Q||n.toLowerCase().includes(Q)||d.toLowerCase().includes(Q));return `<div class="grp"><div class="grp-h">${ic(g.i,'s24')}${g.t}<small>${rows.length}</small></div><div>${rows.map(([n,d,o])=>cmdRow(n,d,o,g===SHELL?'shell':'pane')).join('')}</div></div>`}).join('')}</div></div>${hotbar()}</div>`}
  if(MV==='C'){const Q=q.toLowerCase();const rows=ALLGROUPS().flatMap(g=>g.cmds.filter(([n,d])=>!Q||n.toLowerCase().includes(Q)||d.toLowerCase().includes(Q)).map(([n,d,o])=>({n,d,o,g})));
    return `<div class="m-body"><div class="list"><div class="search">${ic('lens')}<input id="q" placeholder="Escribe para buscar… (⌘K)" value="${esc(q)}" autofocus></div><div class="rows">${rows.map(r=>`<div class="row cmd" draggable="true" data-cmd="${esc(r.n)}" data-kind="${r.g===SHELL?'shell':'pane'}">${ic(r.g.i)}<div><code>${esc(r.n.trim())}${r.n.endsWith(' ')?' <em>…</em>':''}</code><small>${r.d}</small>${r.o?`<span class="opts">${r.o.map(o=>`<button data-cmd="${esc(r.n+o)}" data-kind="pane">${o}</button>`).join('')}</span>`:''}</div><span class="g">${r.g.t}</span><button class="add" data-add="${esc(r.n)}" data-kind="${r.g===SHELL?'shell':'pane'}" style="position:static">+</button></div>`).join('')}</div></div><div class="builder"><div class="b-head">${ic('chain','s24')}<input id="bname" placeholder="Nombre de la cadena" value="${esc(BUILD.name)}"></div><div class="dropzone flow" id="dropzone">${BUILD.steps.length?BUILD.steps.map(([k,c],j)=>`${j?'<div class="arrow">↓</div>':''}<div class="bstep" draggable="true" data-bstep="${j}"><span class="n">${j+1}</span><span class="k">${k}</span>${esc(c)}<span class="x" data-bdel="${j}">✕</span></div>`).join(''):`<div class="empty">${ic('chain')}Suelta comandos para dibujar el flujo.</div>`}</div><div class="b-foot"><button class="primary" data-bsave="1" ${BUILD.steps.length?'':'disabled'}>Guardar</button><button data-brun="1" ${BUILD.steps.length?'':'disabled'}>${ic('cast','s20')}Correr</button><button class="ghost" data-bclear="1">Vaciar</button></div></div></div>`}
  if(MV==='D'){const ch=CHAINS[curChain]||{name:'',steps:[]};return `<div class="m-body"><div class="mtabs"><span class="t ${mtab==='cmds'?'on':''}" data-mtab="cmds">${ic('book','s20')}Comandos</span><span class="t ${mtab==='chains'?'on':''}" data-mtab="chains">${ic('chain','s20')}Cadenas <small style="color:var(--dim)">${CHAINS.length}</small></span></div>${mtab==='cmds'?`<div class="m-body" style="grid-template-columns:1fr">${catCol()}</div>`:`<div class="chainlist"><div class="lst">${CHAINS.map((c,i)=>`<div class="it ${i===curChain?'on':''}" data-cur="${i}">${ic('chain','s20')}${c.name}<small>${c.steps.length}</small></div>`).join('')}<div class="it" data-cur="new" style="color:var(--brand)">+ Cadena nueva</div></div>${builder()}</div>`}</div>`}
  if(MV==='E'){const Q=q.toLowerCase();return `<div class="m-body"><div class="m-col"><div class="search">${ic('lens')}<input id="q" placeholder="Buscar en el grimorio…" value="${esc(q)}"></div><div class="grim">${ALLGROUPS().map(g=>{const rows=g.cmds.filter(([n,d])=>!Q||n.toLowerCase().includes(Q)||d.toLowerCase().includes(Q));if(!rows.length)return'';return `<div><h3>${ic(g.i,'s20')}${g.t}</h3><div class="tiles">${rows.map(([n,d,o])=>`<div class="tile cmd" draggable="true" data-cmd="${esc(n)}" data-kind="${g===SHELL?'shell':'pane'}">${ic(g.i)}<code>${esc(n.trim().split(' ')[0])}</code><small>${d}</small><button class="add" data-add="${esc(n)}" data-kind="${g===SHELL?'shell':'pane'}">+</button></div>`).join('')}</div></div>`}).join('')}</div></div>${hotbar()}</div>`}}
function modalHTML(){if(!modal)return'';return `<div class="backdrop" data-mclose="1"><div class="modal m${MV}">${mHead()}${modalBody()}<div class="m-foot"><span>${ic('cast','s20')} Clic en un comando: lo escribe en <b style="color:var(--text)">${PANES[SEL].title}</b> sin Enter y cierra este libro.</span><div class="right"><button class="ghost" data-mclose="1">Cerrar</button></div></div></div></div>`}
function sidebarModalRound(){return `<aside><div class="sec sec-terms">${termTabs()}${mini(TERMS[termTab])}</div><button class="fab primary" data-modal="1">${ic('book','s24')}Comandos <kbd style="opacity:.7">/</kbd></button></aside>`}
function wireBuilder(){
  const dz=$('dropzone');if(dz){dz.addEventListener('dragover',e=>{if(dragCmd||dragStep!==null){e.preventDefault();dz.classList.add('drop')}});dz.addEventListener('dragleave',()=>dz.classList.remove('drop'));dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drop');if(dragCmd){BUILD.steps.push([dragCmd.kind,dragCmd.cmd]);dragCmd=null;render()}})}
  document.querySelectorAll('[data-bstep]').forEach(el=>{el.addEventListener('dragstart',e=>{dragStep=+el.dataset.bstep;e.dataTransfer.setData('text/bstep',el.dataset.bstep);e.stopPropagation()});el.addEventListener('dragend',()=>{dragStep=null});el.addEventListener('dragover',e=>{if(dragStep!==null){e.preventDefault();el.classList.add('over')}});el.addEventListener('dragleave',()=>el.classList.remove('over'));el.addEventListener('drop',e=>{if(dragStep===null)return;e.preventDefault();e.stopPropagation();const to=+el.dataset.bstep;const [m]=BUILD.steps.splice(dragStep,1);BUILD.steps.splice(to,0,m);dragStep=null;render()})});
  const bn=$('bname');if(bn)bn.oninput=e=>{BUILD.name=e.target.value}}

function tbHead(){const c=CAT[PANES[SEL].h];const drift=CATST==='drift';return `<div class="m-head">${ic('book','s24')}<h2>Comandos</h2><div class="search">${ic('lens','s24')}<input id="q" placeholder="Buscar…" value="${esc(q)}"></div><div class="target"><span>escribe en</span>${['1','2'].map(k=>`<button class="pill ${k===SEL?'primary':''}" data-sel="${k}" style="min-height:28px">${PANES[k].title} · ${PANES[k].h}</button>`).join('')}<span class="pill ${drift?'warn':''}">${drift?ic('bomb','s20')+'2.1.270 sin verificar':ic('spark','s20')+c.ver}</span><button class="ghost x" data-mclose="1">✕</button></div></div>`}

function tbRail(){return `<div class="rail" id="dropzone"><div class="b-head">${ic('chain','s24')}<input id="bname" placeholder="Nombre de la cadena" value="${esc(BUILD.name)}"></div><div class="slots">${BUILD.steps.map(([k,c],j)=>`<div class="slot full" draggable="true" data-bstep="${j}"><span class="n">${j+1} · ${k}</span>${esc(c.length>22?c.slice(0,21)+'…':c)}<span class="x" data-bdel="${j}">quitar</span></div>`).join('')}${Array.from({length:Math.max(1,5-BUILD.steps.length)}).map(()=>'<div class="slot">suelta aquí</div>').join('')}</div><div class="b-foot"><button class="primary" data-bsave="1" ${BUILD.steps.length?'':'disabled'}>Guardar cadena</button><button data-brun="1" ${BUILD.steps.length?'':'disabled'}>${ic('cast','s20')}Correr ahora</button></div></div>`}

function ldHead(){const c=CAT[PANES[SEL].h];const drift=CATST==='drift';return `<div class="sb-head">${ic('book','s24')}<h2>Comandos<small>${c.name} ${c.ver} · ${PANES[SEL].title}</small></h2><span class="pill ${drift?'warn':''}">${drift?ic('bomb','s20')+'sin verificar':ic('spark','s20')+'ok'}</span><button class="chains" data-modal="1" title="armar cadenas">${ic('chain','s20')}Cadenas</button></div>`}
function ldGroups(){const Q=q.toLowerCase();return ALLGROUPS().map((g,gi)=>{const rows=g.cmds.filter(([n,d])=>!Q||n.toLowerCase().includes(Q)||d.toLowerCase().includes(Q));if(!rows.length)return'';const kind=g===SHELL?'shell':'pane';

  $('tabs').innerHTML=`<span class="tab on">ComandOS <small>2 panes</small></span><span class="tab">Lola <small>1 pane</small></span><span class="tab">MRP <small>1 pane</small></span>`+(V==='C'?TERMS.map((t,i)=>`<span class="tab qt ${wsTab==='t'+i?'on':''}" data-ws="t${i}">${ic('bolt','s20')}${t.name}</span>`).join('')+`<span class="tab" data-ws="s" style="display:none"></span>`:'');

  const list=ROUND==='lado'?LADOS:ROUND==='tablero'?TABLEROS:ROUND==='modal'?MODALS:VARIANTS,cur=ROUND==='lado'?LV:ROUND==='tablero'?TV:ROUND==='modal'?MV:V;const v=list.find(x=>x.k===cur);$('vtitle').textContent=(ROUND==='lado'?'Barra · ':ROUND==='tablero'?'Tablero · ':ROUND==='modal'?'Modal · ':'')+v.k+' · '+v.name;$('vdesc').textContent=v.desc;

  url.searchParams.set('variant',V);url.searchParams.set('sel',SEL);url.searchParams.set('round',ROUND);url.searchParams.set('modal',MV);url.searchParams.set('t',TV);url.searchParams.set('l',LV);history.replaceState(null,'',url);
  if(ROUND==='modal'||ROUND==='tablero'||ROUND==='lado')wireBuilder();
  if(ROUND==='lado'&&LV==='E')document.querySelectorAll('.tile.cmd').forEach(el=>el.addEventListener('mouseenter',()=>{hoverCmd=[el.dataset.cmd.trim(),el.dataset.desc];const ex=$('explain');const opts=el.dataset.opts?JSON.parse(el.dataset.opts):null;if(ex)ex.innerHTML=`<code>${esc(hoverCmd[0])}</code>${esc(hoverCmd[1])}${opts?`<span class="opts">${opts.map(o=>`<button data-cmd="${esc(el.dataset.cmd+o)}" data-kind="pane">${o}</button>`).join('')}</span>`:''}`}));
  if(ROUND==='tablero'&&TV==='C')document.querySelectorAll('.tb .cmd').forEach(el=>el.addEventListener('mouseenter',()=>{hoverCmd=[el.dataset.cmd.trim(),el.dataset.desc];const ex=$('explain');if(ex)ex.innerHTML=`<code>${esc(hoverCmd[0])}</code>${esc(hoverCmd[1])}`}));
  const qi=$('q');if(qi)qi.oninput=e=>{q=e.target.value;const p=qi.selectionStart;render();const n=$('q');if(n){n.focus();n.setSelectionRange(p,p)}};
  wireDnD();}
// ---- inserción letra por letra, sin Enter ----
let typing=null;
function typeInto(obj,text,after){if(typing)clearInterval(typing);let i=0;obj.input='';typing=setInterval(()=>{obj.input=text.slice(0,++i);render();if(i>=text.length){clearInterval(typing);typing=null;after&&after()}},26)}
function insert(cmd,kind,target){const obj=kind==='shell'?(target||TERMS[termTab]):(target||PANES[SEL]);if(kind==='shell'&&V==='C'){wsTab='t'+termTab}typeInto(obj,cmd);if(V==='B'){sheet=false}if(ROUND==='modal'||ROUND==='tablero'){modal=false}}
function pressEnter(){const p=PANES[SEL];if(!p.input)return;const t=p.input.trim();p.lines.push(['u','› '+t]);
  if(t.startsWith('/model ')&&t.length>7)p.lines.push(['m','Set model to '+t.slice(7)]);else if(t.startsWith('/effort ')&&t.length>8)p.lines.push(['m','Set effort level to '+t.slice(8)]);else if(t==='/exit')p.lines.push(['s','$']);else p.lines.push(['a','(respuesta nativa del CLI)']);
  p.input='';if(run){run.step++}render()}
// ---- drag & drop directo ----
function wireDnD(){
  document.querySelectorAll('.cmd[draggable]').forEach(el=>{el.addEventListener('dragstart',e=>{dragCmd={cmd:el.dataset.cmd,kind:el.dataset.kind};el.classList.add('dragging');e.dataTransfer.effectAllowed='copy';e.dataTransfer.setData('text/plain',el.dataset.cmd)});el.addEventListener('dragend',()=>{dragCmd=null;el.classList.remove('dragging')})});
  document.querySelectorAll('.pane').forEach(el=>{el.addEventListener('dragover',e=>{if(dragCmd){e.preventDefault();el.classList.add('drop')}});el.addEventListener('dragleave',()=>el.classList.remove('drop'));el.addEventListener('drop',e=>{e.preventDefault();if(!dragCmd)return;SEL=el.dataset.pane;typeInto(PANES[SEL],dragCmd.cmd)})});
  const ch=$('chains');if(ch){ch.addEventListener('dragover',e=>{if(dragCmd){e.preventDefault();ch.classList.add('drop')}});ch.addEventListener('dragleave',()=>ch.classList.remove('drop'));ch.addEventListener('drop',e=>{e.preventDefault();if(!dragCmd)return;const last=CHAINS[CHAINS.length-1];if(last&&last.name==='Cadena nueva')last.steps.push([dragCmd.kind,dragCmd.cmd]);else CHAINS.push({name:'Cadena nueva',steps:[[dragCmd.kind,dragCmd.cmd]]});dragCmd=null;render()})}
  document.querySelectorAll('.step[draggable]').forEach(el=>{el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/step',el.dataset.step);e.stopPropagation()});el.addEventListener('dragover',e=>{if(e.dataTransfer.types.includes('text/step'))e.preventDefault()});el.addEventListener('drop',e=>{const from=e.dataTransfer.getData('text/step');if(!from)return;e.preventDefault();e.stopPropagation();const [ci,fj]=from.split(':').map(Number),[cj,tj]=el.dataset.step.split(':').map(Number);if(ci!==cj)return;const s=CHAINS[ci].steps;const [m]=s.splice(fj,1);s.splice(tj,0,m);render()})});
  const dv=document.querySelector('.divider');if(dv){dv.onpointerdown=e=>{const cmds=document.querySelector('.sec-cmds'),terms=document.querySelector('.sec-terms');const h0=cmds.getBoundingClientRect().height,y0=e.clientY;dv.setPointerCapture(e.pointerId);dv.onpointermove=ev=>{const h=Math.max(120,h0+ev.clientY-y0);cmds.style.flex='0 0 '+h+'px';terms.style.flex='1 1 auto'};dv.onpointerup=()=>{dv.onpointermove=null}}}}
// ---- eventos ----
document.addEventListener('click',e=>{const el=e.target.closest('[data-arg],[data-grp],[data-sbgrp],[data-add],[data-bdel],[data-bsave],[data-brun],[data-bclear],[data-mclose],[data-modal],[data-mtab],[data-cur],[data-cmd],[data-pane],[data-term],[data-tab],[data-sheet],[data-drawer],[data-run],[data-run-next],[data-run-stop],[data-sel],[data-cat],[data-sim],[data-v],[data-ws]');if(!el)return;const d=el.dataset;
  if(d.arg){e.stopPropagation();el.closest('.cmd').classList.toggle('open');return}
  if(d.grp!==undefined&&TV==='E'&&!el.closest('.cmd')&&!e.target.closest('[data-add]')){if(!el.classList.contains('open')){openGrp=+d.grp;render()}return}
  if(d.add!==undefined){BUILD.steps.push([d.kind,d.add]);render();return}if(d.bdel!==undefined){BUILD.steps.splice(+d.bdel,1);render();return}
  if(d.bsave){const name=BUILD.name||'Cadena '+(CHAINS.length+1);if(MV==='D'&&curChain!=='new'&&CHAINS[curChain]){CHAINS[curChain]={name,steps:BUILD.steps}}else{CHAINS.push({name,steps:BUILD.steps});curChain=CHAINS.length-1}BUILD={name:'',steps:[]};if(MV==='D'){BUILD={name:CHAINS[curChain].name,steps:[...CHAINS[curChain].steps]}}render();return}
  if(d.brun){CHAINS.push({name:BUILD.name||'Cadena sin guardar',steps:BUILD.steps});run={i:CHAINS.length-1,step:0};BUILD={name:'',steps:[]};modal=false;render();return}
  if(d.bclear){BUILD={name:'',steps:[]};render();return}
  if(d.mclose){if(el.classList.contains('backdrop')&&e.target!==el)return;modal=false;render();return}if(d.modal){modal=true;render();setTimeout(()=>$('q')&&$('q').focus(),0);return}
  if(d.mtab){mtab=d.mtab;if(mtab==='chains'){curChain=0;BUILD={name:CHAINS[0].name,steps:[...CHAINS[0].steps]}}render();return}
  if(d.cur!==undefined){if(d.cur==='new'){curChain='new';BUILD={name:'',steps:[]}}else{curChain=+d.cur;BUILD={name:CHAINS[curChain].name,steps:[...CHAINS[curChain].steps]}}render();return}
  if(d.cmd!==undefined){if(ROUND==='lado'&&el.closest('.chain-only')){BUILD.steps.push([d.kind,d.cmd]);render();return}insert(d.cmd,d.kind);return}
  if(d.sbgrp!==undefined&&LV==='B'&&e.target.closest('.grp-h')){openGrpSb=+d.sbgrp;render();return}
  if(d.pane){SEL=d.pane;render();return}
  if(d.term!==undefined){if(d.term==='new'){const n=new Date(Date.now()+TERMS.length*8*6e4);const hh=String(14+Math.floor((48+TERMS.length*8)/60)).padStart(2,'0'),mm=String((48+TERMS.length*8)%60).padStart(2,'0');TERMS.push({name:`${hh}:${mm}`,dir:`2026-09-29-${hh}${mm}`,lines:[['s',`~/comandos-terminales/2026-09-29-${hh}${mm} $`]],input:''});termTab=TERMS.length-1;if(V==='E')tab='t'+termTab;if(V==='D')drawerMin=false;if(V==='C')wsTab='t'+termTab}else{termTab=+d.term;if(V==='E')tab='t'+termTab}render();return}
  if(d.ws){wsTab=d.ws;render();return}
  if(d.tab){tab=d.tab;render();return}
  if(d.sheet){sheet=true;render();setTimeout(()=>$('q')&&$('q').focus(),0);return}
  if(d.drawer){drawerMin=!drawerMin;render();return}
  if(d.run!==undefined){run={i:+d.run,step:0};if(V==='E')tab='chains';render();return}
  if(d.runNext){const ch=CHAINS[run.i];const [k,c]=ch.steps[run.step];if(k==='pane')typeInto(PANES[SEL],c);else{if(V==='C')wsTab='t'+termTab;typeInto(TERMS[termTab],c,()=>{run&&run.step++;render()})}return}
  if(d.runStop){run=null;render();return}
  if(d.sel){SEL=d.sel;render();return}if(d.cat){CATST=d.cat;render();return}if(d.v){if(ROUND==='lado'){LV=d.v;modal=false}else if(ROUND==='tablero'){TV=d.v;modal=true}else if(ROUND==='modal'){MV=d.v;modal=true}else{V=d.v}sheet=false;run=null;tab='cmds';wsTab='s';render();return}
  if(d.sim==='enter')pressEnter();if(d.sim==='esc'){PANES[SEL].input='';render()}if(d.sim==='reset')location.reload();});
document.addEventListener('keydown',e=>{if(/input|textarea/i.test(e.target.tagName))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){const list=ROUND==='lado'?LADOS:ROUND==='tablero'?TABLEROS:ROUND==='modal'?MODALS:VARIANTS;const i=list.findIndex(v=>v.k===(ROUND==='lado'?LV:ROUND==='tablero'?TV:ROUND==='modal'?MV:V));const nk=list[(i+(e.key==='ArrowRight'?1:4))%5].k;if(ROUND==='lado'){LV=nk;modal=false}else if(ROUND==='tablero'){TV=nk;modal=true}else if(ROUND==='modal'){MV=nk;modal=true}else{V=nk}sheet=false;run=null;tab='cmds';wsTab='s';render()}
  if(e.key==='Enter')pressEnter();if(e.key==='Escape'){PANES[SEL].input='';sheet=false;modal=false;render()}if(e.key==='/'&&ROUND!=='lado'&&(V==='B'||ROUND==='modal'||ROUND==='tablero')){if(ROUND!=='barra')modal=true;else sheet=true;render();e.preventDefault();setTimeout(()=>$('q')&&$('q').focus(),0)}});
$('fold').onclick=e=>{e.stopPropagation();$('picker').classList.toggle(innerWidth<=900?'collapsed':'compact')};if(ROUND==='modal'||ROUND==='tablero'||ROUND==='lado')$('picker').classList.add('compact');
(function drag(){const p=$('picker'),g=$('grab');let sx,sy,ox,oy,on=false;g.addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON')return;on=true;sx=e.clientX;sy=e.clientY;const r=p.getBoundingClientRect();ox=r.left;oy=r.top;g.setPointerCapture(e.pointerId)});
 g.addEventListener('pointermove',e=>{if(!on)return;p.style.left=(ox+e.clientX-sx)+'px';p.style.top=(oy+e.clientY-sy)+'px';p.style.right='auto';p.style.bottom='auto'});
 g.addEventListener('pointerup',e=>{on=false;if(Math.abs(e.clientX-sx)<4&&Math.abs(e.clientY-sy)<4&&innerWidth<=900)p.classList.toggle('collapsed')});if(innerWidth<=900)p.classList.add('collapsed');})();
if((ROUND==='modal'||ROUND==='tablero')&&url.searchParams.get('open')!=='0')modal=true;if('ontouchstart' in window)document.documentElement.classList.add('touch');
render();
