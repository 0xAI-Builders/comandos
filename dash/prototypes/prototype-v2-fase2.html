<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ComandOS · Laboratorio fase 2</title>
<!-- THROWAWAY. Fase 2, ronda 1: política de cambios de IA (modelo/esfuerzo/cuenta/harness) sobre el pane seleccionado.
     Cinco políticas simuladas con un motor de pasos. Ninguna sesión, tmux ni CLI real se toca. ?variant=A..E&harness=claude&state=libre -->
<style>
:root{color-scheme:dark;--bg:#101218;--panel:#171b24;--line:#2a303e;--text:#e7eaf2;--dim:#949db0;--brand:#ad9cff;--green:#8aceac;--amber:#e6ba75;--red:#e08a8a}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:#080a10;color:var(--text);font:13px/1.45 system-ui,-apple-system,Segoe UI,Inter,sans-serif}
.app{height:100vh;display:grid;grid-template-rows:38px minmax(0,1fr);background:var(--bg)}
.top{display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim)}
.top b{color:var(--text)}.top .tabs{display:flex;gap:6px;margin-left:8px}.top .tab{padding:3px 10px;border:1px solid var(--line);border-radius:6px}.top .tab.on{background:var(--panel);color:var(--text);border-color:#3a4256}
.work{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:0}
aside{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.side-head{padding:10px 14px;border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
.side-head b{display:block;font-size:13px;text-transform:none;letter-spacing:0;color:var(--text);margin-top:2px}
.fields{padding:8px 10px;display:grid;gap:6px}
.field{display:grid;grid-template-columns:76px minmax(0,1fr) auto;align-items:center;gap:8px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:#12151d}
.field label{color:var(--dim);font-size:11px}.field .val{font-weight:600}.field .val small{display:block;font-weight:400;color:var(--dim);font-size:11px}
.chip{font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.chip.activo{color:var(--green);border-color:#2f5a44}.chip.elegido{color:var(--amber);border-color:#6a5530}.chip.proximo{color:var(--brand);border-color:#4a3f7a}.chip.desconocido{color:var(--red);border-color:#6a3a3a}
.opzone{margin:4px 10px 8px;padding:10px;border:1px dashed var(--line);border-radius:8px;min-height:74px;font-size:12px}
.opzone.empty{color:var(--dim)}.opzone .title{font-weight:600;margin-bottom:4px}.opzone .title.err{color:var(--red)}.opzone .title.ok{color:var(--green)}.opzone .title.wait{color:var(--amber)}
.opzone .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
button{font:inherit;cursor:pointer;background:#1f2432;color:var(--text);border:1px solid #3a4256;border-radius:6px;padding:5px 10px}button:hover{background:#28304a}button.primary{background:var(--brand);color:#12111a;border-color:var(--brand);font-weight:600}button.ghost{background:transparent}button:disabled{opacity:.45;cursor:default}
.log{flex:1;min-height:0;overflow:auto;border-top:1px solid var(--line);padding:8px 10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--dim)}
.log div{padding:2px 0;border-bottom:1px solid #1d222d}.log div b{color:var(--text);font-weight:500}.log .t{color:#5f6779;margin-right:6px}
main{display:flex;flex-direction:column;min-height:0}
.pane-head{display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim)}.pane-head b{color:var(--text)}
.state{margin-left:auto;display:flex;align-items:center;gap:6px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}.dot.turno{background:var(--amber);animation:pulse 1s infinite}.dot.permiso{background:var(--red)}.dot.caducada{background:#5f6779}
@keyframes pulse{50%{opacity:.35}}
.term{flex:1;min-height:0;overflow:auto;padding:12px 16px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.5;background:#0b0d13;white-space:pre-wrap}
.term .u{color:#c9d1e6}.term .a{color:#9aa4bd}.term .m{color:var(--green)}.term .e{color:var(--red)}.term .s{color:#5f6779}.term .d{color:var(--amber)}.term .p{color:var(--brand)}
.cursor::after{content:"▍";color:var(--text);animation:pulse .9s infinite}
.dialog{position:absolute;inset:0;background:rgba(8,10,16,.55);display:flex;align-items:center;justify-content:center;z-index:5}
.dialog>div{background:var(--panel);border:1px solid #3a4256;border-radius:10px;padding:16px 18px;max-width:420px;width:92%}.dialog h3{margin:0 0 6px;font-size:14px}.dialog p{margin:0 0 12px;color:var(--dim);font-size:12px}.dialog .acts{display:flex;gap:8px;flex-wrap:wrap}
main{position:relative}
/* picker */
.picker{position:fixed;right:14px;bottom:14px;z-index:50;width:300px;background:#f2f3f8;color:#151824;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.55);font-size:12px;user-select:none}
.picker .grab{cursor:grab;padding:8px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #d5d8e3;font-weight:600}.picker .grab span{margin-left:auto;font-weight:400;color:#6a7086;font-size:11px}
.picker .row{display:flex;align-items:center;gap:6px;padding:8px 12px}.picker .row.wrap{flex-wrap:wrap}.picker .name{flex:1;text-align:center;font-weight:600}.picker .name small{display:block;font-weight:400;color:#4d5368}
.picker button{background:#fff;color:#151824;border:1px solid #c9cddc;padding:4px 8px;font-size:11px}.picker button.on{background:#151824;color:#fff;border-color:#151824}.picker button.act{background:var(--brand);border-color:var(--brand);color:#12111a;font-weight:600}
.picker .lab{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#6a7086;width:100%;margin-top:2px}
.picker .desc{padding:0 12px 10px;color:#4d5368;font-size:11px}
@media(max-width:820px){.top{overflow:hidden}.top>span:last-child{display:none}.top .tabs{min-width:0;overflow:hidden}.top .tab{white-space:nowrap}.app{min-width:0}.side-head b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.work{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);max-height:46vh}.picker{width:calc(100% - 20px);right:10px;left:10px;bottom:10px}.picker.collapsed .body>*:not(.row:first-child){display:none}.picker .grab span::after{content:" · toca para plegar"}}
</style>
<div class="app">
  <div class="top"><b>ComandOS</b><span>·</span><span>3</span><div class="tabs"><span class="tab on">ComandOS</span><span class="tab">Lola</span><span class="tab">MRP</span></div><span style="margin-left:auto">fase 2 · ronda 1 · política de cambios</span></div>
  <div class="work">
    <aside>
      <div class="side-head">Pane seleccionado<b id="dest">ComandOS · sesión 2 · pane %3</b></div>
      <div class="fields" id="fields"></div>
      <div class="opzone empty" id="opzone">Sin operación en curso.</div>
      <div class="log" id="log"></div>
    </aside>
    <main>
      <div class="pane-head"><b id="ph-harness">claude</b><span id="ph-model">claude-fable-5-1 · high</span><span class="state"><i class="dot" id="dot"></i><span id="state-txt">libre</span></span></div>
      <div class="term" id="term"></div>
      <div id="dlg"></div>
    </main>
  </div>
</div>
<div class="picker" id="picker">
  <div class="grab" id="grab">Política <span>arrastra · ←/→ cambia</span></div>
  <div class="body">
  <div class="row"><button id="prev">←</button><div class="name" id="vname"></div><button id="next">→</button></div>
  <div class="desc" id="vdesc"></div>
  <div class="row wrap"><span class="lab">Harness del pane</span><span id="hs"></span></div>
  <div class="row wrap"><span class="lab">Estado del pane</span><span id="ss"></span></div>
  <div class="row wrap"><span class="lab">Cambiar desde la barra</span>
    <button class="act" data-op="effort">Esfuerzo → max</button><button class="act" data-op="model">Modelo → opus-5-5</button><button class="act" data-op="account">Cuenta → relotto</button><button class="act" data-op="harness">Harness → codex</button></div>
  <div class="row wrap"><span class="lab">Simular el mundo real</span><button data-sim="turnEnd">Termina el turno</button><button data-sim="permOk">Aceptas el permiso</button><button data-sim="manual">Cambio a mano en la terminal</button><button data-sim="reset">Reiniciar</button></div>
  </div>
</div>
<script>
// ---------- hechos simulados por harness (del código inspeccionado; opencode/grok sin vía viva comprobada) ----------
const HARNESS={
  claude:{live:{effort:{cmd:l=>`/effort ${l}`,marker:'Set effort level to '},model:{cmd:m=>`/model ${m}`,marker:'Set model to ',dialog:'Switch model?'}},account:'relaunch',harness:'handoff'},
  codex:{live:{model:{cmd:()=>'/model',marker:'Model: ',picker:true},effort:{cmd:()=>'/model',marker:'Reasoning effort: ',picker:true}},account:'relaunch',harness:'handoff'},
  grok:{live:{},account:'relaunch',harness:'handoff'},
  opencode:{live:{},account:'relaunch',harness:'handoff',publishes:true},
};
const OPS={effort:{field:'effort',to:'max',label:'esfuerzo'},model:{field:'model',to:'claude-opus-5-5',label:'modelo'},account:{field:'account',to:'relotto',label:'cuenta'},harness:{field:'harness',to:'codex',label:'harness'}};
const STATES={libre:'libre',turno:'turno activo',permiso:'permiso pendiente',caducada:'señal caducada (sin lectura desde hace 4 min)'};
const VARIANTS=[
 {k:'A',name:'En vivo, confirmado por marcador',desc:'Envía el comando nativo del CLI dentro del proceso y solo marca “activo” cuando aparece el marcador del propio CLI. Sin vía viva o si el pane está ocupado, te pregunta; nunca relanza por su cuenta.'},
 {k:'B',name:'Relanzar siempre (hoy)',desc:'Toda operación sale del agente y reanuda con --resume. Espera idle automáticamente (hasta 45 min) confiando en la señal de actividad que tenga.'},
 {k:'C',name:'Preguntar cada vez',desc:'Antes de aplicar, un diálogo: en vivo, reanudar o cancelar. Tú eliges la vía en cada cambio.'},
 {k:'D',name:'Nunca interrumpir: encolar',desc:'En vivo si existe. Si el pane está ocupado, la barra deja el cambio “pendiente hasta fin de turno” y lo aplica sola al terminar, sin tocar la terminal.'},
 {k:'E',name:'Solo en frío: perfil de arranque',desc:'La barra no toca la conversación viva. Edita la configuración del próximo arranque y ofrece “Reanudar con esta config” o “Abrir pane nuevo”.'},
];
// ---------- estado ----------
const url=new URL(location.href);
let V=url.searchParams.get('variant')||'A', H=url.searchParams.get('harness')||'claude', S=url.searchParams.get('state')||'libre';
let cfg, chosen, queue, term, running, pending, t0;
function fresh(){cfg={harness:H,account:'main',model:H==='codex'?'gpt-5.5-codex':H==='grok'?'grok-5':'claude-fable-5-1',effort:'high'};chosen={...cfg};queue=[];running=false;pending=null;t0=Date.now();
  term=[['s','$ '+(H==='claude'?'claude --model claude-fable-5-1 --effort high':H+' --resume 8f2c…')],['a',(H==='claude'?'Claude Code v2.1.160':H+' cli')+' · '+cfg.model],['u','> revisa el flaky de test_session_config_history'],['a','Leyendo tests/test_session_config_history.py…']];
  if(S==='turno')term.push(['a','Editando lib/session_operations.py (turno en curso)…']);
  if(S==='permiso')term.push(['d','Allow Bash(pytest -q tests/)?  1) Yes  2) No  ›']);
  if(S==='libre'||S==='caducada')term.push(['a','Listo. El test asume orden de dict; propongo…'],['s','>']);
  logEl.innerHTML='';opz('Sin operación en curso.',null,[],'empty');render();}
// ---------- render ----------
const $=id=>document.getElementById(id);const logEl=$('log');
function chip(field){ if(V==='E'&&chosen[field]!==cfg[field])return'proximo';if(pending&&pending.field===field)return pending.state;return 'activo';}
function render(){
  $('dest').textContent='ComandOS · sesión 2 · pane %3';
  $('fields').innerHTML=['harness','account','model','effort'].map(f=>{const c=chip(f);const v=(V==='E'&&c==='proximo')||(pending&&pending.field===f&&pending.state!=='activo')?chosen[f]:cfg[f];
    const sub=c==='proximo'?`vivo: ${cfg[f]}`:c==='elegido'?`activo: ${cfg[f]}`:c==='desconocido'?'sin confirmar':'';
    return `<div class="field"><label>${{harness:'Harness',account:'Cuenta',model:'Modelo',effort:'Esfuerzo'}[f]}</label><div class="val">${v}${sub?`<small>${sub}</small>`:''}</div><span class="chip ${c}">${{activo:'activo',elegido:'elegido',proximo:'próximo arranque',desconocido:'desconocido'}[c]}</span></div>`}).join('');
  $('ph-harness').textContent=cfg.harness;$('ph-model').textContent=cfg.model+' · '+cfg.effort+' · '+cfg.account;
  $('dot').className='dot '+(S==='libre'?'':S);$('state-txt').textContent=running?'operación en curso':STATES[S];
  $('term').innerHTML=term.map(([c,l],i)=>`<div class="${c}${i===term.length-1&&S!=='permiso'?' cursor':''}">${esc(l)}</div>`).join('');$('term').scrollTop=1e6;
  const v=VARIANTS.find(x=>x.k===V);$('vname').innerHTML=`${v.k}<small>${v.name}</small>`;$('vdesc').textContent=v.desc;
  $('hs').innerHTML=Object.keys(HARNESS).map(h=>`<button data-h="${h}" class="${h===H?'on':''}">${h}</button>`).join('');
  $('ss').innerHTML=Object.keys(STATES).map(s=>`<button data-s="${s}" class="${s===S?'on':''}">${s}</button>`).join('');
  document.querySelectorAll('[data-op]').forEach(b=>b.disabled=running);
  url.searchParams.set('variant',V);url.searchParams.set('harness',H);url.searchParams.set('state',S);history.replaceState(null,'',url);
}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function log(m){const d=document.createElement('div');d.innerHTML=`<span class="t">+${((Date.now()-t0)/1000).toFixed(1)}s</span>${m}`;logEl.appendChild(d);logEl.scrollTop=1e6}
function opz(title,kind,acts=[],cls=''){const z=$('opzone');z.className='opzone '+cls;z.innerHTML=`<div class="title ${kind||''}">${title}</div>${acts.length?'<div class="acts">'+acts.map((a,i)=>`<button class="${a.primary?'primary':''}" data-act="${i}">${a.label}</button>`).join('')+'</div>':''}`;
  z.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>acts[+b.dataset.act].fn());}
function dialog(title,body,acts){$('dlg').innerHTML=`<div class="dialog"><div><h3>${title}</h3><p>${body}</p><div class="acts">${acts.map((a,i)=>`<button class="${a.primary?'primary':''}" data-i="${i}">${a.label}</button>`).join('')}</div></div></div>`;
  $('dlg').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('dlg').innerHTML='';acts[+b.dataset.i].fn()})}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function typeTerm(cls,line){term.push([cls,line]);render()}
// ---------- rutas físicas simuladas ----------
async function liveApply(op){ // devuelve true si el marcador apareció
  const spec=HARNESS[H].live[op.field];const cmd=spec.cmd(op.to);
  log(`tmux send-keys → <b>${cmd}</b> en pane %3`);typeTerm('u','> '+cmd);await wait(500);
  if(spec.picker){typeTerm('d','Select model:  1) gpt-5.5-codex  2) gpt-5.5  ›');await wait(400);log('picker numerado: se elige por posición (frágil ante reorden de versión)');typeTerm('u','2');await wait(400);}
  if(spec.dialog){typeTerm('d',spec.dialog+'  1) Yes  2) No');await wait(500);log('diálogo del CLI contestado con 1');typeTerm('u','1');await wait(400);}
  typeTerm('m',spec.marker+op.to);log(`marcador <b>“${spec.marker.trim()}”</b> visto en pantalla → confirmado`);await wait(300);
  return true;
}
async function relaunch(op,{waitIdle}){
  if(waitIdle){opz('Esperando a que el pane esté libre…','wait');log('wait_idle: señal <b>'+(S==='caducada'?'caducada → leída como libre (bug actual)':S)+'</b>');
    if(S==='turno'||S==='permiso'){let n=0;while((S==='turno'||S==='permiso')&&n<30){await wait(1000);n++;opz(`Esperando a que el pane esté libre… ${n}s (tope 45 min)`,'wait',[{label:'Cancelar',fn:()=>{S='libre';}}]);}
      if(n>=30){log('la espera sigue; en producción hasta 45 min sin avisar');}}
  }
  if(S==='caducada'&&waitIdle){log('<b>relanza en medio de un turno real</b>: la señal decía libre');}
  opz('Guardando snapshot y saliendo del agente…','wait');log('snapshot de configuración guardado');await wait(500);
  typeTerm('u','/exit');await wait(500);typeTerm('s','$');await wait(400);
  const next={...cfg,[op.field]:op.to};const cmd=next.harness==='claude'?`claude --resume 8f2c… --model ${next.model} --effort ${next.effort}`:`${next.harness} resume 8f2c…`;
  const env=op.field==='account'?`CLAUDE_CONFIG_DIR=~/.claude-accounts/${op.to} `:'';
  typeTerm('s','$ '+env+cmd);log(`relanza: <b>${env}${cmd}</b>`);await wait(900);
  if(op.field==='harness'){typeTerm('a',`${next.harness} cli · conversación nueva`);typeTerm('a','[handoff] resumen del origen pegado como primer mensaje');log('harness distinto: no convierte historial; handoff explícito');}
  else{typeTerm('a',`${next.harness==='claude'?'Claude Code v2.1.160':next.harness+' cli'} · ${next.model} · reanudado`);}
  await wait(600);log('verify: identidad + modelo observado en arranque → confirmado');return true;
}
// ---------- políticas ----------
const POL={
 async A(op){
  const live=HARNESS[H].live[op.field];
  if(S==='turno'||S==='permiso'||S==='caducada'){const why=S==='caducada'?'No sé si el pane está libre: última señal hace 4 min.':S==='permiso'?'Hay un permiso sin contestar.':'Hay un turno en curso.';
    opz(why+' ¿Qué hago?','wait',[{label:'Esperar fin de turno',fn:()=>{pending.state='elegido';opz('Pendiente hasta fin de turno.','wait');log('encolado; la terminal no se toca');render();}},{label:'Interrumpir y aplicar',fn:async()=>{log('interrumpes explícitamente (C-c)');typeTerm('u','^C');S='libre';await POL.A(op);}},{label:'Cancelar',fn:()=>cancel()}]);render();return 'hold';}
  if(live){const ok=await liveApply(op);if(ok)return commit(op);}
  opz(`${H} no tiene vía en vivo comprobada para ${op.label}. Aplicarlo requiere reanudar la conversación (--resume conserva el historial, no la memoria interna del TUI).`,'err',[{label:'Reanudar ahora',primary:true,fn:async()=>{await relaunch(op,{waitIdle:false});commit(op)}},{label:'Cancelar',fn:cancel}]);return 'hold';
 },
 async B(op){await relaunch(op,{waitIdle:true});return commit(op);},
 async C(op){dialog(`Cambiar ${op.label} → ${op.to}`,HARNESS[H].live[op.field]?'Este harness admite el cambio dentro del proceso. ¿Cómo lo aplico?':'Este harness no tiene vía en vivo comprobada. Solo puedo reanudar.',
   [...(HARNESS[H].live[op.field]?[{label:'En vivo',primary:true,fn:async()=>{await liveApply(op);commit(op)}}]:[]),{label:'Reanudar',fn:async()=>{await relaunch(op,{waitIdle:false});commit(op)}},{label:'Cancelar',fn:cancel}]);return 'hold';},
 async D(op){
  const live=HARNESS[H].live[op.field];
  if(S!=='libre'){pending.state='elegido';opz(`Pendiente hasta fin de turno (${S}). La terminal no se toca; se aplicará ${live?'en vivo':'reanudando'} al terminar.`,'wait',[{label:'Cancelar',fn:cancel}]);queue.push(op);log('encolado hasta idle real; sin espera bloqueante');render();return 'hold';}
  if(live){await liveApply(op);return commit(op);}
  log('sin vía viva: reanuda automáticamente porque el pane está libre');await relaunch(op,{waitIdle:false});return commit(op);
 },
 async E(op){chosen[op.field]=op.to;pending=null;running=false;
  opz('Perfil de arranque editado. La conversación viva no cambia.','ok',[{label:'Reanudar con esta config',primary:true,fn:async()=>{running=true;render();await relaunch(op,{waitIdle:false});commit(op)}},{label:'Abrir pane nuevo con esta config',fn:()=>{log('abre pane %4 con '+JSON.stringify(chosen));opz('Pane %4 abierto con el perfil. Este pane sigue igual.','ok');}},{label:'Descartar',fn:()=>{chosen={...cfg};opz('Sin operación en curso.',null,[],'empty');render();}}]);render();return 'hold';}
};
function commit(op){cfg[op.field]=op.to;if(op.field==='harness'){cfg.model='gpt-5.5-codex';H='codex';}chosen={...cfg};pending=null;running=false;opz(`${op.label} → ${op.to} activo. Confirmado por ${HARNESS[H]&&HARNESS[H].live[op.field]&&V!=='B'?'marcador del CLI':'lectura del arranque'}.`,'ok');render();setTimeout(()=>{if(!running&&!pending){opz('Sin operación en curso.',null,[],'empty')}},7000);return 'done'}
function cancel(){pending=null;running=false;chosen={...cfg};queue=[];opz('Cancelado. Nada cambió.',null,[]);render()}
async function change(opk){if(running)return;const op=OPS[opk];if(cfg[op.field]===op.to){opz('Ya está activo.',null);return}
  running=true;pending={field:op.field,state:'elegido'};chosen[op.field]=op.to;log(`pides <b>${op.label} → ${op.to}</b> (destino fijado: sesión 2 · pane %3)`);render();
  const r=await POL[V](op);if(r==='done')return;render();}
// simulaciones del mundo real
const SIM={
 turnEnd:async()=>{if(S==='turno'||S==='caducada'){S='libre';typeTerm('a','Hecho: fix aplicado y tests en verde.');typeTerm('s','>');log('el turno termina de verdad');render();
   if(queue.length&&V==='D'){const op=queue.shift();log('D aplica lo encolado ahora');const live=HARNESS[H].live[op.field];if(live)await liveApply(op);else await relaunch(op,{waitIdle:false});commit(op);}}},
 permOk:()=>{if(S==='permiso'){typeTerm('u','1');S='turno';log('permiso aceptado; el turno sigue');render();}},
 manual:async()=>{if(!HARNESS[H].live.effort){log('este harness no tiene comando vivo que teclear');return}
   typeTerm('u','> /effort low');await wait(400);typeTerm('m','Set effort level to low');
   if(V==='E'){log('cambio manual: la barra lo ve en “vivo”, el perfil de arranque no cambia');cfg.effort='low';}
   else{log('cambio manual detectado por texto de pantalla → la barra lo refleja sin apropiárselo para otro pane');cfg.effort='low';chosen.effort='low';}
   render();},
 reset:()=>fresh(),
};
// ---------- picker ----------
function setV(k){V=k;fresh()}
$('prev').onclick=()=>setV(VARIANTS[(VARIANTS.findIndex(v=>v.k===V)+4)%5].k);$('next').onclick=()=>setV(VARIANTS[(VARIANTS.findIndex(v=>v.k===V)+1)%5].k);
document.addEventListener('keydown',e=>{if(/input|textarea/i.test(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowLeft')$('prev').click();if(e.key==='ArrowRight')$('next').click();});
document.getElementById('picker').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.h){H=b.dataset.h;fresh()}if(b.dataset.s){S=b.dataset.s;fresh()}if(b.dataset.op)change(b.dataset.op);if(b.dataset.sim)SIM[b.dataset.sim]();});
(function drag(){const p=$('picker'),g=$('grab');let sx,sy,ox,oy,on=false;g.addEventListener('pointerdown',e=>{on=true;sx=e.clientX;sy=e.clientY;const r=p.getBoundingClientRect();ox=r.left;oy=r.top;g.setPointerCapture(e.pointerId)});
 g.addEventListener('pointermove',e=>{if(!on)return;p.style.left=(ox+e.clientX-sx)+'px';p.style.top=(oy+e.clientY-sy)+'px';p.style.right='auto';p.style.bottom='auto'});g.addEventListener('pointerup',()=>on=false);
 g.addEventListener('dblclick',()=>p.classList.toggle('collapsed'));let tap=0;g.addEventListener('pointerup',e=>{if(Math.abs(e.clientX-sx)<4&&Math.abs(e.clientY-sy)<4&&innerWidth<=820)p.classList.toggle('collapsed')});if(innerWidth<=820)p.classList.add('collapsed');})();
fresh();
</script>
