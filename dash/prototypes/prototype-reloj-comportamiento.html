<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTIPO · Reloj: comportamiento</title>
<!-- PROTOTIPO DESECHABLE (grill-design, bloque 5, ronda 3). Tiempo simulado ×60. -->
<style>
:root{--bg:#0b1119;--panel:#101824;--panel2:#141e2c;--line:#223044;--ink:#e6edf5;--mut:#8a98ab;--dim:#5d6b7e;--acc:#8b7cf6;--green:#4ade80;--amber:#f5b83d}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.stage{max-width:1100px;margin:0 auto;padding:18px 16px 240px}
h2{font-size:13px;color:var(--dim);letter-spacing:.8px;text-transform:uppercase;margin:22px 0 8px}
.hdr{display:flex;align-items:center;gap:6px;height:48px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.hdr .brand{font:700 12px system-ui;letter-spacing:1.5px;margin-right:auto}
.ib{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;position:relative}
.ib svg{width:18px;height:18px;stroke:var(--mut);fill:none;stroke-width:1.8;stroke-linecap:round}
.hg{image-rendering:pixelated;display:block;object-fit:contain;transition:transform .5s}
.ib .hg{width:24px;height:24px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pomo{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:16px;display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
.pomo .big{width:112px;height:112px;display:grid;place-items:center;background:var(--panel2);border-radius:12px}
.pomo .big .hg{width:96px;height:96px}
.pomo h3{margin:0 0 4px;font-size:30px;font-variant-numeric:tabular-nums}
.pomo p{margin:0;color:var(--mut)}
.bar{height:8px;border-radius:4px;background:var(--panel2);margin-top:10px;overflow:hidden}.bar b{display:block;height:100%;background:var(--acc)}
.dim .hg{filter:saturate(.35) brightness(.8)}
.note{color:var(--mut);font-size:13px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin-top:14px}
.picker{position:fixed;right:14px;bottom:14px;z-index:9;width:440px;background:#17122a;color:#ece8ff;border:1px solid #3b3170;border-radius:14px;box-shadow:0 18px 50px #000c;padding:10px;font-size:13px;user-select:none}
.picker .drag{cursor:move;display:flex;gap:8px;align-items:center;margin-bottom:8px}.picker .drag b{margin-right:auto}
.picker .nav{display:grid;grid-template-columns:30px 1fr 30px;gap:6px}
.picker .nav button,.picker .opts button{border:1px solid #3b3170;border-radius:7px;height:30px}
.picker .name{border:1px solid #8b7cf6;background:#241c44;border-radius:7px;display:flex;align-items:center;padding:0 10px;font-weight:600}
.picker .opts{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px}
.picker .opts button.on,.picker .st button.on{background:#8b7cf6;color:#12091f}
.picker .desc{margin-top:8px;color:#c9c1f4;font-size:12px}
.picker .st{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.picker .st button{border:1px solid #3b3170;border-radius:7px;padding:4px 8px}
.picker input{width:100%;margin-top:8px}
@media (max-width:640px){.picker{width:calc(100% - 20px);right:10px}.row,.pomo{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="picker" id="picker"></div>
<script>
// Cuadros reales: A (Davitheoles) 0-20 llenado + 21-26 giro; B (Alexti) 0-4 chorrito en bucle.
const A = {name:'A · Davitheoles', fill:[...Array(21).keys()], flip:[21,22,23,24,25,26], dir:'assets/hourglass/dav/'};
const B = {name:'B · Alexti', loop:[0,1,2,3,4], dir:'assets/hourglass/alx/'};
const V = [
 {k:'A', n:'Bucle continuo', d:'Mientras corre, la animación se repite a su velocidad natural (como hoy). En pausa se congela; al terminar no hace nada especial.'},
 {k:'B', n:'Arena = tiempo real', d:'El cuadro depende de cuánto va de la sesión: la arena avanza de verdad hasta el final y ahí da el giro. B (sin cuadros de nivel) solo gotea y se vacía con un fundido.'},
 {k:'C', n:'Tiempo real + goteo', d:'Como B, pero con un chorrito vivo encima para que se note que corre, aunque la arena avance lento en una sesión de 25 min.'},
 {k:'D', n:'Quieto y anima en hitos', d:'Estático mientras trabajas (sin distracción). Anima una vuelta completa cada 5 minutos y al terminar la sesión.'},
 {k:'E', n:'Acelera al final', d:'Bucle lento al empezar que se acelera en los últimos 5 minutos y gira al terminar: se siente la presión del tiempo.'},
];
const P=new URLSearchParams(location.search);
const S={i:Math.max(0,V.findIndex(v=>v.k===P.get('variant'))),style:P.get('style')==='B'?B:A,state:'run',mode:'foco',total:25*60,el:6*60,t:0,flipAt:-1,burst:-1};
function frameFor(st){
  const v=V[S.i].k, p=Math.min(1,S.el/S.total), tick=Math.floor(S.t/100);
  if(S.state==='done'||S.flipAt>=0){ if(st.flip){const f=Math.min(st.flip.length-1,Math.floor((S.t-S.flipAt)/100)); return st.flip[Math.max(0,f)];} return st.loop[tick%st.loop.length]; }
  if(S.state==='pause') return st.fill?st.fill[Math.floor(p*20)]:st.loop[0];
  if(v==='A') return st.fill?st.fill[tick%21]:st.loop[tick%5];
  if(v==='B') return st.fill?st.fill[Math.floor(p*20)]:st.loop[Math.floor(S.t/260)%5];
  if(v==='C') return st.fill?st.fill[Math.min(20,Math.floor(p*20)+(tick%3===0?1:0))]:st.loop[tick%5];
  if(v==='D'){ if(S.burst>=0){const f=Math.floor((S.t-S.burst)/100); if(f<(st.fill||st.loop).length) return (st.fill||st.loop)[f]; S.burst=-1;} return (st.fill||st.loop)[0]; }
  if(v==='E'){ const left=S.total-S.el, speed=left<300?40:220; return (st.fill||st.loop)[Math.floor(S.t/speed)%(st.fill||st.loop).length]; }
}
function src(){const st=S.style;return st.dir+String(frameFor(st)).padStart(2,'0')+'.png';}
function mmss(s){s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function render(){
  const left=S.total-S.el, v=V[S.i];
  const fade = S.style===B && v.k==='B' && S.state!=='done' ? `opacity:${0.35+0.65*(1-S.el/S.total)}` : '';
  document.getElementById('stage').innerHTML=`
  <h2>Cabecera de escritorio</h2>
  <div class="hdr ${S.state==='pause'?'dim':''}"><span class="brand">COMANDOS</span>
   <button class="ib"><img class="hg" id="hg1" style="${fade}" src="${src()}"></button>
   <button class="ib"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg></button>
   <button class="ib"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/></svg></button></div>
  <h2>Pomodoro abierto · estilo ${S.style.name}</h2>
  <div class="pomo ${S.state==='pause'?'dim':''}"><div class="big"><img class="hg" id="hg2" style="${fade}" src="${src()}"></div>
   <div><p>${S.mode==='foco'?'Foco':'Descanso'} · ${{run:'corriendo',pause:'en pausa',done:'¡terminó!'}[S.state]}</p><h3>${mmss(left)}</h3>
   <p>Regla de tiempo · ComandOS</p><div class="bar"><b style="width:${100*S.el/S.total}%"></b></div></div></div>
  <div class="note">Tiempo simulado ×60 (1 s = 1 min). Mueve la barra del selector para saltar a cualquier minuto.</div>`;
  picker();
}
function paint(){ const s=src(); for(const id of ['hg1','hg2']){const e=document.getElementById(id); if(e&&!e.src.endsWith(s)) e.src=s;} }
function picker(){
  const v=V[S.i],pk=document.getElementById('picker');
  pk.innerHTML=`<div class="drag" data-h><b>Grill · Reloj · ronda 3: comportamiento</b></div>
  <div class="nav"><button data-s="-1">←</button><div class="name">${v.k} · ${v.n}</div><button data-s="1">→</button></div>
  <div class="opts">${V.map((x,i)=>`<button class="${i===S.i?'on':''}" data-i="${i}">${x.k}</button>`).join('')}</div>
  <div class="desc">${v.d}</div>
  <div class="st"><button class="${S.style===A?'on':''}" data-style="A">Estilo A</button><button class="${S.style===B?'on':''}" data-style="B">Estilo B</button>
   <button class="${S.state==='run'?'on':''}" data-state="run">Corriendo</button><button class="${S.state==='pause'?'on':''}" data-state="pause">Pausa</button>
   <button class="${S.state==='done'?'on':''}" data-state="done">Terminó</button><button class="${S.mode==='descanso'?'on':''}" data-mode>Descanso</button></div>
  <input type="range" min="0" max="${S.total}" value="${S.el}" data-range aria-label="Minuto de la sesión">`;
}
let last=performance.now(), simAcc=0;
function loop(now){const dt=now-last;last=now;S.t+=dt;
  if(S.state==='run'){S.el+=dt/1000*60; if(S.el>=S.total){S.el=S.total;S.state='done';S.flipAt=S.t;render();}
    if(V[S.i].k==='D'){const m=Math.floor(S.el/300); if(m!==S._m){S._m=m; if(m>0) S.burst=S.t;}}}
  if(S.flipAt>=0 && S.t-S.flipAt>1400 && S.state==='done'){S.flipAt=-1;}
  paint(); const r=document.querySelector('[data-range]'); if(r&&document.activeElement!==r) r.value=S.el;
  const h=document.querySelector('.pomo h3'); if(h) h.textContent=mmss(S.total-S.el);
  const b=document.querySelector('.bar b'); if(b) b.style.width=(100*S.el/S.total)+'%';
  requestAnimationFrame(loop);}
document.addEventListener('click',e=>{const t=e.target.closest('[data-s],[data-i],[data-style],[data-state],[data-mode]');if(!t)return;
 if(t.dataset.s) S.i=(S.i+ +t.dataset.s+V.length)%V.length; else if(t.dataset.i) S.i=+t.dataset.i;
 else if(t.dataset.style) S.style=t.dataset.style==='B'?B:A;
 else if(t.dataset.state){S.state=t.dataset.state; if(S.state==='done'){S.el=S.total;S.flipAt=S.t;} else if(S.el>=S.total){S.el=0;S.flipAt=-1;}}
 else if(t.hasAttribute('data-mode')){S.mode=S.mode==='foco'?'descanso':'foco';S.total=S.mode==='foco'?1500:300;S.el=0;S.state='run';}
 history.replaceState(null,'',`?variant=${V[S.i].k}&style=${S.style===B?'B':'A'}`); render();});
document.addEventListener('input',e=>{if(e.target.matches('[data-range]')){S.el=+e.target.value;if(S.state==='done')S.state='run';S.flipAt=-1;}});
document.addEventListener('keydown',e=>{if(e.target.matches('input'))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){S.i=(S.i+(e.key==='ArrowRight'?1:V.length-1))%V.length;render();}});
(function(){const pk=document.getElementById('picker');let sx,sy,ox,oy;pk.addEventListener('pointerdown',e=>{if(!e.target.closest('[data-h]'))return;const r=pk.getBoundingClientRect();sx=e.clientX;sy=e.clientY;ox=r.left;oy=r.top;
 const mv=ev=>{pk.style.left=ox+ev.clientX-sx+'px';pk.style.top=oy+ev.clientY-sy+'px';pk.style.right='auto';pk.style.bottom='auto'};const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};addEventListener('pointermove',mv);addEventListener('pointerup',up)})})();
render(); requestAnimationFrame(loop);
</script>
</body>
</html>
