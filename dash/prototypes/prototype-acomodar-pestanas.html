<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTIPO · Acomodar pestañas sin errores</title>
<!-- PROTOTIPO DESECHABLE (grill-design, bloque 3, ronda 2). Reordenar sin precisión:
     nada depende de soltar en el pixel correcto y todo tiene Deshacer. -->
<style>
:root{--bg:#0b1119;--panel:#101824;--panel2:#141e2c;--line:#223044;--line2:#2e3852;--ink:#e6edf5;--mut:#8a98ab;--dim:#5d6b7e;--acc:#8b7cf6;--green:#4ade80;--amber:#f5b83d;--red:#f87171;--blue:#60a5fa}
*{box-sizing:border-box}html,body{margin:0;background:#070b11;color:var(--ink);font:13px/1.4 system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.frame{margin:18px auto;max-width:1100px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg);position:relative;min-height:520px}
.frame.phone{max-width:390px}
.top{display:flex;align-items:center;gap:8px;height:46px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.top b{letter-spacing:1.5px;font-size:12px;margin-right:auto}
.k{height:32px;min-width:32px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);box-shadow:0 3px 0 var(--line2);color:var(--mut);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.k:active{transform:translateY(2px);box-shadow:none}.k.pri{background:var(--acc);color:#12091f;border-color:#3a2d80;box-shadow:0 3px 0 #3a2d80;font-weight:700}
.k.big{height:44px;min-width:44px;font-size:16px}
.bar{display:flex;overflow-x:auto;scrollbar-width:thin;min-height:44px;border-bottom:1px solid var(--line);background:var(--panel)}
.tab{flex:none;display:flex;align-items:center;gap:7px;padding:0 12px;height:44px;border-right:1px solid var(--line);white-space:nowrap;color:var(--mut);background:var(--panel);user-select:none;cursor:pointer;position:relative;transition:transform .25s cubic-bezier(.3,1.3,.5,1),background .2s}
.tab.cur{color:var(--ink);box-shadow:inset 0 -2px var(--acc);background:var(--panel2)}
.tab.pick{background:#241c44;box-shadow:inset 0 0 0 2px var(--acc)}
.tab.flash{animation:flash .6s}@keyframes flash{0%{background:#3a2d80}}
.tab .pos{font:800 10px system-ui;color:var(--dim);min-width:16px}
.ai{width:11px;height:11px;border-radius:50%;flex:none;border:2px dotted var(--dim)}
.ai.work{border:0;background:conic-gradient(from 0deg,transparent 0 35%,#4ade8033 50%,#4ade80 92%,transparent 92%);-webkit-mask:radial-gradient(circle,transparent 2.5px,#000 3px);mask:radial-gradient(circle,transparent 2.5px,#000 3px);animation:comet 1.15s cubic-bezier(.55,.1,.45,.9) infinite}
.ai.need{border:0;background:var(--amber);animation:ping 1.2s infinite}
@keyframes comet{to{transform:rotate(360deg)}}@keyframes ping{50%{opacity:.35}}
/* B: flechas sobre la pestaña activa */
.arrows{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:#12101f;align-items:center;flex-wrap:wrap}
.arrows .lbl{color:var(--mut);margin-right:auto}
/* A: menú mover */
.menu{position:absolute;z-index:40;min-width:260px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:0 18px 40px #000b;padding:6px}
.menu h6{margin:6px 8px;font:600 10px system-ui;color:var(--dim);text-transform:uppercase;letter-spacing:.8px}
.menu button.it{display:flex;gap:10px;width:100%;padding:9px 10px;border-radius:8px;text-align:left}.menu button.it:hover{background:var(--panel2)}
.menu input{width:100%;margin:4px 0 6px;padding:8px 10px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);color:var(--ink)}
.menu .list{max-height:220px;overflow:auto}
/* C: lista vertical */
.sheet{position:absolute;inset:46px 0 0 0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.sheet header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.sheet header b{margin-right:auto;font-size:15px}
.rows{overflow:auto;padding:8px 12px}
.row{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:8px 10px;margin-bottom:6px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);transition:transform .25s cubic-bezier(.3,1.3,.5,1)}
.row .num{font:800 12px system-ui;color:var(--acc);text-align:center}
.row .acts{display:flex;gap:6px}
.row.flash{animation:flash .6s}
/* D: modo intercambiar */
.banner{padding:8px 14px;background:#241c44;color:#e7e1ff;border-bottom:1px solid #3b3170;display:flex;gap:10px;align-items:center}
.banner b{margin-right:auto}
/* E: número de posición */
.numpad{position:absolute;z-index:40;background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:12px;box-shadow:0 18px 40px #000b;width:250px}
.numpad .disp{font:800 22px ui-monospace,monospace;text-align:center;padding:6px;border-radius:8px;background:var(--bg);margin-bottom:8px}
.numpad .g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.body{padding:16px;color:var(--mut)}.body b{color:var(--ink)}.hint{max-width:760px;margin:0 0 8px}
.undo{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:12px;align-items:center;background:#1c2540;border:1px solid #3b4a74;padding:8px 10px 8px 14px;border-radius:12px;z-index:50;box-shadow:0 10px 24px #000a}
.picker{position:fixed;right:14px;bottom:14px;z-index:99;width:450px;background:#17122a;color:#ece8ff;border:1px solid #3b3170;border-radius:14px;box-shadow:0 18px 50px #000c;padding:10px;font-size:13px;user-select:none}
.picker .drag{cursor:move;display:flex;gap:8px;align-items:center;margin-bottom:8px}.picker .drag b{margin-right:auto}
.picker .nav{display:grid;grid-template-columns:30px 1fr 30px;gap:6px}
.picker .nav button,.picker .opts button,.picker .st button{border:1px solid #3b3170;border-radius:7px;height:30px}
.picker .name{border:1px solid #8b7cf6;background:#241c44;border-radius:7px;display:flex;align-items:center;padding:0 10px;font-weight:600}
.picker .opts{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px}
.picker .opts button.on,.picker .st button.on{background:#8b7cf6;color:#12091f}
.picker .st{display:flex;gap:6px;margin-top:8px}.picker .st button{padding:0 8px}
.picker .desc{margin-top:8px;color:#c9c1f4;font-size:12px}
@media (max-width:640px){.picker{width:calc(100% - 20px);right:10px}.frame{margin:8px}}
</style>
</head>
<body>
<div class="frame" id="frame"></div>
<div class="picker" id="picker"></div>
<script>
const BASE=['ComandOS ⎇','PaginasWeb','SAVA','MRP','Merauto','Signara','LimpiezaDigital','RWAAirbnb','Kleis','Relotto','TranscriptRealTime','Dashboard','FerLongoria','NinjaCatBot','Cobbler',
 'Lola-Landing','Chips','Scarlett','0xAiBuilders','Samuel','QCDR','Threads0x','Solana-Bot','Radek-Docs','Superteam','Hisa-Video','Colosseum','Metaverso','Relotto-API'];
const AI={0:'work',2:'need',3:'work',5:'need'};
const TABS=[{id:'local',label:'local',ai:''}].concat(BASE.map((l,i)=>({id:'t'+i,label:l,ai:AI[i]||''})));
const V=[
 {k:'A',n:'Menú «Mover…»',d:'Clic derecho (o mantener presionada) en la pestaña → «Mover»: Al principio · Una a la izquierda · Una a la derecha · Al final · Después de… (con buscador por nombre). Cero precisión.'},
 {k:'B',n:'Flechas en la pestaña activa',d:'Debajo de la barra, una franja con ⏮ ◀ ▶ ⏭ que mueve la pestaña ACTIVA. Cada toque = una posición; mantener = repite. La barra la sigue para que nunca la pierdas.'},
 {k:'C',n:'Lista «Acomodar»',d:'El botón «Acomodar» abre una lista vertical grande con todas las pestañas numeradas; cada fila tiene ↑ ↓ ⤒ ⤓. Vertical cabe todo y los botones son grandes. «Listo» para cerrar.'},
 {k:'D',n:'Tocar dos para intercambiar',d:'Botón «Intercambiar»: tocas una pestaña y luego otra, y cambian de lugar. Para dejar una en tal posición, la intercambias con la que está ahí.'},
 {k:'E',n:'Escribir la posición',d:'Clic derecho → «Posición…»: aparece un teclado numérico con la posición actual; escribes el número (1–30) y Enter. Exacto al primer intento.'},
];
const P=new URLSearchParams(location.search);
const S={i:Math.max(0,V.findIndex(v=>v.k===P.get('variant'))),phone:P.get('phone')==='1',cur:'t0',menu:null,sheet:false,swap:false,swapA:null,pad:null,undo:null,flash:null};
const $=s=>document.querySelector(s);
let audio=null;function beep(f=700,d=.04){try{audio=audio||new AudioContext();const o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=f;g.gain.value=.03;o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}catch(e){}}
const idx=id=>TABS.findIndex(t=>t.id===id);
function move(id,to){const from=idx(id);to=Math.max(1,Math.min(TABS.length-1,to));if(from<1||from===to)return;
  S.undo={order:TABS.map(t=>t.id),msg:`${TABS[from].label} → posición ${to}`};const [t]=TABS.splice(from,1);TABS.splice(to,0,t);S.flash=id;beep(520+to*8,.05);
  clearTimeout(move.t);move.t=setTimeout(()=>{S.undo=null;render();},6000);}
function undo(){const o=S.undo.order;TABS.sort((a,b)=>o.indexOf(a.id)-o.indexOf(b.id));S.undo=null;beep(400,.05);}
function tabHtml(t,i){return `<div class="tab ${t.id===S.cur?'cur':''} ${S.swapA===t.id?'pick':''} ${S.flash===t.id?'flash':''}" data-tab="${t.id}"><span class="pos">${i}</span><span class="ai ${t.ai}"></span>${t.label}</div>`;}
function render(){
  const v=V[S.i].k, cur=TABS[idx(S.cur)];
  $('#frame').className='frame'+(S.phone?' phone':'');
  $('#frame').innerHTML=`<div class="top"><b>● COMANDOS</b><button class="k">⇅ Ordenar una vez</button>
    ${v==='C'?`<button class="k pri" data-act="sheet">☰ Acomodar</button>`:''}${v==='D'?`<button class="k ${S.swap?'pri':''}" data-act="swap">⇄ Intercambiar</button>`:''}</div>
   <div class="bar" id="bar">${TABS.map(tabHtml).join('')}</div>
   ${v==='B'&&S.cur!=='local'?`<div class="arrows"><span class="lbl">Mover <b style="color:var(--ink)">${cur.label}</b> · posición ${idx(S.cur)} de ${TABS.length-1}</span>
     <button class="k big" data-mv="first" title="Al principio">⏮</button><button class="k big" data-mv="-1" title="Una a la izquierda">◀</button><button class="k big" data-mv="1" title="Una a la derecha">▶</button><button class="k big" data-mv="last" title="Al final">⏭</button></div>`:''}
   ${v==='D'&&S.swap?`<div class="banner"><b>${S.swapA?'Ahora toca la pestaña con la que cambia de lugar':'Toca la primera pestaña'}</b><button class="k" data-act="swap">Terminar</button></div>`:''}
   <div class="body"><p class="hint"><b>Reordenar:</b> ${V[S.i].d}</p>
    <p class="hint"><b>Estado (cerrado):</b> arrastrar la pestaña hacia abajo a una bandeja. Aquí el arrastre de lado está desactivado a propósito: ya no hay forma de soltarla en un lugar equivocado.</p>
    <p class="hint">Prueba: manda <b>ComandOS</b> al final y <b>Relotto-API</b> a la posición 2. Cada movimiento se puede deshacer.</p></div>
   ${S.menu?menuHtml():''}${S.sheet?sheetHtml():''}${S.pad?padHtml():''}
   ${S.undo?`<div class="undo">✓ ${S.undo.msg}<button class="k" data-act="undo">↶ Deshacer</button></div>`:''}`;
  S.flash=null;
  const el=$(`#bar [data-tab="${S.cur}"]`);if(el&&(v==='B'))el.scrollIntoView({inline:'center',block:'nearest'});
  picker();
}
function menuHtml(){const t=TABS[idx(S.menu.id)],v=V[S.i].k;
  if(v==='E')return `<div class="menu" style="left:${S.menu.x}px;top:${S.menu.y}px"><h6>${t.label}</h6><button class="it" data-pad="${t.id}">🔢 Posición… (ahora ${idx(t.id)})</button></div>`;
  const q=(S.menu.q||'').toLowerCase();
  return `<div class="menu" style="left:${S.menu.x}px;top:${S.menu.y}px"><h6>Mover ${t.label} (posición ${idx(t.id)})</h6>
   <button class="it" data-mt="first">⏮ Al principio</button><button class="it" data-mt="-1">◀ Una a la izquierda</button><button class="it" data-mt="1">▶ Una a la derecha</button><button class="it" data-mt="last">⏭ Al final</button>
   <h6>Después de…</h6><input id="mq" placeholder="Buscar pestaña…" value="${S.menu.q||''}" autocomplete="off">
   <div class="list">${TABS.filter(x=>x.id!==t.id&&x.label.toLowerCase().includes(q)).slice(0,12).map(x=>`<button class="it" data-after="${x.id}">${idx(x.id)} · ${x.label}</button>`).join('')}</div></div>`;}
function sheetHtml(){return `<div class="sheet"><header><b>Acomodar pestañas</b>${S.undo?`<button class="k" data-act="undo">↶ Deshacer</button>`:''}<button class="k pri" data-act="sheet">Listo</button></header>
 <div class="rows">${TABS.map((t,i)=>`<div class="row ${S.flash===t.id?'flash':''}"><span class="num">${i||'—'}</span><span><span class="ai ${t.ai}" style="display:inline-block;vertical-align:-1px;margin-right:6px"></span>${t.label}</span>
 ${i?`<span class="acts"><button class="k" data-rw="first:${t.id}" title="Al principio">⤒</button><button class="k" data-rw="-1:${t.id}">↑</button><button class="k" data-rw="1:${t.id}">↓</button><button class="k" data-rw="last:${t.id}" title="Al final">⤓</button></span>`:'<span style="color:var(--dim)">fija</span>'}</div>`).join('')}</div></div>`;}
function padHtml(){const t=TABS[idx(S.pad.id)];return `<div class="numpad" style="left:${S.pad.x}px;top:${S.pad.y}px"><div style="color:var(--mut);margin-bottom:6px">${t.label} · posición (1–${TABS.length-1})</div><div class="disp">${S.pad.v||'_'}</div>
 <div class="g">${[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(n=>`<button class="k big" data-np="${n}">${n}</button>`).join('')}</div></div>`;}
function picker(){const v=V[S.i];
  $('#picker').innerHTML=`<div class="drag" data-h><b>Grill · Acomodar sin errores</b><span style="color:#8f86c2;font-size:11px">←/→</span></div>
  <div class="nav"><button data-s="-1">←</button><div class="name">${v.k} · ${v.n}</div><button data-s="1">→</button></div>
  <div class="opts">${V.map((x,i)=>`<button class="${i===S.i?'on':''}" data-v="${i}">${x.k}</button>`).join('')}</div><div class="desc">${v.d}</div>
  <div class="st"><button class="${S.phone?'on':''}" data-t="phone">Celular 390 px</button></div>`;}
function target(id,how){const i=idx(id);return how==='first'?1:how==='last'?TABS.length-1:i+ +how;}
let repeat=null;
document.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-mv]');if(!b)return;const how=b.dataset.mv;
  const step=()=>{move(S.cur,target(S.cur,how));render();};step();
  if(how==='1'||how==='-1'){clearInterval(repeat);let t0=setTimeout(()=>{repeat=setInterval(step,140);},380);const stop=()=>{clearTimeout(t0);clearInterval(repeat);removeEventListener('pointerup',stop);};addEventListener('pointerup',stop);}});
document.addEventListener('contextmenu',e=>{const t=e.target.closest('[data-tab]');if(!t||t.dataset.tab==='local'||!['A','E'].includes(V[S.i].k))return;e.preventDefault();
  const fr=$('#frame').getBoundingClientRect();S.menu={id:t.dataset.tab,x:Math.min(e.clientX-fr.left,fr.width-270),y:e.clientY-fr.top+6};render();$('#mq')?.focus();});
document.addEventListener('input',e=>{if(e.target.id==='mq'){S.menu.q=e.target.value;const pos=e.target.selectionStart;render();const i=$('#mq');i.focus();i.setSelectionRange(pos,pos);}});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-s],[data-v],[data-t],[data-act],[data-tab],[data-mt],[data-after],[data-rw],[data-pad],[data-np]');
  if(!t){if(S.menu||S.pad){S.menu=null;S.pad=null;render();}return;}const d=t.dataset;
  if(d.s){S.i=(S.i+ +d.s+V.length)%V.length;S.sheet=S.swap=false;}else if(d.v){S.i=+d.v;S.sheet=S.swap=false;}else if(d.t==='phone')S.phone=!S.phone;
  else if(d.act==='sheet')S.sheet=!S.sheet;else if(d.act==='swap'){S.swap=!S.swap;S.swapA=null;}else if(d.act==='undo')undo();
  else if(d.mt){move(S.menu.id,target(S.menu.id,d.mt));S.menu=null;}
  else if(d.after){const to=idx(d.after)+(idx(d.after)<idx(S.menu.id)?1:0);move(S.menu.id,to);S.menu=null;}
  else if(d.rw){const [how,id]=d.rw.split(':');move(id,target(id,how));}
  else if(d.pad){S.pad={id:d.pad,x:S.menu.x,y:S.menu.y,v:''};S.menu=null;}
  else if(d.np){const n=d.np;if(n==='⌫')S.pad.v=S.pad.v.slice(0,-1);else if(n==='✓'){if(S.pad.v)move(S.pad.id,+S.pad.v);S.pad=null;}else if(S.pad.v.length<2)S.pad.v+=n;}
  else if(d.tab){const id=d.tab;
    if(S.swap&&id!=='local'){if(!S.swapA){S.swapA=id;beep(600,.03);}else if(S.swapA!==id){const a=idx(S.swapA),b=idx(id);S.undo={order:TABS.map(x=>x.id),msg:`${TABS[a].label} ⇄ ${TABS[b].label}`};[TABS[a],TABS[b]]=[TABS[b],TABS[a]];S.flash=id;S.swapA=null;beep(800,.06);}}
    else S.cur=id;}
  history.replaceState(null,'',`?variant=${V[S.i].k}${S.phone?'&phone=1':''}`);render();});
document.addEventListener('keydown',e=>{if(e.target.id==='mq')return;
  if(S.pad&&/^[0-9]$/.test(e.key)){if(S.pad.v.length<2)S.pad.v+=e.key;render();return;}
  if(S.pad&&e.key==='Enter'){if(S.pad.v)move(S.pad.id,+S.pad.v);S.pad=null;render();return;}
  if(e.key==='Escape'){S.menu=S.pad=null;S.sheet=false;S.swap=false;render();return;}
  if(e.ctrlKey&&e.key==='z'&&S.undo){undo();render();return;}
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){S.i=(S.i+(e.key==='ArrowRight'?1:4))%5;S.sheet=S.swap=false;render();}});
(function(){const pk=$('#picker');let sx,sy,ox,oy;pk.addEventListener('pointerdown',e=>{if(!e.target.closest('[data-h]'))return;const r=pk.getBoundingClientRect();sx=e.clientX;sy=e.clientY;ox=r.left;oy=r.top;
 const mv=ev=>{pk.style.left=ox+ev.clientX-sx+'px';pk.style.top=oy+ev.clientY-sy+'px';pk.style.right='auto';pk.style.bottom='auto'};const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};addEventListener('pointermove',mv);addEventListener('pointerup',up)})})();
render();
</script>
</body>
</html>
