[workspace]
members = ["crates/comandos-core", "crates/comandos-store", "crates/comandos-runtime", "crates/comandos-extensions", "crates/comandos-server", "crates/comandos-cli", "crates/comandos-notifyd", "crates/comandos-term", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
serde_json = { version = "=1.0.150", features = ["arbitrary_precision", "float_roundtrip", "raw_value", "preserve_order"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["backup", "bundled"] }
getrandom = { version = "=0.3.4", features = ["std"] }
sha2 = "=0.10.9"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
chrono-tz = { version = "=0.10.4", default-features = false, features = ["std"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"

# `alacritty_terminal` vendorizado con el parche wasm (vendor/alacritty_terminal/COMANDOS-PATCH.md).
[patch.crates-io]
alacritty_terminal = { path = "vendor/alacritty_terminal" }
