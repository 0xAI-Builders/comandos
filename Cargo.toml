[workspace]
members = ["crates/comandos-core", "crates/comandos-store", "crates/comandos-runtime", "crates/comandos-extensions"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
serde_json = "=1.0.150"
rusqlite = { version = "=0.40.2", default-features = false, features = ["backup"] }
getrandom = { version = "=0.3.4", features = ["std"] }
sha2 = "=0.10.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"
