[workspace]
members = ["crates/comandos-core", "crates/comandos-store"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
serde_json = "=1.0.150"
rusqlite = { version = "=0.40.2", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"
