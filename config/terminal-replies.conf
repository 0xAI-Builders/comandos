# tmux 3.2a lets repeated/late DA2 replies fall through as keyboard input.
# Consume replies from bundled xterm.js and VTE 0.68 before they reach a pane.
# Normal text such as "65;6800;1c" has no ESC prefix and remains untouched.
# Use empty user-key slots only. These bindings send zero bytes; no subprocess.
if-shell -F '#{==:#{user-keys[990]},}' {
    set-option -s user-keys[990] "\033[>0;276;0c"
    bind-key -T root User990 send-keys -l ''
}
if-shell -F '#{==:#{user-keys[991]},}' {
    set-option -s user-keys[991] "\033[>65;6800;1c"
    bind-key -T root User991 send-keys -l ''
}
