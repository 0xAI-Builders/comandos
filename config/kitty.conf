# Kitty para el flujo Centro Claude: alta legibilidad, cero fricción.
# Tema propio de alto contraste (misma paleta del Centro Claude).

# --- Tipografia: JetBrains Mono (disenada para jornadas largas de codigo) ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        14.0
adjust_line_height 108%

# --- Tema comodo para horas: fondo azul-gris oscuro (no negro puro), texto suave ---
foreground #EAF0FB
background #0A0D13
selection_foreground #0A0D13
selection_background #7AA5FF
cursor #FFAE1A
cursor_text_color #0B0D12
cursor_shape block
cursor_blink_interval 0.6
url_color #7AA5FF

# ANSI de alto contraste
color0  #1c2130
color8  #5A6376
color1  #FF6B6B
color9  #FF8F8F
color2  #2EE59D
color10 #6FE3AF
color3  #FFAE1A
color11 #FFC85C
color4  #7AA5FF
color12 #93B8FF
color5  #C792EA
color13 #DDB3F5
color6  #4DD0E1
color14 #86E3F0
color7  #E9ECF5
color15 #FFFFFF

# --- Comportamiento ---
enable_audio_bell no
visual_bell_duration 0.15
confirm_os_window_close 0
remember_window_size yes
scrollback_lines 10000
mouse_hide_wait 2.0
strip_trailing_spaces smart

# Al abrir Kitty "en blanco": engancharse a tmux (ultima sesion usada)
startup_session session-tmux.conf

# Zoom rapido de letra (accesibilidad): Ctrl+Shift +/-/0
map ctrl+shift+equal change_font_size all +1.5
map ctrl+shift+minus change_font_size all -1.5
map ctrl+shift+0 change_font_size all 0

# Clipboard natural: Ctrl+V pega, Ctrl+C copia si hay seleccion (si no, interrumpe)
map ctrl+v paste_from_clipboard
map ctrl+c copy_or_interrupt
copy_on_select clipboard
